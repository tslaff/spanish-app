id: catecismo_16
name: Catecismo 16
sentences:
- es: ¿Qué nos manda el octavo mandamiento? (What does the eighth commandment command us?)
  en: El octavo mandamiento nos manda decir la verdad y respetar la fama del prójimo. (The eighth commandment commands us
    to speak the truth and to respect our neighbor's good name.)
- es: ¿Qué prohíbe el octavo mandamiento? (What does the eighth commandment forbid?)
  en: El octavo mandamiento prohíbe la mentira, la calumnia, la maledicencia o difamación, el falso testimonio, el juicio
    temerario y toda ofensa contra el honor y la fama del prójimo. (The eighth commandment forbids lying, slander, backbiting
    or defamation, false testimony, rash judgment, and every offense against the honor and reputation of our neighbor.)
- es: ¿Qué es mentir? (What is to lie?)
  en: Mentir es decir lo contrario de lo que se piensa, con intención de engañar. (To lie is to say the opposite of what one
    thinks, with the intention of deceiving.)
- es: ¿Qué es calumniar? (What is to slander?)
  en: Calumniar es atribuir al prójimo pecados o defectos que no tiene. (To slander is to attribute to one's neighbor sins
    or faults that he does not have.)
- es: ¿Qué es la maledicencia? (What is backbiting?)
  en: La maledicencia o difamación es hablar mal del prójimo, difundiendo sus defectos y privándole de su fama. (Backbiting
    or defamation is to speak ill of one's neighbor, spreading his faults and depriving him of his good name.)
- es: ¿Qué es falso testimonio? (What is false testimony?)
  en: Falso testimonio es declarar en juicio alguna cosa contra la verdad. (False testimony is to declare in judgment something
    contrary to the truth.)
- es: ¿Qué es juicio temerario? (What is rash judgment?)
  en: Juicio temerario es juzgar mal del prójimo sin motivo suficiente. (Rash judgment is to judge one's neighbor unfavorably
    without sufficient reason.)
- es: ¿A qué están obligados los que han perjudicado al prójimo en su fama? (What are those who have harmed their neighbor's
    reputation obliged to do?)
  en: Los que han perjudicado al prójimo en su fama están obligados a reparar en lo posible el daño causado. (They are obliged
    to repair the damage caused, as far as possible.)
- es: ¿Cuál es el noveno mandamiento de la Ley de Dios? (What is the ninth commandment of the Law of God?)
  en: 'El noveno mandamiento de la Ley de Dios es: no consentirás pensamientos ni deseos impuros. (The ninth commandment of
    the Law of God is: you shall not entertain impure thoughts or desires.)'
- es: ¿Qué nos manda el noveno mandamiento? (What does the ninth commandment command us?)
  en: El noveno mandamiento nos manda que seamos puros y castos en pensamientos y deseos. (The ninth commandment commands
    us to be pure and chaste in thoughts and desires.)
