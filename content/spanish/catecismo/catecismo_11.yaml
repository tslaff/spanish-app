id: catecismo_11
name: Catecismo 11
sentences:
- es: ¿Qué significa «la vida eterna»? (What does "life everlasting" mean?)
  en: «La vida eterna» significa que después de la vida presente hay otra vida que no tiene fin. (It means that after this
    present life there is another life that has no end.)
- es: ¿Qué será de nuestra alma después de la muerte? (What will become of our soul after death?)
  en: Nuestra alma después de la muerte será juzgada por Dios para recibir premio o castigo según sus obras. (After death
    our soul will be judged by God to receive reward or punishment according to its deeds.)
- es: ¿Cómo premia Dios a los buenos y castiga a los malos? (How does God reward the good and punish the wicked?)
  en: Dios premia a los buenos dándoles el cielo, y castiga a los malos en el infierno. (God rewards the good by giving them
    heaven, and punishes the wicked in hell.)
- es: ¿Qué es el cielo? (What is heaven?)
  en: El cielo es el lugar donde los buenos viven con Dios eternamente felices. (Heaven is the place where the good live with
    God, eternally happy.)
- es: ¿Quiénes van al cielo? (Who goes to heaven?)
  en: Van al cielo los que mueren en gracia de Dios. (Those who die in the grace of God go to heaven.)
- es: ¿Qué es el purgatorio? (What is purgatory?)
  en: El purgatorio es el lugar de sufrimiento donde se purifican, antes de entrar en el cielo, los que mueren en gracia de
    Dios sin haber satisfecho por sus pecados. (Purgatory is the place of suffering where those who die in God's grace, but
    without having atoned for their sins, are purified before entering heaven.)
- es: ¿Qué es el infierno? (What is hell?)
  en: El infierno es el lugar donde los malos, apartados de Dios, sufren penas eternas. (Hell is the place where the wicked,
    cut off from God, suffer eternal punishment.)
- es: ¿Quiénes van al infierno? (Who goes to hell?)
  en: Van al infierno los que mueren en pecado mortal. (Those who die in mortal sin go to hell.)
- es: ¿Qué mandamientos debe cumplir el cristiano? (What commandments must a Christian fulfill?)
  en: El cristiano debe cumplir los mandamientos de la Ley de Dios y de la santa Madre Iglesia. (A Christian must fulfill
    the commandments of the Law of God and of holy Mother Church.)
- es: ¿Qué es la Ley de Dios? (What is the Law of God?)
  en: La Ley de Dios es lo que Dios manda al hombre para que lo cumpla. (The Law of God is what God commands man to fulfill.)
