id: catecismo_lecciones_22_28
name: "Catecismo - Lecciones 22-28"

sentences:
  - es: "¿Cuál es el tercer mandamiento de la Ley de Dios? (What is the third commandment of the Law of God?)"
    en: "El tercer mandamiento de la Ley de Dios es: santificarás las fiestas. (The third commandment of the Law of God is: you shall keep the feast days holy.)"

  - es: "¿Quién santifica las fiestas? (Who keeps the feast days holy?)"
    en: "Santifica las fiestas el que emplea los días de fiesta en dar culto a Dios, oyendo Misa, y se abstiene de trabajos corporales. (He who spends feast days giving worship to God, hearing Mass, and refrains from manual labor keeps the feast days holy.)"

  - es: "¿Peca quien trabaja en los días de fiesta? (Does one who works on feast days sin?)"
    en: "Peca quien trabaja en los días de fiesta sin licencia o necesidad. (One who works on feast days without permission or necessity sins.)"

  - es: "¿Cuál es el cuarto mandamiento de la Ley de Dios? (What is the fourth commandment of the Law of God?)"
    en: "El cuarto mandamiento de la Ley de Dios es: honrarás a tu padre y a tu madre. (The fourth commandment of the Law of God is: honor your father and your mother.)"

  - es: "¿Quién honra a su padre y a su madre? (Who honors his father and mother?)"
    en: "Honra a su padre y a su madre quien los ama, reverencia y obedece. (He who loves, reveres, and obeys them honors his father and mother.)"

  - es: "¿A quién deben los niños tener por modelo? (Whom should children take as their model?)"
    en: "Los niños deben tener por modelo al Niño Jesús, y amar y obedecer a sus padres como Jesús amó y obedeció a la Virgen María y a San José. (Children should take the Child Jesus as their model, and love and obey their parents as Jesus loved and obeyed the Virgin Mary and Saint Joseph.)"

  - es: "¿A quiénes más debemos honrar? (Whom else must we honor?)"
    en: "Debemos también honrar a los mayores en edad, dignidad y gobierno. (We must also honor those greater in age, dignity, and authority.)"

  - es: "¿Cuáles son los deberes de los padres? (What are the duties of parents?)"
    en: "Los deberes de los padres son: amar, sustentar y educar cristianamente a sus hijos. (The duties of parents are: to love, support, and educate their children in a Christian manner.)"

  - es: "¿Cuáles son los deberes de los esposos entre sí? (What are the mutual duties of spouses?)"
    en: "Los deberes de los esposos entre sí son: amarse, ayudarse y guardarse fidelidad. (The mutual duties of spouses are: to love one another, help one another, and keep faith with one another.)"

  - es: "¿Cuáles son nuestros deberes para con la Patria? (What are our duties toward our homeland?)"
    en: "Nuestros deberes para con la Patria son: amarla, defenderla, cumplir sus leyes y contribuir al bien común. (Our duties toward our homeland are: to love it, defend it, obey its laws, and contribute to the common good.)"

  - es: "¿Cuál es el quinto mandamiento de la Ley de Dios? (What is the fifth commandment of the Law of God?)"
    en: "El quinto mandamiento de la Ley de Dios es: no matarás. (The fifth commandment of the Law of God is: you shall not kill.)"

  - es: "¿Qué nos manda el quinto mandamiento de la Ley de Dios? (What does the fifth commandment command us?)"
    en: "El quinto mandamiento de la Ley de Dios nos manda querer bien a todos y perdonar a nuestros enemigos. (The fifth commandment commands us to wish everyone well and to forgive our enemies.)"

  - es: "¿Qué prohíbe el quinto mandamiento de la Ley de Dios? (What does the fifth commandment forbid?)"
    en: "El quinto mandamiento de la Ley de Dios prohíbe hacer daño a la propia vida o a la de otros con palabras, obras o deseos. (The fifth commandment forbids doing harm to one's own life or to that of others, in word, deed, or desire.)"

  - es: "¿Quién peca contra sí mismo en el quinto mandamiento de la Ley de Dios? (Who sins against himself in the fifth commandment?)"
    en: "Peca contra sí mismo en el quinto mandamiento de la Ley de Dios el que se quita la vida, o se mutila, la pone en peligro sin necesidad, se embriaga, y por desesperación se desea la muerte. (He who takes his own life, or mutilates himself, or needlessly puts himself in danger, or gets drunk, or out of despair wishes for death, sins against himself.)"

  - es: "¿Quién peca contra el prójimo en el quinto mandamiento de la Ley de Dios? (Who sins against his neighbor in the fifth commandment?)"
    en: "Peca contra el prójimo en el quinto mandamiento de la Ley de Dios el que le da la muerte o le hiere, el que le odia o está enemistado con él, el que le desea mal o le insulta, y el que le escandaliza. (He who kills or wounds his neighbor, who hates him or is at enmity with him, who wishes him harm or insults him, and who scandalizes him, sins against his neighbor.)"

  - es: "¿Qué es escándalo? (What is scandal?)"
    en: "Escándalo es toda palabra, obra u omisión que incita a otros a caer en pecado. (Scandal is any word, deed, or omission that leads others to fall into sin.)"

  - es: "¿Es lícita la venganza? (Is revenge lawful?)"
    en: "La venganza nunca es lícita, porque nadie debe tomarse la justicia por su mano. (Revenge is never lawful, because no one may take justice into his own hands.)"

  - es: "¿Cuál es el sexto mandamiento de la Ley de Dios? (What is the sixth commandment of the Law of God?)"
    en: "El sexto mandamiento de la Ley de Dios es: no cometerás actos impuros. (The sixth commandment of the Law of God is: you shall not commit impure acts.)"

  - es: "¿Qué nos manda el sexto mandamiento? (What does the sixth commandment command us?)"
    en: "El sexto mandamiento nos manda que seamos puros y castos en obras y palabras. (The sixth commandment commands us to be pure and chaste in deeds and words.)"

  - es: "¿Tenemos los cristianos un motivo especial para amar la pureza? (Do Christians have a special reason to love purity?)"
    en: "Los cristianos tenemos un motivo especial para amar la pureza, porque somos por la gracia miembros de Cristo y templos del Espíritu Santo. (We Christians have a special reason to love purity, because by grace we are members of Christ and temples of the Holy Spirit.)"

  - es: "¿Quiénes pecan contra la pureza? (Who sins against purity?)"
    en: "Pecan contra la pureza los que consigo o con otros cometen acciones deshonestas, y los que voluntariamente se ponen a sí mismos o ponen a otros en peligro de cometerlas. (Those who commit indecent acts with themselves or with others sin against purity, as do those who willingly put themselves or others in danger of committing them.)"

  - es: "¿Cuáles son los medios principales para guardar la pureza? (What are the main means of preserving purity?)"
    en: "Los medios principales para guardar la pureza son: la confesión y comunión frecuentes, la devoción a la Santísima Virgen, la modestia y la huida de las ocasiones peligrosas, como conversaciones, miradas, lecturas, modas, bailes y espectáculos deshonestos. (The main means of preserving purity are: frequent confession and communion, devotion to the Most Holy Virgin, modesty, and fleeing from dangerous occasions, such as indecent conversations, glances, reading material, fashions, dances, and shows.)"

  - es: "¿Cuál es el séptimo mandamiento de la Ley de Dios? (What is the seventh commandment of the Law of God?)"
    en: "El séptimo mandamiento de la Ley de Dios es: no hurtarás. (The seventh commandment of the Law of God is: you shall not steal.)"

  - es: "¿Qué prohíbe el séptimo mandamiento? (What does the seventh commandment forbid?)"
    en: "El séptimo mandamiento prohíbe hacer daño al prójimo en sus bienes. (The seventh commandment forbids doing harm to one's neighbor's property.)"

  - es: "¿Quiénes pecan contra el séptimo mandamiento? (Who sins against the seventh commandment?)"
    en: "Pecan contra el séptimo mandamiento los que roban; los que perjudican y defraudan al prójimo en sus bienes; los que no pagan el justo salario o no trabajan lo que deben; y los que retienen bienes ajenos contra la voluntad de su dueño. (Those who steal; those who harm or defraud their neighbor in his goods; those who do not pay a just wage or do not do the work they owe; and those who withhold another's property against the owner's will.)"

  - es: "¿A qué están obligados los que han hecho daño al prójimo en sus bienes? (What are those who have harmed their neighbor's goods obliged to do?)"
    en: "Los que han hecho daño al prójimo en sus bienes, están obligados a restituir lo mal adquirido y a reparar los daños culpablemente causados. (They are obliged to restore what was wrongly acquired and to repair the damage culpably caused.)"

  - es: "¿Cuál es el octavo mandamiento de la Ley de Dios? (What is the eighth commandment of the Law of God?)"
    en: "El octavo mandamiento de la Ley de Dios es: no dirás falso testimonio ni mentirás. (The eighth commandment of the Law of God is: you shall not bear false witness nor tell lies.)"

  - es: "¿Qué nos manda el octavo mandamiento? (What does the eighth commandment command us?)"
    en: "El octavo mandamiento nos manda decir la verdad y respetar la fama del prójimo. (The eighth commandment commands us to speak the truth and to respect our neighbor's good name.)"

  - es: "¿Qué prohíbe el octavo mandamiento? (What does the eighth commandment forbid?)"
    en: "El octavo mandamiento prohíbe la mentira, la calumnia, la maledicencia o difamación, el falso testimonio, el juicio temerario y toda ofensa contra el honor y la fama del prójimo. (The eighth commandment forbids lying, slander, backbiting or defamation, false testimony, rash judgment, and every offense against the honor and reputation of our neighbor.)"

  - es: "¿Qué es mentir? (What is to lie?)"
    en: "Mentir es decir lo contrario de lo que se piensa, con intención de engañar. (To lie is to say the opposite of what one thinks, with the intention of deceiving.)"

  - es: "¿Qué es calumniar? (What is to slander?)"
    en: "Calumniar es atribuir al prójimo pecados o defectos que no tiene. (To slander is to attribute to one's neighbor sins or faults that he does not have.)"

  - es: "¿Qué es la maledicencia? (What is backbiting?)"
    en: "La maledicencia o difamación es hablar mal del prójimo, difundiendo sus defectos y privándole de su fama. (Backbiting or defamation is to speak ill of one's neighbor, spreading his faults and depriving him of his good name.)"

  - es: "¿Qué es falso testimonio? (What is false testimony?)"
    en: "Falso testimonio es declarar en juicio alguna cosa contra la verdad. (False testimony is to declare in judgment something contrary to the truth.)"

  - es: "¿Qué es juicio temerario? (What is rash judgment?)"
    en: "Juicio temerario es juzgar mal del prójimo sin motivo suficiente. (Rash judgment is to judge one's neighbor unfavorably without sufficient reason.)"

  - es: "¿A qué están obligados los que han perjudicado al prójimo en su fama? (What are those who have harmed their neighbor's reputation obliged to do?)"
    en: "Los que han perjudicado al prójimo en su fama están obligados a reparar en lo posible el daño causado. (They are obliged to repair the damage caused, as far as possible.)"

  - es: "¿Cuál es el noveno mandamiento de la Ley de Dios? (What is the ninth commandment of the Law of God?)"
    en: "El noveno mandamiento de la Ley de Dios es: no consentirás pensamientos ni deseos impuros. (The ninth commandment of the Law of God is: you shall not entertain impure thoughts or desires.)"

  - es: "¿Qué nos manda el noveno mandamiento? (What does the ninth commandment command us?)"
    en: "El noveno mandamiento nos manda que seamos puros y castos en pensamientos y deseos. (The ninth commandment commands us to be pure and chaste in thoughts and desires.)"

  - es: "¿Cuándo son pecado los pensamientos y deseos impuros? (When are impure thoughts and desires sinful?)"
    en: "Los pensamientos y deseos impuros son pecado cuando la voluntad se complace en ellos; pero no son pecado si la voluntad no los consiente y procura rechazarlos. (They are sinful when the will takes pleasure in them; but they are not sinful if the will does not consent to them and tries to reject them.)"

