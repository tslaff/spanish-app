id: catecismo_27
name: Catecismo 27
sentences:
- es: ¿El dolor de contrición perdona los pecados mortales? (Does sorrow of contrition forgive mortal sins?)
  en: El dolor de contrición perdona inmediatamente los pecados mortales, si se tiene el propósito de confesarlos. (Sorrow
    of contrition immediately forgives mortal sins, if one has the intention of confessing them.)
- es: ¿Qué es dolor de atrición? (What is sorrow of attrition?)
  en: Dolor de atrición es un sentimiento o pena de haber ofendido a Dios por temor al castigo o por la misma fealdad del
    pecado. (Sorrow of attrition is a feeling of grief for having offended God out of fear of punishment or because of the
    ugliness of sin itself.)
- es: ¿Basta el dolor de atrición para perdonar los pecados mortales? (Is sorrow of attrition enough to forgive mortal sins?)
  en: El dolor de atrición no basta para perdonar los pecados mortales, sino que es necesario confesarlos y recibir la absolución.
    (Sorrow of attrition alone is not enough; it is also necessary to confess them and receive absolution.)
- es: ¿Qué es propósito de la enmienda? (What is purpose of amendment?)
  en: Propósito de la enmienda es una firme resolución de no volver a pecar. (Purpose of amendment is a firm resolution never
    to sin again.)
- es: ¿Cuándo tenemos verdadero propósito de la enmienda? (When do we have a true purpose of amendment?)
  en: Tenemos verdadero propósito de la enmienda cuando estamos dispuestos a poner los medios necesarios para evitar el pecado
    y huir de las ocasiones de pecar. (When we are willing to use the necessary means to avoid sin and to flee the occasions
    of sin.)
- es: ¿Qué pecados debemos confesar? (What sins must we confess?)
  en: Debemos confesar todos los pecados mortales, y conviene decir también los veniales. (We must confess all mortal sins,
    and it is also good to mention venial sins.)
- es: ¿Cómo se han de confesar los pecados? (How should sins be confessed?)
  en: Los pecados se han de confesar con humildad y sencillez, manifestando los ciertos como ciertos, los dudosos como dudosos,
    y aquellas circunstancias que aumenten o disminuyan su gravedad. (Sins should be confessed with humility and simplicity,
    stating what is certain as certain and what is doubtful as doubtful, along with the circumstances that increase or lessen
    their gravity.)
- es: ¿Hay que confesar el número exacto de los pecados mortales cometidos? (Must one confess the exact number of mortal sins
    committed?)
  en: Hay que confesar el número exacto de los pecados mortales cometidos, y si no se recuerda, el número aproximado. (One
    must confess the exact number, and if it is not remembered, the approximate number.)
- es: ¿Cómo peca el que calla a sabiendas algún pecado mortal? (How does one sin who knowingly conceals a mortal sin?)
  en: El que calla a sabiendas algún pecado mortal comete un grave sacrilegio y no se le perdonan los pecados confesados.
    (One who knowingly conceals a mortal sin commits a grave sacrilege, and the sins confessed are not forgiven.)
- es: ¿Qué es cumplir la penitencia? (What is it to fulfill one's penance?)
  en: Cumplir la penitencia es rezar las oraciones y hacer las buenas obras que manda el confesor, para satisfacer por la
    pena temporal de los pecados. (It is to say the prayers and perform the good works the confessor assigns, in order to
    make satisfaction for the temporal punishment due to sin.)
