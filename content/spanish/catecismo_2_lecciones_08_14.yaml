id: catecismo_lecciones_08_14
name: "Catecismo - Lecciones 8-14"

sentences:
  - es: "¿Qué es el hombre?"
    en: "El hombre es un ser racional y libre, compuesto de alma y cuerpo, creado por Dios a su imagen y semejanza."

  - es: "¿De quién recibimos el alma?"
    en: "El alma la recibimos de Dios, que la ha creado de la nada para unirla al cuerpo."

  - es: "¿Cómo es nuestra alma?"
    en: "Nuestra alma es espiritual e inmortal, dotada de entendimiento y voluntad."

  - es: "¿De quién recibimos el cuerpo?"
    en: "El cuerpo lo recibimos de nuestros padres."

  - es: "¿Para qué ha creado Dios a los hombres?"
    en: "Dios ha creado a los hombres para que le amemos y obedezcamos en la tierra y seamos felices con Él en el cielo."

  - es: "¿Los cristianos somos hijos de Dios?"
    en: "Los cristianos somos hijos adoptivos de Dios."

  - es: "¿Cuándo los cristianos nos hacemos hijos de Dios?"
    en: "Los cristianos nos hacemos hijos de Dios cuando recibimos el Bautismo."

  - es: "¿Quiénes fueron nuestros primeros padres?"
    en: "Nuestros primeros padres fueron Adán y Eva, y de ellos descendemos todos los hombres."

  - es: "¿Dónde colocó Dios a nuestros primeros padres?"
    en: "Dios colocó a nuestros primeros padres en un lugar delicioso, llamado paraíso terrenal."

  - es: "¿Qué dones concedió el Señor a nuestros primeros padres?"
    en: "El Señor concedió a nuestros primeros padres el don divino de la gracia, el conocimiento de las cosas convenientes a su estado, y otros dones que los libraban de la inclinación al pecado, del dolor y de la muerte."

  - es: "¿Cómo concedió el Señor estos dones a nuestros primeros padres?"
    en: "El Señor concedió estos dones a nuestros primeros padres para sí y para todos sus descendientes."

  - es: "¿Qué precepto impuso Dios a nuestros primeros padres?"
    en: "Dios impuso a nuestros primeros padres el precepto de no comer del árbol de la ciencia del bien y del mal."

  - es: "¿Obedecieron nuestros primeros padres el precepto de Dios?"
    en: "Nuestros primeros padres no obedecieron el precepto de Dios, pues Eva, engañada por el demonio, comió el fruto prohibido y dio de comer a Adán."

  - es: "¿Fueron castigados nuestros primeros padres por esta desobediencia?"
    en: "Nuestros primeros padres fueron castigados por esta desobediencia, y perdieron el don de la gracia; fueron echados del paraíso, y quedaron sometidos a la lucha con las pasiones, al dolor y a la muerte."

  - es: "¿A quiénes más perjudicó el pecado de nuestros primeros padres?"
    en: "El pecado de nuestros primeros padres perjudicó también a todos sus descendientes, que quedaron privados de la gracia y de los demás dones."

  - es: "¿Qué es el pecado original?"
    en: "El pecado original es aquel con que todos nacemos, heredado de nuestros primeros padres."

  - es: "¿Heredó también la Santísima Virgen el pecado original?"
    en: "La Santísima Virgen no heredó el pecado original, sino que, por singular privilegio, por los méritos de Jesucristo, fue inmaculada desde el primer instante de su concepción."

  - es: "¿Cómo se quita el pecado original?"
    en: "El pecado original se quita por el Bautismo."

  - es: "¿Cuál de las tres Personas de la Santísima Trinidad se hizo hombre?"
    en: "Se hizo hombre la segunda Persona de la Santísima Trinidad, que es el Hijo."

  - es: "¿Para qué se hizo hombre el Hijo de Dios?"
    en: "El Hijo de Dios se hizo hombre para salvarnos y darnos ejemplo de vida."

  - es: "¿Quién es Jesucristo?"
    en: "Jesucristo es el Hijo de Dios hecho hombre, que nació de la Virgen María."

  - es: "¿Quién es la Virgen María?"
    en: "La Virgen María es la Señora llena de gracia y virtudes, concebida sin pecado, que es Madre de Dios y Madre nuestra y está en el cielo."

  - es: "¿Cómo se realizó la Encarnación del Hijo de Dios?"
    en: "La Encarnación del Hijo de Dios se realizó formando el Espíritu Santo de las purísimas entrañas de la Virgen María un cuerpo perfectísimo y creando un alma nobilísima que unió a aquel cuerpo; en el mismo instante a este cuerpo y alma se unió el Hijo de Dios; y de esta suerte el que antes era sólo Dios, sin dejar de serlo, quedó hecho hombre."

  - es: "¿Por qué decimos que la Virgen María es Madre de Dios?"
    en: "Decimos que la Virgen María es Madre de Dios, porque de Ella nació Jesucristo, que es verdadero Dios y verdadero hombre."

  - es: "¿Cuántas naturalezas hay en Jesucristo?"
    en: "En Jesucristo hay dos naturalezas, una divina porque es Dios y otra humana porque es hombre."

  - es: "¿Cuántas personas hay en Jesucristo?"
    en: "En Jesucristo hay una sola persona, que es divina, y es la segunda de la Santísima Trinidad."

  - es: "¿Cómo nos salvó Jesucristo?"
    en: "Jesucristo nos salvó padeciendo y muriendo en la Cruz."

  - es: "¿Para qué quiso Jesucristo padecer y morir en la Cruz?"
    en: "Jesucristo quiso padecer y morir en la Cruz para redimirnos del pecado y librarnos de la muerte eterna."

  - es: "¿Cómo nos redimió Jesucristo?"
    en: "Jesucristo nos redimió ofreciendo el sacrificio de su vida en la Cruz, para obtener el perdón de nuestros pecados y devolvernos la gracia y amistad de Dios."

  - es: "¿Qué quiere decir «descendió a los infiernos»?"
    en: "«Descendió a los infiernos» quiere decir que, después de la muerte del Señor, su alma, unida a la divinidad, fue al encuentro de las almas santas que esperaban su venida en el limbo de los justos, para anunciarles la redención y llevarlas al cielo."

  - es: "¿Cómo resucitó Jesucristo?"
    en: "Jesucristo resucitó uniendo de nuevo su alma al cuerpo, y saliendo vivo y glorioso del sepulcro para nunca más morir."

  - es: "¿A quiénes se apareció Jesucristo después de resucitado?"
    en: "Jesucristo, después de resucitado, se apareció a su Madre Santísima, a las santas mujeres, a los Apóstoles y a muchos discípulos."

  - es: "¿Dónde está Jesucristo?"
    en: "Jesucristo, después de su muerte, resucitó y está en el cielo y en el Santísimo Sacramento del Altar."

  - es: "¿Cuándo subió Jesucristo a los cielos?"
    en: "Jesucristo subió a los cielos por su propio poder a los cuarenta días después de resucitado, en presencia de sus discípulos."

  - es: "¿Qué entendemos al decir que Jesucristo está sentado a la diestra de Dios Padre?"
    en: "Al decir que Jesucristo está sentado a la diestra de Dios Padre, entendemos que Jesucristo en cuanto Dios tiene igual poder y gloria que el Padre, y participa plenamente del mismo poder y gloria en cuanto hombre."

  - es: "¿Cuándo ha de venir Jesucristo a juzgar a los vivos y a los muertos?"
    en: "Jesucristo ha de venir a juzgar a los vivos y a los muertos, con toda su gloria y majestad, al fin del mundo."

  - es: "¿Qué prometió Jesucristo al subir a los cielos?"
    en: "Jesucristo, al subir a los cielos, prometió que nos enviaría el Espíritu Santo."

  - es: "¿Quién es el Espíritu Santo?"
    en: "El Espíritu Santo es la tercera Persona de la Santísima Trinidad, que procede del Padre y del Hijo."

  - es: "¿Cuándo envió Jesucristo el Espíritu Santo?"
    en: "Jesucristo envió el Espíritu Santo a su Iglesia el día de Pentecostés, diez días después de su ascensión a los cielos."

  - es: "¿Para qué envió Jesucristo el Espíritu Santo?"
    en: "Jesucristo envió el Espíritu Santo para santificar nuestras almas y asistir a su Santa Iglesia."

  - es: "¿Cómo nos santifica el Espíritu Santo?"
    en: "El Espíritu Santo nos santifica por medio de la gracia, de las virtudes y de sus dones."

