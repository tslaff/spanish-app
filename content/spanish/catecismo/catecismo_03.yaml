id: catecismo_03
name: Catecismo 03
sentences:
- es: ¿Por qué decimos que Dios es «espíritu purísimo»? (Why do we say God is a most pure spirit?)
  en: Decimos que Dios es «espíritu» porque es sabiduría y amor y no tiene cuerpo; y decimos que es «purísimo» porque es más
    perfecto que las almas y los Ángeles. (We say God is "spirit" because He is wisdom and love and has no body; and we say
    He is "most pure" because He is more perfect than souls and Angels.)
- es: ¿Por qué decimos que Dios es infinitamente perfecto? (Why do we say God is infinitely perfect?)
  en: Decimos que Dios es infinitamente perfecto, porque tiene todas las perfecciones sin defecto ni límite. (We say God is
    infinitely perfect because He has all perfections without defect or limit.)
- es: ¿Por qué decimos que Dios es principio de todas las cosas? (Why do we say God is the beginning of all things?)
  en: Decimos que Dios es principio de todas las cosas porque las ha creado todas. (We say God is the beginning of all things
    because He has created them all.)
- es: ¿Por qué decimos que Dios es fin de todas las cosas? (Why do we say God is the end of all things?)
  en: Decimos que Dios es fin de todas las cosas, porque todas las ha creado para manifestar sus perfecciones y su gloria.
    (We say God is the end of all things, because He created them all to manifest His perfections and His glory.)
- es: ¿Dónde está Dios? (Where is God?)
  en: Dios está en los cielos, en la tierra y en todas partes. (God is in heaven, on earth, and everywhere.)
- es: ¿Dios lo ve todo? (Does God see everything?)
  en: 'Dios lo ve todo, lo pasado, lo presente y lo futuro, y hasta los más ocultos pensamientos. (God sees everything: the
    past, the present, and the future, and even our most hidden thoughts.)'
- es: ¿Hay un solo Dios? (Is there only one God?)
  en: Sí hay un solo Dios. (Yes, there is only one God.)
- es: ¿Cuántas Personas hay en Dios? (How many Persons are there in God?)
  en: 'En Dios hay tres Personas: Padre, Hijo y Espíritu Santo. (In God there are three Persons: Father, Son, and Holy Spirit.)'
- es: ¿Quién es la Santísima Trinidad? (Who is the Most Holy Trinity?)
  en: La Santísima Trinidad es el mismo Dios, Padre, Hijo y Espíritu Santo, tres Personas distintas y un solo Dios verdadero.
    (The Most Holy Trinity is the same God, Father, Son, and Holy Spirit, three distinct Persons and one true God.)
- es: ¿Cada una de las Personas de la Santísima Trinidad es Dios? (Is each of the Persons of the Most Holy Trinity God?)
  en: 'Cada una de las Personas de la Santísima Trinidad es Dios: el Padre es Dios, el Hijo es Dios y el Espíritu Santo es
    Dios. (Each of the Persons of the Most Holy Trinity is God: the Father is God, the Son is God, and the Holy Spirit is
    God.)'
