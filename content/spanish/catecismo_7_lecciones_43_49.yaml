id: catecismo_lecciones_43_49
name: "Catecismo - Lecciones 43-49"

sentences:
  - es: "¿Qué es el Bautismo?"
    en: "El Bautismo es el sacramento que nos quita el pecado original y nos hace cristianos."

  - es: "¿Qué efectos produce el Bautismo?"
    en: "El Bautismo da la gracia santificante; perdona todos los pecados que tuviere el que se bautiza y las penas por ellos debidas; e imprime en el alma el carácter sacramental que nos hace cristianos."

  - es: "¿Es necesario el Bautismo?"
    en: "El Bautismo es el más necesario de los sacramentos, porque Jesucristo ha dicho que sin el Bautismo nadie puede entrar en el reino de Dios."

  - es: "¿Quién es el ministro del Bautismo?"
    en: "El ministro ordinario del Bautismo es el sacerdote, pero en caso de necesidad puede bautizar cualquier hombre o mujer que tenga uso de razón."

  - es: "¿Cómo se administra el Bautismo?"
    en: "El Bautismo se administra derramando agua natural sobre la cabeza del que se bautiza, diciendo al mismo tiempo con intención de bautizar: «Yo te bautizo en el nombre del Padre, y del Hijo, y del Espíritu Santo»."

  - es: "¿Cuándo se debe administrar el Bautismo a los niños?"
    en: "El Bautismo se debe administrar a los niños lo más pronto posible."

  - es: "¿Qué es la Confirmación?"
    en: "La Confirmación es el sacramento que nos aumenta la gracia del Espíritu Santo, para fortalecernos en la fe y hacernos soldados y apóstoles de Cristo."

  - es: "¿Cómo se debe recibir la Confirmación?"
    en: "La Confirmación se debe recibir en estado de gracia, y conociendo las principales verdades cristianas."

  - es: "¿Quién es el ministro de la Confirmación?"
    en: "El ministro ordinario de la Confirmación es el Obispo, pero en caso de peligro de muerte, en ausencia del Obispo, puede confirmar el párroco."

  - es: "¿Qué es la Penitencia?"
    en: "La Penitencia es el sacramento que perdona los pecados cometidos después del Bautismo."

  - es: "¿Cuándo recibimos el sacramento de la Penitencia?"
    en: "Recibimos el sacramento de la Penitencia cuando nos confesamos bien y recibimos la absolución."

  - es: "¿Cuántas cosas son necesarias para confesarnos bien?"
    en: "Para confesarnos bien son necesarias cinco cosas: examen de conciencia, dolor de los pecados, propósito de la enmienda, decir los pecados al confesor y cumplir la penitencia."

  - es: "¿Qué es examen de conciencia?"
    en: "Examen de conciencia es recordar todos los pecados cometidos desde la última confesión bien hecha."

  - es: "¿Qué es dolor de los pecados?"
    en: "Dolor de los pecados es un sentimiento o pena de haber ofendido a Dios por ser infinitamente bueno, o porque nos puede castigar, o por la fealdad del pecado."

  - es: "¿De cuántas maneras es el dolor de los pecados?"
    en: "El dolor de los pecados es de dos maneras: dolor de contrición y dolor de atrición."

  - es: "¿Qué es dolor de contrición?"
    en: "Dolor de contrición es un sentimiento o pena de haber ofendido a Dios por ser Él quien es, Bondad infinita, digno de ser amado sobre todas las cosas."

  - es: "¿El dolor de contrición perdona los pecados mortales?"
    en: "El dolor de contrición perdona inmediatamente los pecados mortales, si se tiene el propósito de confesarlos."

  - es: "¿Qué es dolor de atrición?"
    en: "Dolor de atrición es un sentimiento o pena de haber ofendido a Dios por temor al castigo o por la misma fealdad del pecado."

  - es: "¿Basta el dolor de atrición para perdonar los pecados mortales?"
    en: "El dolor de atrición no basta para perdonar los pecados mortales, sino que es necesario confesarlos y recibir la absolución."

  - es: "¿Qué es propósito de la enmienda?"
    en: "Propósito de la enmienda es una firme resolución de no volver a pecar."

  - es: "¿Cuándo tenemos verdadero propósito de la enmienda?"
    en: "Tenemos verdadero propósito de la enmienda cuando estamos dispuestos a poner los medios necesarios para evitar el pecado y huir de las ocasiones de pecar."

  - es: "¿Qué pecados debemos confesar?"
    en: "Debemos confesar todos los pecados mortales, y conviene decir también los veniales."

  - es: "¿Cómo se han de confesar los pecados?"
    en: "Los pecados se han de confesar con humildad y sencillez, manifestando los ciertos como ciertos, los dudosos como dudosos, y aquellas circunstancias que aumenten o disminuyan su gravedad."

  - es: "¿Hay que confesar el número exacto de los pecados mortales cometidos?"
    en: "Hay que confesar el número exacto de los pecados mortales cometidos, y si no se recuerda, el número aproximado."

  - es: "¿Cómo peca el que calla a sabiendas algún pecado mortal?"
    en: "El que calla a sabiendas algún pecado mortal comete un grave sacrilegio y no se le perdonan los pecados confesados."

  - es: "¿Qué es cumplir la penitencia?"
    en: "Cumplir la penitencia es rezar las oraciones y hacer las buenas obras que manda el confesor, para satisfacer por la pena temporal de los pecados."

  - es: "¿Qué es la Eucaristía?"
    en: "La Eucaristía es el sacramento del Cuerpo y Sangre de Jesucristo bajo las especies de pan y de vino."

  - es: "¿Cuántas cosas hay que considerar en la Eucaristía?"
    en: "En la Eucaristía hay que considerar tres cosas: que en la Eucaristía está real y verdaderamente Jesucristo; que en la Eucaristía se ofrece por nosotros Jesucristo en la santa Misa; y que en la Eucaristía recibimos a Jesucristo en la sagrada Comunión."

  - es: "¿Cuándo instituyó Jesucristo la Eucaristía?"
    en: "Jesucristo instituyó la Eucaristía el día de Jueves Santo, en la última Cena."

  - es: "¿Cuándo empieza Jesucristo a estar en la Eucaristía?"
    en: "Jesucristo empieza a estar en la Eucaristía en el momento de la consagración de la Misa."

  - es: "¿Qué es la Hostia antes de la consagración?"
    en: "La Hostia antes de la consagración es pan de trigo."

  - es: "¿Qué es la Hostia después de la consagración?"
    en: "La Hostia después de la consagración es el Cuerpo de Jesucristo."

  - es: "¿Qué hay en el cáliz antes de la consagración?"
    en: "En el cáliz antes de la consagración hay vino con unas gotas de agua."

  - es: "¿Qué hay en el cáliz después de la consagración?"
    en: "En el cáliz después de la consagración está la Sangre de Jesucristo."

  - es: "¿Cómo está Jesucristo en la Eucaristía?"
    en: "Jesucristo está todo entero en todas y cada una de las partes de la Eucaristía."

  - es: "¿Qué es la santa Misa?"
    en: "La santa Misa es el sacrificio del Cuerpo y Sangre de Jesucristo, que se ofrece a Dios por ministerio del sacerdote en memoria y renovación del sacrificio de la Cruz."

  - es: "¿Por qué decimos que la santa Misa es sacrificio?"
    en: "Decimos que la santa Misa es sacrificio porque en ella Jesucristo se ofrece como víctima, en reconocimiento de la suprema majestad de Dios, y en reparación de nuestros pecados."

  - es: "¿Es la santa Misa el mismo sacrificio de la Cruz?"
    en: "La santa Misa es el mismo sacrificio de la Cruz, porque en la Misa el mismo Jesucristo renueva el ofrecimiento de su pasión y muerte hecho en el Calvario."

  - es: "¿Cuáles son los fines de la santa Misa?"
    en: "Los fines de la santa Misa son cuatro: adorar a Dios, darle gracias, pedirle beneficios y satisfacer por nuestros pecados."

  - es: "¿Cuáles son las partes principales de la santa Misa?"
    en: "Las partes principales de la santa Misa son: el ofertorio, la consagración y la comunión."

  - es: "¿Qué es la sagrada Comunión?"
    en: "La sagrada Comunión es recibir al mismo Jesucristo bajo las especies de pan y vino."

  - es: "¿Para qué recibimos a Jesucristo en la sagrada Comunión?"
    en: "Recibimos a Jesucristo en la sagrada Comunión para que sea alimento de nuestras almas, nos aumente la gracia y nos dé la vida eterna."

  - es: "¿Cuántas cosas son necesarias para recibir bien la sagrada Comunión?"
    en: "Para recibir bien la sagrada Comunión son necesarias tres cosas: estar en gracia de Dios, guardar el ayuno eucarístico y saber a quién recibimos."

  - es: "¿Qué quiere decir estar en gracia de Dios?"
    en: "Estar en gracia de Dios quiere decir estar limpio de pecado mortal."

  - es: "¿Qué es guardar el ayuno eucarístico?"
    en: "Guardar el ayuno eucarístico es no haber comido ni tomado bebidas alcohólicas desde tres horas antes, ni bebido otros líquidos desde una hora antes de comulgar. El agua no rompe el ayuno."

  - es: "¿Cómo hemos de acercarnos a la sagrada Comunión?"
    en: "Hemos de acercarnos a la sagrada Comunión con fe viva, fervor, humildad y modestia."

  - es: "¿Qué pecado comete el que comulga en pecado mortal?"
    en: "El que comulga en pecado mortal comete un horrible sacrilegio."

  - es: "¿Qué es la Extremaunción?"
    en: "La Extremaunción es el sacramento que alivia el alma y el cuerpo del cristiano gravemente enfermo."

  - es: "¿Cuáles son los efectos de la Extremaunción?"
    en: "La Extremaunción aumenta la gracia santificante; perdona los pecados veniales y aun los mortales, si el enfermo está arrepentido y no ha podido confesarse; le da fuerzas para resistir las tentaciones y soportar los sufrimientos de la enfermedad; y le concede la salud del cuerpo si le conviene."

  - es: "¿Quién debe recibir la Extremaunción?"
    en: "Debe recibir la Extremaunción todo cristiano, llegado al uso de razón, que se halle en peligro de muerte por enfermedad."

  - es: "¿Qué obligación tienen los familiares y los que asisten al enfermo?"
    en: "Los familiares y los que asisten al enfermo tienen obligación grave de procurar que el enfermo reciba la Extremaunción, y si es posible antes de que pierda el conocimiento."

  - es: "¿Qué es el Orden sacerdotal?"
    en: "El Orden sacerdotal es el sacramento que hace a algunos cristianos ministros de Dios."

  - es: "¿Cuáles son las principales funciones sagradas del sacerdote?"
    en: "Las principales funciones sagradas del sacerdote son: celebrar la santa Misa, administrar los sacramentos, y predicar la palabra de Dios."

  - es: "¿Es muy grande la dignidad del sacerdote?"
    en: "La dignidad del sacerdote es la mayor que hay en la tierra, porque es el mediador entre Dios y los hombres."

  - es: "¿Qué es el Matrimonio?"
    en: "El Matrimonio es el sacramento que santifica la unión del hombre y la mujer, y les da la gracia para que vivan en paz y críen hijos para el cielo."

  - es: "¿Qué deben hacer los esposos cristianos para vivir santamente?"
    en: "Para vivir santamente los esposos cristianos deben amarse y guardarse fidelidad, recibir los hijos que Dios les dé y educarlos cristianamente."

