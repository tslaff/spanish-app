id: catecismo_lecciones_36_42
name: "Catecismo - Lecciones 36-42"

sentences:
  - es: "¿Cuántas son las virtudes cardinales?"
    en: "Las virtudes cardinales son cuatro: prudencia, justicia, fortaleza y templanza."

  - es: "¿Por qué se llaman cardinales?"
    en: "Se llaman cardinales porque todas las demás virtudes se fundan y se integran en ellas."

  - es: "¿Qué es la virtud de la religión?"
    en: "La virtud de la religión es la que nos mueve a dar el culto debido a Dios por ser nuestro Creador y Señor."

  - es: "¿Cuáles son los principales actos del culto debido a Dios?"
    en: "Los principales actos del culto debido a Dios son: la adoración, la oración y el sacrificio, practicados privada y públicamente."

  - es: "¿Cuáles son los principales pecados contra la religión?"
    en: "Los principales pecados contra la religión son: la idolatría, el sacrilegio y la superstición."

  - es: "¿Es pecado no tener ninguna religión?"
    en: "No tener ninguna religión es pecado gravísimo, porque es despreciar a Dios."

  - es: "¿Qué son los dones del Espíritu Santo?"
    en: "Los dones del Espíritu Santo son perfecciones sobrenaturales, que Dios nos concede para obedecer dócilmente sus inspiraciones, y facilitarnos el ejercicio de las virtudes."

  - es: "¿Cuáles son los dones del Espíritu Santo?"
    en: "Los dones del Espíritu Santo son siete: sabiduría, entendimiento, consejo, fortaleza, ciencia, piedad y temor de Dios."

  - es: "¿A quiénes llama Jesucristo bienaventurados?"
    en: "Jesucristo llama bienaventurados a los cristianos que le imitan en el desprendimiento de los bienes de este mundo y en la estima de los bienes espirituales."

  - es: "¿Cuántas son las bienaventuranzas?"
    en: "Las bienaventuranzas son ocho: los pobres de espíritu, los mansos, los que lloran, los que tienen hambre y sed de justicia, los misericordiosos, los limpios de corazón, los pacíficos, y los que padecen persecución a causa de la justicia."

  - es: "¿Qué es pecado?"
    en: "Pecado es toda acción u omisión voluntaria contra la Ley de Dios."

  - es: "¿De qué maneras se comete el pecado?"
    en: "El pecado se comete por pensamiento, deseo, palabra, obra y omisión."

  - es: "¿Cómo puede ser el pecado?"
    en: "El pecado puede ser mortal y venial."

  - es: "¿Qué es pecado mortal?"
    en: "Pecado mortal es una desobediencia voluntaria a la Ley de Dios en materia grave, con plena advertencia y perfecto consentimiento."

  - es: "¿Por qué se llama pecado mortal?"
    en: "Se llama pecado mortal porque priva al alma de la vida de la gracia y la hace merecedora de las penas del infierno."

  - es: "¿Qué es pecado venial?"
    en: "Pecado venial es una desobediencia voluntaria a la Ley de Dios en materia leve, o en materia grave sin plena advertencia o sin perfecto consentimiento."

  - es: "¿Qué males nos causa el pecado venial?"
    en: "El pecado venial disminuye el fervor de la caridad, nos va disponiendo para el pecado mortal, y nos hace merecedores de las penas del purgatorio."

  - es: "¿Cuántos son los pecados capitales?"
    en: "Los pecados capitales son siete: soberbia, avaricia, lujuria, ira, gula, envidia y pereza."

  - es: "¿Qué virtudes hay contra estos siete vicios o pecados capitales?"
    en: "Contra la soberbia, humildad; contra la avaricia, generosidad; contra la lujuria, castidad; contra la ira, paciencia; contra la gula, templanza; contra la envidia, caridad; y contra la pereza, diligencia."

  - es: "¿Cuántos son los enemigos del alma?"
    en: "Los enemigos del alma son tres: el mundo, el demonio y la carne."

  - es: "¿Por qué el mundo, el demonio y la carne son enemigos del alma?"
    en: "El mundo, el demonio y la carne son enemigos del alma porque con sus tentaciones nos inducen al pecado."

  - es: "¿Podemos con nuestras propias fuerzas cumplir todos los mandamientos y ganar el cielo?"
    en: "Sólo con nuestras fuerzas no podemos cumplir los mandamientos ni ganar el cielo, porque necesitamos el auxilio de la gracia."

  - es: "¿Qué es la gracia?"
    en: "La gracia es un don sobrenatural que Dios nos concede para alcanzar la vida eterna."

  - es: "¿Cuántas clases hay de gracia?"
    en: "Hay dos clases de gracia: la gracia santificante y la gracia actual."

  - es: "¿A qué llamamos gracia santificante?"
    en: "Llamamos gracia santificante a la que nos hace hijos de Dios y herederos del cielo."

  - es: "¿Qué es gracia actual?"
    en: "Gracia actual es un auxilio de Dios que ilumina nuestro entendimiento o mueve nuestra voluntad para obrar el bien y evitar el mal."

  - es: "¿Cuáles son los medios principales para alcanzar la gracia?"
    en: "Los medios principales para alcanzar la gracia son: la oración y los sacramentos."

  - es: "¿Qué es orar?"
    en: "Orar es hablar con Dios, nuestro Padre celestial, para alabarle, darle gracias y pedirle toda clase de bienes."

  - es: "¿Tenemos obligación de orar?"
    en: "Tenemos obligación de orar porque Jesucristo nos lo manda y porque es el medio ordinario para alcanzar la gracia y los beneficios de Dios."

  - es: "¿Cómo hemos de orar?"
    en: "Hemos de orar con atención, humildad, confianza y perseverancia."

  - es: "¿Oye siempre Dios nuestras oraciones?"
    en: "Dios oye siempre nuestras oraciones y nos concede lo que es más conveniente para nuestra salvación."

  - es: "¿Cuál es la oración más excelente?"
    en: "La oración más excelente es el Padrenuestro, que enseñó Jesucristo a los Apóstoles."

  - es: "¿Cuáles son las principales oraciones a la Santísima Virgen?"
    en: "Las principales oraciones a la Santísima Virgen son: el Avemaría y la Salve."

  - es: "¿Es conveniente también hacer oración a los Ángeles y a los Santos?"
    en: "Es conveniente también hacer oración a los Ángeles y a los Santos para que intercedan por nosotros delante de Dios."

  - es: "¿Qué es sacramento?"
    en: "Sacramento es una acción exterior que significa y da la gracia."

  - es: "¿Quién instituyó los sacramentos?"
    en: "Los sacramentos los instituyó Jesucristo."

  - es: "¿Cuántos son los sacramentos?"
    en: "Los sacramentos son siete: Bautismo, Confirmación, Penitencia, Eucaristía, Extremaunción, Orden sacerdotal y Matrimonio."

  - es: "¿Los sacramentos dan siempre la gracia?"
    en: "Los sacramentos dan siempre la gracia si se reciben con las disposiciones necesarias."

  - es: "¿Qué pecado comete el que recibe un sacramento sin las disposiciones necesarias?"
    en: "El que recibe un sacramento sin las disposiciones necesarias comete un pecado mortal de sacrilegio."

  - es: "¿Qué sacramentos se reciben una sola vez?"
    en: "Se reciben una sola vez el Bautismo, la Confirmación y el Orden sacerdotal, porque imprimen en el alma una señal imborrable que se llama carácter sacramental."

