id: catecismo_lecciones_15_21
name: "Catecismo - Lecciones 15-21"

sentences:
  - es: "¿Qué es la santa Iglesia?"
    en: "La santa Iglesia es la congregación de los fieles cristianos, fundada por Jesucristo, y cuya cabeza visible es el Papa."

  - es: "¿Cómo asiste el Espíritu Santo a la Iglesia?"
    en: "El Espíritu Santo asiste a la Iglesia iluminándola para que enseñe la verdad cristiana sin error, dirigiéndola en su gobierno y conservándola hasta el fin del mundo."

  - es: "¿Quién es el Papa?"
    en: "El Papa o Romano Pontífice es el Vicario de Cristo en la tierra, que hace sus veces en el gobierno de la Iglesia."

  - es: "¿Estamos obligados a obedecer al Papa?"
    en: "Estamos obligados a obedecer al Papa porque es el Padre y Pastor supremo de toda la Iglesia."

  - es: "¿Puede equivocarse el Papa?"
    en: "El Papa no puede equivocarse cuando define doctrinas de fe y de moral como Maestro supremo de toda la Iglesia."

  - es: "¿Quiénes son los Obispos?"
    en: "Los Obispos son los sucesores de los Apóstoles, puestos por el Espíritu Santo para regir sus diócesis bajo la autoridad del Papa."

  - es: "¿Jesucristo ha fundado más de una Iglesia?"
    en: "Jesucristo no ha fundado más que una sola Iglesia."

  - es: "¿Cómo podemos reconocer la Iglesia de Cristo?"
    en: "Podemos reconocer la Iglesia de Cristo por ciertas notas o caracteres que Cristo le confirió."

  - es: "¿Cuáles son las notas o caracteres que Cristo confirió a su Iglesia?"
    en: "Las notas o caracteres que Cristo confirió a su Iglesia son cuatro: unidad, santidad, catolicidad y apostolicidad."

  - es: "¿Cuál es la verdadera Iglesia fundada por Cristo?"
    en: "La verdadera Iglesia fundada por Cristo es únicamente la Iglesia Romana, porque sólo ella es Una, Santa, Católica y Apostólica."

  - es: "¿Qué quiere decir «comunión de los santos»?"
    en: "«Comunión de los santos» quiere decir que todos los miembros de la Iglesia están unidos con Jesucristo y entre sí formando un cuerpo, y participan de los mismos bienes espirituales."

  - es: "¿Cuáles son los miembros de la Iglesia?"
    en: "Los miembros de la Iglesia son los santos del cielo, las almas del purgatorio y los fieles de la tierra."

  - es: "¿De qué bienes espirituales participan los miembros de la Iglesia?"
    en: "Los miembros de la Iglesia participan de los méritos de Jesucristo, de la Santísima Virgen y de los Santos; del sacrificio de la Misa; de los sacramentos, y de las oraciones y buenas obras de los fieles."

  - es: "¿Tiene la Iglesia poder para perdonar los pecados?"
    en: "La Iglesia tiene poder, recibido de Jesucristo, para perdonar todos los pecados de los hombres, por muchos y graves que sean."

  - es: "¿Quiénes tienen poder en la Iglesia para perdonar los pecados?"
    en: "Tienen poder en la Iglesia para perdonar los pecados el Papa, los Obispos y los sacerdotes que están debidamente autorizados."

  - es: "¿Cómo perdona la Iglesia los pecados?"
    en: "La Iglesia perdona los pecados en nombre de Jesucristo, principalmente por los sacramentos del Bautismo y de la Penitencia."

  - es: "¿Qué quiere decir «la resurrección de los muertos»?"
    en: "«La resurrección de los muertos» quiere decir que, como Cristo resucitó, así también nosotros resucitaremos al fin del mundo, volviendo a unirse nuestras almas con nuestros mismos cuerpos, para nunca más morir."

  - es: "¿Qué significa «la vida eterna»?"
    en: "«La vida eterna» significa que después de la vida presente hay otra vida que no tiene fin."

  - es: "¿Qué será de nuestra alma después de la muerte?"
    en: "Nuestra alma después de la muerte será juzgada por Dios para recibir premio o castigo según sus obras."

  - es: "¿Cómo premia Dios a los buenos y castiga a los malos?"
    en: "Dios premia a los buenos dándoles el cielo, y castiga a los malos en el infierno."

  - es: "¿Qué es el cielo?"
    en: "El cielo es el lugar donde los buenos viven con Dios eternamente felices."

  - es: "¿Quiénes van al cielo?"
    en: "Van al cielo los que mueren en gracia de Dios."

  - es: "¿Qué es el purgatorio?"
    en: "El purgatorio es el lugar de sufrimiento donde se purifican, antes de entrar en el cielo, los que mueren en gracia de Dios sin haber satisfecho por sus pecados."

  - es: "¿Qué es el infierno?"
    en: "El infierno es el lugar donde los malos, apartados de Dios, sufren penas eternas."

  - es: "¿Quiénes van al infierno?"
    en: "Van al infierno los que mueren en pecado mortal."

  - es: "¿Qué mandamientos debe cumplir el cristiano?"
    en: "El cristiano debe cumplir los mandamientos de la Ley de Dios y de la santa Madre Iglesia."

  - es: "¿Qué es la Ley de Dios?"
    en: "La Ley de Dios es lo que Dios manda al hombre para que lo cumpla."

  - es: "¿Quién es nuestro modelo en el cumplimiento de la Ley de Dios?"
    en: "Nuestro modelo en el cumplimiento de la Ley de Dios es Jesucristo, que vino al mundo para hacer siempre la voluntad del Padre celestial."

  - es: "¿Cuál es el primer mandamiento de la Ley de Dios?"
    en: "El primer mandamiento de la Ley de Dios es: amarás a Dios sobre todas las cosas."

  - es: "¿Qué deberes comprende el primer mandamiento de la Ley de Dios?"
    en: "El primer mandamiento de la Ley de Dios comprende los deberes de creer en Dios, esperar en Él, amarle sobre todas las cosas, y tributarle el honor debido."

  - es: "¿Quién ama a Dios sobre todas las cosas?"
    en: "Ama a Dios sobre todas las cosas el que cumple todos sus mandamientos."

  - es: "¿Quién tributa a Dios el honor debido?"
    en: "Tributa a Dios el honor debido el que le reconoce como único y verdadero Dios, y le adora con suma reverencia de alma y cuerpo."

  - es: "¿Qué honor debemos tributar a Jesucristo?"
    en: "A Jesucristo debemos tributar honor y culto de adoración, por ser el Hijo de Dios hecho hombre."

  - es: "¿Qué honor debemos tributar a la Virgen María?"
    en: "A la Virgen María debemos tributar honor y culto de veneración especialísima, por ser la Madre de Dios."

  - es: "¿A quiénes más debemos tributar culto?"
    en: "Debemos también tributar culto de veneración a los Ángeles y a los Santos, porque ya viven con Dios eternamente felices en el cielo."

  - es: "¿Cuál es el segundo mandamiento de la Ley de Dios?"
    en: "El segundo mandamiento de la Ley de Dios es: no tomarás el nombre de Dios en vano."

  - es: "¿Quién toma el nombre de Dios en vano?"
    en: "Toma el nombre de Dios en vano quien blasfema o lo usa sin el debido respeto."

  - es: "¿Qué es blasfemar?"
    en: "Blasfemar es decir palabras o hacer gestos injuriosos contra Dios, la Virgen, los Santos y la Iglesia."

  - es: "¿Quién usa el nombre de Dios sin el debido respeto?"
    en: "Usa el nombre de Dios sin el debido respeto quien jura sin verdad, sin justicia o sin necesidad, y quien no cumple sus votos."

  - es: "¿Qué es jurar?"
    en: "Jurar es poner a Dios por testigo de lo que decimos o prometemos."

  - es: "¿Qué es voto?"
    en: "Voto es la promesa hecha a Dios de una cosa buena que no impide otra mejor, con intención de obligarse."

