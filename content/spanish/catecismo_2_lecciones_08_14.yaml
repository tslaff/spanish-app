id: catecismo_lecciones_08_14
name: "Catecismo - Lecciones 8-14"

sentences:
  - es: "¿Qué es el hombre? (What is man?)"
    en: "El hombre es un ser racional y libre, compuesto de alma y cuerpo, creado por Dios a su imagen y semejanza. (Man is a rational and free being, composed of soul and body, created by God in His image and likeness.)"

  - es: "¿De quién recibimos el alma? (From whom do we receive our soul?)"
    en: "El alma la recibimos de Dios, que la ha creado de la nada para unirla al cuerpo. (We receive our soul from God, who created it from nothing to unite it to the body.)"

  - es: "¿Cómo es nuestra alma? (What is our soul like?)"
    en: "Nuestra alma es espiritual e inmortal, dotada de entendimiento y voluntad. (Our soul is spiritual and immortal, endowed with intellect and will.)"

  - es: "¿De quién recibimos el cuerpo? (From whom do we receive our body?)"
    en: "El cuerpo lo recibimos de nuestros padres. (We receive our body from our parents.)"

  - es: "¿Para qué ha creado Dios a los hombres? (Why did God create mankind?)"
    en: "Dios ha creado a los hombres para que le amemos y obedezcamos en la tierra y seamos felices con Él en el cielo. (God created mankind so that we might love and obey Him on earth and be happy with Him in heaven.)"

  - es: "¿Los cristianos somos hijos de Dios? (Are Christians children of God?)"
    en: "Los cristianos somos hijos adoptivos de Dios. (Christians are adopted children of God.)"

  - es: "¿Cuándo los cristianos nos hacemos hijos de Dios? (When do Christians become children of God?)"
    en: "Los cristianos nos hacemos hijos de Dios cuando recibimos el Bautismo. (Christians become children of God when we receive Baptism.)"

  - es: "¿Quiénes fueron nuestros primeros padres? (Who were our first parents?)"
    en: "Nuestros primeros padres fueron Adán y Eva, y de ellos descendemos todos los hombres. (Our first parents were Adam and Eve, and all mankind descends from them.)"

  - es: "¿Dónde colocó Dios a nuestros primeros padres? (Where did God place our first parents?)"
    en: "Dios colocó a nuestros primeros padres en un lugar delicioso, llamado paraíso terrenal. (God placed our first parents in a delightful place called the earthly paradise.)"

  - es: "¿Qué dones concedió el Señor a nuestros primeros padres? (What gifts did the Lord grant our first parents?)"
    en: "El Señor concedió a nuestros primeros padres el don divino de la gracia, el conocimiento de las cosas convenientes a su estado, y otros dones que los libraban de la inclinación al pecado, del dolor y de la muerte. (The Lord granted our first parents the divine gift of grace, knowledge suited to their state, and other gifts that freed them from the inclination to sin, from suffering, and from death.)"

  - es: "¿Cómo concedió el Señor estos dones a nuestros primeros padres? (For whom did the Lord grant these gifts to our first parents?)"
    en: "El Señor concedió estos dones a nuestros primeros padres para sí y para todos sus descendientes. (The Lord granted these gifts to our first parents for themselves and for all their descendants.)"

  - es: "¿Qué precepto impuso Dios a nuestros primeros padres? (What precept did God impose on our first parents?)"
    en: "Dios impuso a nuestros primeros padres el precepto de no comer del árbol de la ciencia del bien y del mal. (God imposed on our first parents the precept not to eat from the tree of the knowledge of good and evil.)"

  - es: "¿Obedecieron nuestros primeros padres el precepto de Dios? (Did our first parents obey God's precept?)"
    en: "Nuestros primeros padres no obedecieron el precepto de Dios, pues Eva, engañada por el demonio, comió el fruto prohibido y dio de comer a Adán. (Our first parents did not obey God's precept, for Eve, deceived by the devil, ate the forbidden fruit and gave it to Adam to eat.)"

  - es: "¿Fueron castigados nuestros primeros padres por esta desobediencia? (Were our first parents punished for this disobedience?)"
    en: "Nuestros primeros padres fueron castigados por esta desobediencia, y perdieron el don de la gracia; fueron echados del paraíso, y quedaron sometidos a la lucha con las pasiones, al dolor y a la muerte. (Our first parents were punished for this disobedience: they lost the gift of grace, were cast out of paradise, and were subjected to the struggle with the passions, to suffering, and to death.)"

  - es: "¿A quiénes más perjudicó el pecado de nuestros primeros padres? (Whom else did the sin of our first parents harm?)"
    en: "El pecado de nuestros primeros padres perjudicó también a todos sus descendientes, que quedaron privados de la gracia y de los demás dones. (The sin of our first parents also harmed all their descendants, who were left deprived of grace and the other gifts.)"

  - es: "¿Qué es el pecado original? (What is original sin?)"
    en: "El pecado original es aquel con que todos nacemos, heredado de nuestros primeros padres. (Original sin is that with which we are all born, inherited from our first parents.)"

  - es: "¿Heredó también la Santísima Virgen el pecado original? (Did the Most Holy Virgin also inherit original sin?)"
    en: "La Santísima Virgen no heredó el pecado original, sino que, por singular privilegio, por los méritos de Jesucristo, fue inmaculada desde el primer instante de su concepción. (The Most Holy Virgin did not inherit original sin; rather, by a singular privilege, through the merits of Jesus Christ, she was immaculate from the first instant of her conception.)"

  - es: "¿Cómo se quita el pecado original? (How is original sin removed?)"
    en: "El pecado original se quita por el Bautismo. (Original sin is removed through Baptism.)"

  - es: "¿Cuál de las tres Personas de la Santísima Trinidad se hizo hombre? (Which of the three Persons of the Most Holy Trinity became man?)"
    en: "Se hizo hombre la segunda Persona de la Santísima Trinidad, que es el Hijo. (The second Person of the Most Holy Trinity, who is the Son, became man.)"

  - es: "¿Para qué se hizo hombre el Hijo de Dios? (Why did the Son of God become man?)"
    en: "El Hijo de Dios se hizo hombre para salvarnos y darnos ejemplo de vida. (The Son of God became man to save us and to give us an example of life.)"

  - es: "¿Quién es Jesucristo? (Who is Jesus Christ?)"
    en: "Jesucristo es el Hijo de Dios hecho hombre, que nació de la Virgen María. (Jesus Christ is the Son of God made man, who was born of the Virgin Mary.)"

  - es: "¿Quién es la Virgen María? (Who is the Virgin Mary?)"
    en: "La Virgen María es la Señora llena de gracia y virtudes, concebida sin pecado, que es Madre de Dios y Madre nuestra y está en el cielo. (The Virgin Mary is the Lady full of grace and virtues, conceived without sin, who is Mother of God and our Mother, and is in heaven.)"

  - es: "¿Cómo se realizó la Encarnación del Hijo de Dios? (How was the Incarnation of the Son of God accomplished?)"
    en: "La Encarnación del Hijo de Dios se realizó formando el Espíritu Santo de las purísimas entrañas de la Virgen María un cuerpo perfectísimo y creando un alma nobilísima que unió a aquel cuerpo; en el mismo instante a este cuerpo y alma se unió el Hijo de Dios; y de esta suerte el que antes era sólo Dios, sin dejar de serlo, quedó hecho hombre. (The Incarnation of the Son of God was accomplished when the Holy Spirit formed, from the most pure womb of the Virgin Mary, a most perfect body and created a most noble soul, which He united to that body; in that same instant the Son of God united Himself to this body and soul; and thus He who before was only God, without ceasing to be so, became man.)"

  - es: "¿Por qué decimos que la Virgen María es Madre de Dios? (Why do we say the Virgin Mary is Mother of God?)"
    en: "Decimos que la Virgen María es Madre de Dios, porque de Ella nació Jesucristo, que es verdadero Dios y verdadero hombre. (We say the Virgin Mary is Mother of God because Jesus Christ, true God and true man, was born of her.)"

  - es: "¿Cuántas naturalezas hay en Jesucristo? (How many natures are there in Jesus Christ?)"
    en: "En Jesucristo hay dos naturalezas, una divina porque es Dios y otra humana porque es hombre. (In Jesus Christ there are two natures: one divine, because He is God, and one human, because He is man.)"

  - es: "¿Cuántas personas hay en Jesucristo? (How many persons are there in Jesus Christ?)"
    en: "En Jesucristo hay una sola persona, que es divina, y es la segunda de la Santísima Trinidad. (In Jesus Christ there is only one person, who is divine, the second Person of the Most Holy Trinity.)"

  - es: "¿Cómo nos salvó Jesucristo? (How did Jesus Christ save us?)"
    en: "Jesucristo nos salvó padeciendo y muriendo en la Cruz. (Jesus Christ saved us by suffering and dying on the Cross.)"

  - es: "¿Para qué quiso Jesucristo padecer y morir en la Cruz? (Why did Jesus Christ wish to suffer and die on the Cross?)"
    en: "Jesucristo quiso padecer y morir en la Cruz para redimirnos del pecado y librarnos de la muerte eterna. (Jesus Christ wished to suffer and die on the Cross to redeem us from sin and free us from eternal death.)"

  - es: "¿Cómo nos redimió Jesucristo? (How did Jesus Christ redeem us?)"
    en: "Jesucristo nos redimió ofreciendo el sacrificio de su vida en la Cruz, para obtener el perdón de nuestros pecados y devolvernos la gracia y amistad de Dios. (Jesus Christ redeemed us by offering the sacrifice of His life on the Cross, to obtain forgiveness for our sins and restore to us the grace and friendship of God.)"

  - es: "¿Qué quiere decir «descendió a los infiernos»? (What does \"he descended into hell\" mean?)"
    en: "«Descendió a los infiernos» quiere decir que, después de la muerte del Señor, su alma, unida a la divinidad, fue al encuentro de las almas santas que esperaban su venida en el limbo de los justos, para anunciarles la redención y llevarlas al cielo. (\"He descended into hell\" means that, after the Lord's death, His soul, united to His divinity, went to meet the holy souls awaiting His coming in the limbo of the just, to announce redemption to them and lead them to heaven.)"

  - es: "¿Cómo resucitó Jesucristo? (How did Jesus Christ rise from the dead?)"
    en: "Jesucristo resucitó uniendo de nuevo su alma al cuerpo, y saliendo vivo y glorioso del sepulcro para nunca más morir. (Jesus Christ rose by reuniting His soul to His body, coming forth alive and glorious from the tomb, never to die again.)"

  - es: "¿A quiénes se apareció Jesucristo después de resucitado? (To whom did Jesus Christ appear after rising?)"
    en: "Jesucristo, después de resucitado, se apareció a su Madre Santísima, a las santas mujeres, a los Apóstoles y a muchos discípulos. (After rising, Jesus Christ appeared to His Most Holy Mother, to the holy women, to the Apostles, and to many disciples.)"

  - es: "¿Dónde está Jesucristo? (Where is Jesus Christ?)"
    en: "Jesucristo, después de su muerte, resucitó y está en el cielo y en el Santísimo Sacramento del Altar. (After His death, Jesus Christ rose again and is in heaven and in the Most Blessed Sacrament of the Altar.)"

  - es: "¿Cuándo subió Jesucristo a los cielos? (When did Jesus Christ ascend into heaven?)"
    en: "Jesucristo subió a los cielos por su propio poder a los cuarenta días después de resucitado, en presencia de sus discípulos. (Jesus Christ ascended into heaven by His own power forty days after rising, in the presence of His disciples.)"

  - es: "¿Qué entendemos al decir que Jesucristo está sentado a la diestra de Dios Padre? (What do we understand by saying Jesus Christ is seated at the right hand of God the Father?)"
    en: "Al decir que Jesucristo está sentado a la diestra de Dios Padre, entendemos que Jesucristo en cuanto Dios tiene igual poder y gloria que el Padre, y participa plenamente del mismo poder y gloria en cuanto hombre. (By this we understand that Jesus Christ, as God, has equal power and glory with the Father, and fully shares in that same power and glory as man.)"

  - es: "¿Cuándo ha de venir Jesucristo a juzgar a los vivos y a los muertos? (When will Jesus Christ come to judge the living and the dead?)"
    en: "Jesucristo ha de venir a juzgar a los vivos y a los muertos, con toda su gloria y majestad, al fin del mundo. (Jesus Christ will come to judge the living and the dead, with all His glory and majesty, at the end of the world.)"

  - es: "¿Qué prometió Jesucristo al subir a los cielos? (What did Jesus Christ promise when He ascended into heaven?)"
    en: "Jesucristo, al subir a los cielos, prometió que nos enviaría el Espíritu Santo. (When He ascended into heaven, Jesus Christ promised that He would send us the Holy Spirit.)"

  - es: "¿Quién es el Espíritu Santo? (Who is the Holy Spirit?)"
    en: "El Espíritu Santo es la tercera Persona de la Santísima Trinidad, que procede del Padre y del Hijo. (The Holy Spirit is the third Person of the Most Holy Trinity, who proceeds from the Father and the Son.)"

  - es: "¿Cuándo envió Jesucristo el Espíritu Santo? (When did Jesus Christ send the Holy Spirit?)"
    en: "Jesucristo envió el Espíritu Santo a su Iglesia el día de Pentecostés, diez días después de su ascensión a los cielos. (Jesus Christ sent the Holy Spirit to His Church on the day of Pentecost, ten days after His ascension into heaven.)"

  - es: "¿Para qué envió Jesucristo el Espíritu Santo? (Why did Jesus Christ send the Holy Spirit?)"
    en: "Jesucristo envió el Espíritu Santo para santificar nuestras almas y asistir a su Santa Iglesia. (Jesus Christ sent the Holy Spirit to sanctify our souls and to assist His holy Church.)"

  - es: "¿Cómo nos santifica el Espíritu Santo? (How does the Holy Spirit sanctify us?)"
    en: "El Espíritu Santo nos santifica por medio de la gracia, de las virtudes y de sus dones. (The Holy Spirit sanctifies us through grace, the virtues, and His gifts.)"

