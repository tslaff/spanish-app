id: catecismo_lecciones_01_07
name: "Catecismo - Lecciones 1-7"

sentences:
  - es: "¿Eres cristiano?"
    en: "Soy cristiano por la gracia de Dios."

  - es: "¿Qué es ser cristiano?"
    en: "Ser cristiano es ser discípulo de Cristo."

  - es: "¿Cómo nos hacernos cristianos?"
    en: "Nos hacemos cristianos por el santo Bautismo."

  - es: "¿Quién es buen cristiano?"
    en: "Buen cristiano es el discípulo de Cristo, que cree su doctrina y la practica."

  - es: "¿Por qué nos llamamos también católicos?"
    en: "Nos llamamos también católicos porque somos hijos de la Iglesia Católica."

  - es: "¿Cuál es la señal del cristiano?"
    en: "La señal del cristiano es la santa Cruz."

  - es: "¿Por qué la señal del cristiano es la santa Cruz?"
    en: "La señal del cristiano es la santa Cruz porque en ella murió Jesucristo Nuestro Señor para redimir a todos los hombres."

  - es: "¿Para qué hacemos la señal de la Cruz?"
    en: "Hacemos la señal de la Cruz para manifestar que somos cristianos, y para pedir a Jesucristo que nos ayude a ser buenos y nos libre de peligros."

  - es: "¿De cuántas maneras usa el cristiano la señal de la Cruz?"
    en: "El cristiano usa la señal de la Cruz de dos maneras, que son: signarse y santiguarse."

  - es: "¿Qué es signarse?"
    en: "Signarse es hacer tres cruces con el dedo pulgar de la mano derecha: la primera en la frente, diciendo: Por la señal de la santa Cruz; la segunda en la boca, diciendo: de nuestros enemigos; y la tercera en el pecho, diciendo: líbranos, Señor, Dios nuestro."

  - es: "¿Qué es santiguarse?"
    en: "Santiguarse es hacer una cruz con la mano derecha desde la frente al pecho, y desde el hombro izquierdo al derecho, diciendo: En el nombre del Padre, y del Hijo, y del Espíritu Santo. Amén."

  - es: "¿Cuándo conviene hacer la señal de la Cruz?"
    en: "Conviene hacer la señal de la Cruz principalmente al levantarnos, al salir de casa, al entrar en la Iglesia, al empezar el trabajo, antes de comer, al acostarnos y, sobre todo, al vernos en alguna necesidad, tentación o peligro."

  - es: "¿Qué debe saber el cristiano?"
    en: "El cristiano debe saber la doctrina cristiana."

  - es: "¿Qué es la doctrina cristiana?"
    en: "La doctrina cristiana es la que predicó Nuestro Señor Jesucristo para enseñarnos el camino del cielo."

  - es: "¿Cuáles son las partes principales de la doctrina cristiana?"
    en: "Las partes principales de la doctrina cristiana son tres: las verdades, que debemos creer; los mandamientos, que debemos cumplir; y los medios que debemos emplear para santificarnos, que son la oración y los sacramentos."

  - es: "¿Qué es el Catecismo?"
    en: "El Catecismo es el resumen de la doctrina enseñada por Jesucristo, que todo cristiano debe saber y practicar."

  - es: "¿Qué verdades debemos creer?"
    en: "Debemos creer las verdades que Dios ha revelado y la Iglesia nos enseña."

  - es: "¿Dónde se contienen las principales verdades que debemos creer?"
    en: "Las principales verdades que debemos creer se contienen en el Credo."

  - es: "¿Qué quiere decir la palabra «Creo»?"
    en: "La palabra «Creo» quiere decir: acepto firmemente las verdades reveladas por Dios, que no puede ni engañarse ni engañarnos."

  - es: "¿Quién es Dios?"
    en: "Dios es nuestro Padre, que está en los cielos; Creador y Señor de todas las cosas, que premia a los buenos y castiga a los malos."

  - es: "¿Cómo es Dios?"
    en: "Dios es espíritu purísimo, infinitamente perfecto, bueno, sabio, poderoso y eterno, principio y fin de todas las cosas."

  - es: "¿Por qué decimos que Dios es «espíritu purísimo»?"
    en: "Decimos que Dios es «espíritu» porque es sabiduría y amor y no tiene cuerpo; y decimos que es «purísimo» porque es más perfecto que las almas y los Ángeles."

  - es: "¿Por qué decimos que Dios es infinitamente perfecto?"
    en: "Decimos que Dios es infinitamente perfecto, porque tiene todas las perfecciones sin defecto ni límite."

  - es: "¿Por qué decimos que Dios es principio de todas las cosas?"
    en: "Decimos que Dios es principio de todas las cosas porque las ha creado todas."

  - es: "¿Por qué decimos que Dios es fin de todas las cosas?"
    en: "Decimos que Dios es fin de todas las cosas, porque todas las ha creado para manifestar sus perfecciones y su gloria."

  - es: "¿Dónde está Dios?"
    en: "Dios está en los cielos, en la tierra y en todas partes."

  - es: "¿Dios lo ve todo?"
    en: "Dios lo ve todo, lo pasado, lo presente y lo futuro, y hasta los más ocultos pensamientos."

  - es: "¿Hay un solo Dios?"
    en: "Sí hay un solo Dios."

  - es: "¿Cuántas Personas hay en Dios?"
    en: "En Dios hay tres Personas: Padre, Hijo y Espíritu Santo."

  - es: "¿Quién es la Santísima Trinidad?"
    en: "La Santísima Trinidad es el mismo Dios, Padre, Hijo y Espíritu Santo, tres Personas distintas y un solo Dios verdadero."

  - es: "¿Cada una de las Personas de la Santísima Trinidad es Dios?"
    en: "Cada una de las Personas de la Santísima Trinidad es Dios: el Padre es Dios, el Hijo es Dios y el Espíritu Santo es Dios."

  - es: "¿Las tres Personas de la Santísima Trinidad son tres dioses?"
    en: "Las tres Personas de la Santísima Trinidad no son tres dioses, sino un solo Dios, porque tienen una sola naturaleza divina."

  - es: "¿Por qué decimos que la Santísima Trinidad es un misterio?"
    en: "Decimos que la Santísima Trinidad es un misterio, porque ninguna inteligencia creada puede entenderlo en este mundo."

  - es: "¿Entenderemos en el cielo el misterio de la Santísima Trinidad?"
    en: "En el cielo entenderemos el misterio de la Santísima Trinidad, como ya lo entienden los Ángeles y los Santos."

  - es: "¿Por qué decimos que Dios es todopoderoso?"
    en: "Decimos que Dios es todopoderoso, porque con su poder hace todo cuanto quiere."

  - es: "¿Por qué decimos que Dios es creador?"
    en: "Decimos que Dios es creador, porque todas las cosas las hizo de la nada."

  - es: "¿Por qué decimos que Dios es Señor de todas las cosas?"
    en: "Decimos que Dios es Señor de todas las cosas, porque todas le pertenecen y las gobierna y cuida de ellas con sabiduría y bondad."

  - es: "¿Qué es la Providencia de Dios?"
    en: "La Providencia de Dios es el cuidado amoroso con que Dios conserva y gobierna las cosas y especialmente a los hombres."

  - es: "¿Cuáles son los seres más perfectos de la creación?"
    en: "Los seres más perfectos de la creación son los Ángeles y los hombres."

  - es: "¿Qué son los Ángeles?"
    en: "Los Ángeles son espíritus puros, esto es, sin cuerpo, que tienen entendimiento y voluntad."

  - es: "¿Para qué ha creado Dios a los Ángeles?"
    en: "Dios ha creado a los Ángeles para que le alaben, obedezcan y sean felices en el cielo."

  - es: "¿Quién es el Ángel de la Guarda?"
    en: "El Ángel de la Guarda es el que Dios nos da a cada uno para que nos guarde en la tierra y nos guíe hacia el cielo."

  - es: "¿Quiénes son los demonios?"
    en: "Los demonios son unos ángeles que desobedecieron a Dios, y fueron condenados al infierno."

  - es: "¿Qué hacen los demonios?"
    en: "Los demonios odian a Dios y tientan a los hombres para apartarlos del camino del cielo."

