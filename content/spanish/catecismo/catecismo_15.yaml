id: catecismo_15
name: Catecismo 15
sentences:
- es: ¿Es lícita la venganza? (Is revenge lawful?)
  en: La venganza nunca es lícita, porque nadie debe tomarse la justicia por su mano. (Revenge is never lawful, because no
    one may take justice into his own hands.)
- es: ¿Cuál es el sexto mandamiento de la Ley de Dios? (What is the sixth commandment of the Law of God?)
  en: 'El sexto mandamiento de la Ley de Dios es: no cometerás actos impuros. (The sixth commandment of the Law of God is:
    you shall not commit impure acts.)'
- es: ¿Qué nos manda el sexto mandamiento? (What does the sixth commandment command us?)
  en: El sexto mandamiento nos manda que seamos puros y castos en obras y palabras. (The sixth commandment commands us to
    be pure and chaste in deeds and words.)
- es: ¿Tenemos los cristianos un motivo especial para amar la pureza? (Do Christians have a special reason to love purity?)
  en: Los cristianos tenemos un motivo especial para amar la pureza, porque somos por la gracia miembros de Cristo y templos
    del Espíritu Santo. (We Christians have a special reason to love purity, because by grace we are members of Christ and
    temples of the Holy Spirit.)
- es: ¿Quiénes pecan contra la pureza? (Who sins against purity?)
  en: Pecan contra la pureza los que consigo o con otros cometen acciones deshonestas, y los que voluntariamente se ponen
    a sí mismos o ponen a otros en peligro de cometerlas. (Those who commit indecent acts with themselves or with others sin
    against purity, as do those who willingly put themselves or others in danger of committing them.)
- es: ¿Cuáles son los medios principales para guardar la pureza? (What are the main means of preserving purity?)
  en: 'Los medios principales para guardar la pureza son: la confesión y comunión frecuentes, la devoción a la Santísima Virgen,
    la modestia y la huida de las ocasiones peligrosas, como conversaciones, miradas, lecturas, modas, bailes y espectáculos
    deshonestos. (The main means of preserving purity are: frequent confession and communion, devotion to the Most Holy Virgin,
    modesty, and fleeing from dangerous occasions, such as indecent conversations, glances, reading material, fashions, dances,
    and shows.)'
- es: ¿Cuál es el séptimo mandamiento de la Ley de Dios? (What is the seventh commandment of the Law of God?)
  en: 'El séptimo mandamiento de la Ley de Dios es: no hurtarás. (The seventh commandment of the Law of God is: you shall
    not steal.)'
- es: ¿Qué prohíbe el séptimo mandamiento? (What does the seventh commandment forbid?)
  en: El séptimo mandamiento prohíbe hacer daño al prójimo en sus bienes. (The seventh commandment forbids doing harm to one's
    neighbor's property.)
- es: ¿Quiénes pecan contra el séptimo mandamiento? (Who sins against the seventh commandment?)
  en: Pecan contra el séptimo mandamiento los que roban; los que perjudican y defraudan al prójimo en sus bienes; los que
    no pagan el justo salario o no trabajan lo que deben; y los que retienen bienes ajenos contra la voluntad de su dueño.
    (Those who steal; those who harm or defraud their neighbor in his goods; those who do not pay a just wage or do not do
    the work they owe; and those who withhold another's property against the owner's will.)
- es: ¿A qué están obligados los que han hecho daño al prójimo en sus bienes? (What are those who have harmed their neighbor's
    goods obliged to do?)
  en: Los que han hecho daño al prójimo en sus bienes, están obligados a restituir lo mal adquirido y a reparar los daños
    culpablemente causados. (They are obliged to restore what was wrongly acquired and to repair the damage culpably caused.)
- es: ¿Cuál es el octavo mandamiento de la Ley de Dios? (What is the eighth commandment of the Law of God?)
  en: 'El octavo mandamiento de la Ley de Dios es: no dirás falso testimonio ni mentirás. (The eighth commandment of the Law
    of God is: you shall not bear false witness nor tell lies.)'
