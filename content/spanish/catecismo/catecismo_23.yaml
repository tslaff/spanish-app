id: catecismo_23
name: Catecismo 23
sentences:
- es: ¿Qué males nos causa el pecado venial? (What harm does venial sin cause us?)
  en: El pecado venial disminuye el fervor de la caridad, nos va disponiendo para el pecado mortal, y nos hace merecedores
    de las penas del purgatorio. (Venial sin diminishes the fervor of charity, disposes us toward mortal sin, and makes us
    deserving of the punishments of purgatory.)
- es: ¿Cuántos son los pecados capitales? (How many capital sins are there?)
  en: 'Los pecados capitales son siete: soberbia, avaricia, lujuria, ira, gula, envidia y pereza. (There are seven capital
    sins: pride, avarice, lust, wrath, gluttony, envy, and sloth.)'
- es: ¿Qué virtudes hay contra estos siete vicios o pecados capitales? (What virtues oppose these seven capital sins?)
  en: Contra la soberbia, humildad; contra la avaricia, generosidad; contra la lujuria, castidad; contra la ira, paciencia;
    contra la gula, templanza; contra la envidia, caridad; y contra la pereza, diligencia. (Against pride, humility; against
    avarice, generosity; against lust, chastity; against wrath, patience; against gluttony, temperance; against envy, charity;
    and against sloth, diligence.)
- es: ¿Cuántos son los enemigos del alma? (How many enemies does the soul have?)
  en: 'Los enemigos del alma son tres: el mundo, el demonio y la carne. (The soul has three enemies: the world, the devil,
    and the flesh.)'
- es: ¿Por qué el mundo, el demonio y la carne son enemigos del alma? (Why are the world, the devil, and the flesh enemies
    of the soul?)
  en: El mundo, el demonio y la carne son enemigos del alma porque con sus tentaciones nos inducen al pecado. (Because through
    their temptations they lead us into sin.)
- es: ¿Podemos con nuestras propias fuerzas cumplir todos los mandamientos y ganar el cielo? (Can we, by our own strength
    alone, keep all the commandments and gain heaven?)
  en: Sólo con nuestras fuerzas no podemos cumplir los mandamientos ni ganar el cielo, porque necesitamos el auxilio de la
    gracia. (By our own strength alone we cannot keep the commandments or gain heaven, because we need the help of grace.)
- es: ¿Qué es la gracia? (What is grace?)
  en: La gracia es un don sobrenatural que Dios nos concede para alcanzar la vida eterna. (Grace is a supernatural gift that
    God grants us to attain eternal life.)
- es: ¿Cuántas clases hay de gracia? (How many kinds of grace are there?)
  en: 'Hay dos clases de gracia: la gracia santificante y la gracia actual. (There are two kinds of grace: sanctifying grace
    and actual grace.)'
- es: ¿A qué llamamos gracia santificante? (What do we call sanctifying grace?)
  en: Llamamos gracia santificante a la que nos hace hijos de Dios y herederos del cielo. (We call sanctifying grace that
    which makes us children of God and heirs of heaven.)
- es: ¿Qué es gracia actual? (What is actual grace?)
  en: Gracia actual es un auxilio de Dios que ilumina nuestro entendimiento o mueve nuestra voluntad para obrar el bien y
    evitar el mal. (Actual grace is a help from God that enlightens our mind or moves our will to do good and avoid evil.)
