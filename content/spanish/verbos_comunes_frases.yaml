- es: Saldremos temprano para evitar el tráfico.
  en: We’ll leave early to avoid the traffic.
- es: Yo creía que venías hoy, pero me dijiste que llegarías mañana.
  en: I thought you were coming today, but you told me you would arrive tomorrow.
- es: Mientras buscábamos piso, vimos varios que nos gustaron, pero eran demasiado caros.
  en: While we were looking for a flat, we saw several we liked, but they were too expensive.
- es: Nunca he probado ese plato, pero mañana lo comeré.
