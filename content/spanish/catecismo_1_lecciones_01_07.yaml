id: catecismo_lecciones_01_07
name: "Catecismo - Lecciones 1-7"

sentences:
  - es: "¿Eres cristiano? (Are you a Christian?)"
    en: "Soy cristiano por la gracia de Dios. (I am a Christian by the grace of God.)"

  - es: "¿Qué es ser cristiano? (What does it mean to be a Christian?)"
    en: "Ser cristiano es ser discípulo de Cristo. (To be a Christian is to be a disciple of Christ.)"

  - es: "¿Cómo nos hacernos cristianos? (How do we become Christians?)"
    en: "Nos hacemos cristianos por el santo Bautismo. (We become Christians through holy Baptism.)"

  - es: "¿Quién es buen cristiano? (Who is a good Christian?)"
    en: "Buen cristiano es el discípulo de Cristo, que cree su doctrina y la practica. (A good Christian is a disciple of Christ who believes his doctrine and practices it.)"

  - es: "¿Por qué nos llamamos también católicos? (Why are we also called Catholics?)"
    en: "Nos llamamos también católicos porque somos hijos de la Iglesia Católica. (We are also called Catholics because we are children of the Catholic Church.)"

  - es: "¿Cuál es la señal del cristiano? (What is the sign of the Christian?)"
    en: "La señal del cristiano es la santa Cruz. (The sign of the Christian is the holy Cross.)"

  - es: "¿Por qué la señal del cristiano es la santa Cruz? (Why is the sign of the Christian the holy Cross?)"
    en: "La señal del cristiano es la santa Cruz porque en ella murió Jesucristo Nuestro Señor para redimir a todos los hombres. (The sign of the Christian is the holy Cross because on it Jesus Christ our Lord died to redeem all men.)"

  - es: "¿Para qué hacemos la señal de la Cruz? (Why do we make the Sign of the Cross?)"
    en: "Hacemos la señal de la Cruz para manifestar que somos cristianos, y para pedir a Jesucristo que nos ayude a ser buenos y nos libre de peligros. (We make the Sign of the Cross to show that we are Christians, and to ask Jesus Christ to help us be good and free us from dangers.)"

  - es: "¿De cuántas maneras usa el cristiano la señal de la Cruz? (In how many ways does the Christian use the Sign of the Cross?)"
    en: "El cristiano usa la señal de la Cruz de dos maneras, que son: signarse y santiguarse. (The Christian uses the Sign of the Cross in two ways: signing oneself and blessing oneself.)"

  - es: "¿Qué es signarse? (What is signing oneself?)"
    en: "Signarse es hacer tres cruces con el dedo pulgar de la mano derecha: la primera en la frente, diciendo: Por la señal de la santa Cruz; la segunda en la boca, diciendo: de nuestros enemigos; y la tercera en el pecho, diciendo: líbranos, Señor, Dios nuestro. (Signing oneself is making three small crosses with the thumb of the right hand: the first on the forehead, saying: By the sign of the holy Cross; the second on the mouth, saying: from our enemies; and the third on the chest, saying: deliver us, Lord, our God.)"

  - es: "¿Qué es santiguarse? (What is blessing oneself?)"
    en: "Santiguarse es hacer una cruz con la mano derecha desde la frente al pecho, y desde el hombro izquierdo al derecho, diciendo: En el nombre del Padre, y del Hijo, y del Espíritu Santo. Amén. (Blessing oneself is making a cross with the right hand from the forehead to the chest, and from the left shoulder to the right, saying: In the name of the Father, and of the Son, and of the Holy Spirit. Amen.)"

  - es: "¿Cuándo conviene hacer la señal de la Cruz? (When is it fitting to make the Sign of the Cross?)"
    en: "Conviene hacer la señal de la Cruz principalmente al levantarnos, al salir de casa, al entrar en la Iglesia, al empezar el trabajo, antes de comer, al acostarnos y, sobre todo, al vernos en alguna necesidad, tentación o peligro. (It is fitting to make the Sign of the Cross especially on waking, on leaving the house, on entering the Church, on beginning work, before eating, on going to bed, and above all when facing any need, temptation, or danger.)"

  - es: "¿Qué debe saber el cristiano? (What must a Christian know?)"
    en: "El cristiano debe saber la doctrina cristiana. (A Christian must know Christian doctrine.)"

  - es: "¿Qué es la doctrina cristiana? (What is Christian doctrine?)"
    en: "La doctrina cristiana es la que predicó Nuestro Señor Jesucristo para enseñarnos el camino del cielo. (Christian doctrine is what our Lord Jesus Christ preached to teach us the way to heaven.)"

  - es: "¿Cuáles son las partes principales de la doctrina cristiana? (What are the main parts of Christian doctrine?)"
    en: "Las partes principales de la doctrina cristiana son tres: las verdades, que debemos creer; los mandamientos, que debemos cumplir; y los medios que debemos emplear para santificarnos, que son la oración y los sacramentos. (The main parts of Christian doctrine are three: the truths we must believe; the commandments we must fulfill; and the means we must use to sanctify ourselves, which are prayer and the sacraments.)"

  - es: "¿Qué es el Catecismo? (What is the Catechism?)"
    en: "El Catecismo es el resumen de la doctrina enseñada por Jesucristo, que todo cristiano debe saber y practicar. (The Catechism is the summary of the doctrine taught by Jesus Christ, which every Christian must know and practice.)"

  - es: "¿Qué verdades debemos creer? (What truths must we believe?)"
    en: "Debemos creer las verdades que Dios ha revelado y la Iglesia nos enseña. (We must believe the truths that God has revealed and that the Church teaches us.)"

  - es: "¿Dónde se contienen las principales verdades que debemos creer? (Where are the main truths we must believe contained?)"
    en: "Las principales verdades que debemos creer se contienen en el Credo. (The main truths we must believe are contained in the Creed.)"

  - es: "¿Qué quiere decir la palabra «Creo»? (What does the word \"I believe\" mean?)"
    en: "La palabra «Creo» quiere decir: acepto firmemente las verdades reveladas por Dios, que no puede ni engañarse ni engañarnos. (The word \"I believe\" means: I firmly accept the truths revealed by God, who can neither deceive nor be deceived.)"

  - es: "¿Quién es Dios? (Who is God?)"
    en: "Dios es nuestro Padre, que está en los cielos; Creador y Señor de todas las cosas, que premia a los buenos y castiga a los malos. (God is our Father, who is in heaven; Creator and Lord of all things, who rewards the good and punishes the wicked.)"

  - es: "¿Cómo es Dios? (What is God like?)"
    en: "Dios es espíritu purísimo, infinitamente perfecto, bueno, sabio, poderoso y eterno, principio y fin de todas las cosas. (God is a most pure spirit, infinitely perfect, good, wise, powerful, and eternal, the beginning and end of all things.)"

  - es: "¿Por qué decimos que Dios es «espíritu purísimo»? (Why do we say God is a most pure spirit?)"
    en: "Decimos que Dios es «espíritu» porque es sabiduría y amor y no tiene cuerpo; y decimos que es «purísimo» porque es más perfecto que las almas y los Ángeles. (We say God is \"spirit\" because He is wisdom and love and has no body; and we say He is \"most pure\" because He is more perfect than souls and Angels.)"

  - es: "¿Por qué decimos que Dios es infinitamente perfecto? (Why do we say God is infinitely perfect?)"
    en: "Decimos que Dios es infinitamente perfecto, porque tiene todas las perfecciones sin defecto ni límite. (We say God is infinitely perfect because He has all perfections without defect or limit.)"

  - es: "¿Por qué decimos que Dios es principio de todas las cosas? (Why do we say God is the beginning of all things?)"
    en: "Decimos que Dios es principio de todas las cosas porque las ha creado todas. (We say God is the beginning of all things because He has created them all.)"

  - es: "¿Por qué decimos que Dios es fin de todas las cosas? (Why do we say God is the end of all things?)"
    en: "Decimos que Dios es fin de todas las cosas, porque todas las ha creado para manifestar sus perfecciones y su gloria. (We say God is the end of all things, because He created them all to manifest His perfections and His glory.)"

  - es: "¿Dónde está Dios? (Where is God?)"
    en: "Dios está en los cielos, en la tierra y en todas partes. (God is in heaven, on earth, and everywhere.)"

  - es: "¿Dios lo ve todo? (Does God see everything?)"
    en: "Dios lo ve todo, lo pasado, lo presente y lo futuro, y hasta los más ocultos pensamientos. (God sees everything: the past, the present, and the future, and even our most hidden thoughts.)"

  - es: "¿Hay un solo Dios? (Is there only one God?)"
    en: "Sí hay un solo Dios. (Yes, there is only one God.)"

  - es: "¿Cuántas Personas hay en Dios? (How many Persons are there in God?)"
    en: "En Dios hay tres Personas: Padre, Hijo y Espíritu Santo. (In God there are three Persons: Father, Son, and Holy Spirit.)"

  - es: "¿Quién es la Santísima Trinidad? (Who is the Most Holy Trinity?)"
    en: "La Santísima Trinidad es el mismo Dios, Padre, Hijo y Espíritu Santo, tres Personas distintas y un solo Dios verdadero. (The Most Holy Trinity is the same God, Father, Son, and Holy Spirit, three distinct Persons and one true God.)"

  - es: "¿Cada una de las Personas de la Santísima Trinidad es Dios? (Is each of the Persons of the Most Holy Trinity God?)"
    en: "Cada una de las Personas de la Santísima Trinidad es Dios: el Padre es Dios, el Hijo es Dios y el Espíritu Santo es Dios. (Each of the Persons of the Most Holy Trinity is God: the Father is God, the Son is God, and the Holy Spirit is God.)"

  - es: "¿Las tres Personas de la Santísima Trinidad son tres dioses? (Are the three Persons of the Most Holy Trinity three gods?)"
    en: "Las tres Personas de la Santísima Trinidad no son tres dioses, sino un solo Dios, porque tienen una sola naturaleza divina. (The three Persons of the Most Holy Trinity are not three gods, but one true God, because they share a single divine nature.)"

  - es: "¿Por qué decimos que la Santísima Trinidad es un misterio? (Why do we say the Most Holy Trinity is a mystery?)"
    en: "Decimos que la Santísima Trinidad es un misterio, porque ninguna inteligencia creada puede entenderlo en este mundo. (We say the Most Holy Trinity is a mystery, because no created mind can fully understand it in this world.)"

  - es: "¿Entenderemos en el cielo el misterio de la Santísima Trinidad? (Will we understand the mystery of the Most Holy Trinity in heaven?)"
    en: "En el cielo entenderemos el misterio de la Santísima Trinidad, como ya lo entienden los Ángeles y los Santos. (In heaven we will understand the mystery of the Most Holy Trinity, as the Angels and Saints already do.)"

  - es: "¿Por qué decimos que Dios es todopoderoso? (Why do we say God is almighty?)"
    en: "Decimos que Dios es todopoderoso, porque con su poder hace todo cuanto quiere. (We say God is almighty, because with His power He does everything He wills.)"

  - es: "¿Por qué decimos que Dios es creador? (Why do we say God is the Creator?)"
    en: "Decimos que Dios es creador, porque todas las cosas las hizo de la nada. (We say God is the Creator, because He made all things out of nothing.)"

  - es: "¿Por qué decimos que Dios es Señor de todas las cosas? (Why do we say God is Lord of all things?)"
    en: "Decimos que Dios es Señor de todas las cosas, porque todas le pertenecen y las gobierna y cuida de ellas con sabiduría y bondad. (We say God is Lord of all things, because they all belong to Him and He governs and cares for them with wisdom and goodness.)"

  - es: "¿Qué es la Providencia de Dios? (What is the Providence of God?)"
    en: "La Providencia de Dios es el cuidado amoroso con que Dios conserva y gobierna las cosas y especialmente a los hombres. (The Providence of God is the loving care with which God preserves and governs all things, and especially mankind.)"

  - es: "¿Cuáles son los seres más perfectos de la creación? (Which are the most perfect beings of creation?)"
    en: "Los seres más perfectos de la creación son los Ángeles y los hombres. (The most perfect beings of creation are the Angels and men.)"

  - es: "¿Qué son los Ángeles? (What are the Angels?)"
    en: "Los Ángeles son espíritus puros, esto es, sin cuerpo, que tienen entendimiento y voluntad. (The Angels are pure spirits, that is, without bodies, possessing intellect and will.)"

  - es: "¿Para qué ha creado Dios a los Ángeles? (Why did God create the Angels?)"
    en: "Dios ha creado a los Ángeles para que le alaben, obedezcan y sean felices en el cielo. (God created the Angels so that they might praise and obey Him and be happy in heaven.)"

  - es: "¿Quién es el Ángel de la Guarda? (Who is the Guardian Angel?)"
    en: "El Ángel de la Guarda es el que Dios nos da a cada uno para que nos guarde en la tierra y nos guíe hacia el cielo. (The Guardian Angel is the one God gives to each of us to guard us on earth and guide us toward heaven.)"

  - es: "¿Quiénes son los demonios? (Who are the demons?)"
    en: "Los demonios son unos ángeles que desobedecieron a Dios, y fueron condenados al infierno. (The demons are angels who disobeyed God and were condemned to hell.)"

  - es: "¿Qué hacen los demonios? (What do the demons do?)"
    en: "Los demonios odian a Dios y tientan a los hombres para apartarlos del camino del cielo. (The demons hate God and tempt men to lead them away from the path to heaven.)"

