id: catecismo_05
name: Catecismo 05
sentences:
- es: ¿Quién es el Ángel de la Guarda? (Who is the Guardian Angel?)
  en: El Ángel de la Guarda es el que Dios nos da a cada uno para que nos guarde en la tierra y nos guíe hacia el cielo. (The
    Guardian Angel is the one God gives to each of us to guard us on earth and guide us toward heaven.)
- es: ¿Quiénes son los demonios? (Who are the demons?)
  en: Los demonios son unos ángeles que desobedecieron a Dios, y fueron condenados al infierno. (The demons are angels who
    disobeyed God and were condemned to hell.)
- es: ¿Qué hacen los demonios? (What do the demons do?)
  en: Los demonios odian a Dios y tientan a los hombres para apartarlos del camino del cielo. (The demons hate God and tempt
    men to lead them away from the path to heaven.)
- es: ¿Qué es el hombre? (What is man?)
  en: El hombre es un ser racional y libre, compuesto de alma y cuerpo, creado por Dios a su imagen y semejanza. (Man is a
    rational and free being, composed of soul and body, created by God in His image and likeness.)
- es: ¿De quién recibimos el alma? (From whom do we receive our soul?)
  en: El alma la recibimos de Dios, que la ha creado de la nada para unirla al cuerpo. (We receive our soul from God, who
    created it from nothing to unite it to the body.)
- es: ¿Cómo es nuestra alma? (What is our soul like?)
  en: Nuestra alma es espiritual e inmortal, dotada de entendimiento y voluntad. (Our soul is spiritual and immortal, endowed
    with intellect and will.)
- es: ¿De quién recibimos el cuerpo? (From whom do we receive our body?)
  en: El cuerpo lo recibimos de nuestros padres. (We receive our body from our parents.)
- es: ¿Para qué ha creado Dios a los hombres? (Why did God create mankind?)
  en: Dios ha creado a los hombres para que le amemos y obedezcamos en la tierra y seamos felices con Él en el cielo. (God
    created mankind so that we might love and obey Him on earth and be happy with Him in heaven.)
- es: ¿Los cristianos somos hijos de Dios? (Are Christians children of God?)
  en: Los cristianos somos hijos adoptivos de Dios. (Christians are adopted children of God.)
- es: ¿Cuándo los cristianos nos hacemos hijos de Dios? (When do Christians become children of God?)
  en: Los cristianos nos hacemos hijos de Dios cuando recibimos el Bautismo. (Christians become children of God when we receive
    Baptism.)
