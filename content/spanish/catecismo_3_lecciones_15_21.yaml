id: catecismo_lecciones_15_21
name: "Catecismo - Lecciones 15-21"

sentences:
  - es: "¿Qué es la santa Iglesia? (What is the holy Church?)"
    en: "La santa Iglesia es la congregación de los fieles cristianos, fundada por Jesucristo, y cuya cabeza visible es el Papa. (The holy Church is the congregation of the Christian faithful, founded by Jesus Christ, whose visible head is the Pope.)"

  - es: "¿Cómo asiste el Espíritu Santo a la Iglesia? (How does the Holy Spirit assist the Church?)"
    en: "El Espíritu Santo asiste a la Iglesia iluminándola para que enseñe la verdad cristiana sin error, dirigiéndola en su gobierno y conservándola hasta el fin del mundo. (The Holy Spirit assists the Church by enlightening her to teach Christian truth without error, guiding her in her governance, and preserving her until the end of the world.)"

  - es: "¿Quién es el Papa? (Who is the Pope?)"
    en: "El Papa o Romano Pontífice es el Vicario de Cristo en la tierra, que hace sus veces en el gobierno de la Iglesia. (The Pope, or Roman Pontiff, is the Vicar of Christ on earth, who acts in His place in the governance of the Church.)"

  - es: "¿Estamos obligados a obedecer al Papa? (Are we obliged to obey the Pope?)"
    en: "Estamos obligados a obedecer al Papa porque es el Padre y Pastor supremo de toda la Iglesia. (We are obliged to obey the Pope because he is the supreme Father and Pastor of the whole Church.)"

  - es: "¿Puede equivocarse el Papa? (Can the Pope err?)"
    en: "El Papa no puede equivocarse cuando define doctrinas de fe y de moral como Maestro supremo de toda la Iglesia. (The Pope cannot err when he defines doctrines of faith and morals as the supreme Teacher of the whole Church.)"

  - es: "¿Quiénes son los Obispos? (Who are the Bishops?)"
    en: "Los Obispos son los sucesores de los Apóstoles, puestos por el Espíritu Santo para regir sus diócesis bajo la autoridad del Papa. (The Bishops are the successors of the Apostles, placed by the Holy Spirit to govern their dioceses under the authority of the Pope.)"

  - es: "¿Jesucristo ha fundado más de una Iglesia? (Has Jesus Christ founded more than one Church?)"
    en: "Jesucristo no ha fundado más que una sola Iglesia. (Jesus Christ has founded only one Church.)"

  - es: "¿Cómo podemos reconocer la Iglesia de Cristo? (How can we recognize the Church of Christ?)"
    en: "Podemos reconocer la Iglesia de Cristo por ciertas notas o caracteres que Cristo le confirió. (We can recognize the Church of Christ by certain marks or characteristics that Christ gave her.)"

  - es: "¿Cuáles son las notas o caracteres que Cristo confirió a su Iglesia? (What are the marks that Christ gave His Church?)"
    en: "Las notas o caracteres que Cristo confirió a su Iglesia son cuatro: unidad, santidad, catolicidad y apostolicidad. (The marks that Christ gave His Church are four: unity, holiness, catholicity, and apostolicity.)"

  - es: "¿Cuál es la verdadera Iglesia fundada por Cristo? (Which is the true Church founded by Christ?)"
    en: "La verdadera Iglesia fundada por Cristo es únicamente la Iglesia Romana, porque sólo ella es Una, Santa, Católica y Apostólica. (The true Church founded by Christ is only the Roman Church, because she alone is One, Holy, Catholic, and Apostolic.)"

  - es: "¿Qué quiere decir «comunión de los santos»? (What does \"communion of saints\" mean?)"
    en: "«Comunión de los santos» quiere decir que todos los miembros de la Iglesia están unidos con Jesucristo y entre sí formando un cuerpo, y participan de los mismos bienes espirituales. (\"Communion of saints\" means that all the members of the Church are united with Jesus Christ and with one another, forming one body, and share in the same spiritual goods.)"

  - es: "¿Cuáles son los miembros de la Iglesia? (Who are the members of the Church?)"
    en: "Los miembros de la Iglesia son los santos del cielo, las almas del purgatorio y los fieles de la tierra. (The members of the Church are the saints in heaven, the souls in purgatory, and the faithful on earth.)"

  - es: "¿De qué bienes espirituales participan los miembros de la Iglesia? (In what spiritual goods do the members of the Church share?)"
    en: "Los miembros de la Iglesia participan de los méritos de Jesucristo, de la Santísima Virgen y de los Santos; del sacrificio de la Misa; de los sacramentos, y de las oraciones y buenas obras de los fieles. (The members of the Church share in the merits of Jesus Christ, of the Most Holy Virgin, and of the Saints; in the sacrifice of the Mass; in the sacraments; and in the prayers and good works of the faithful.)"

  - es: "¿Tiene la Iglesia poder para perdonar los pecados? (Does the Church have the power to forgive sins?)"
    en: "La Iglesia tiene poder, recibido de Jesucristo, para perdonar todos los pecados de los hombres, por muchos y graves que sean. (The Church has the power, received from Jesus Christ, to forgive all the sins of men, however many and grave they may be.)"

  - es: "¿Quiénes tienen poder en la Iglesia para perdonar los pecados? (Who has the power in the Church to forgive sins?)"
    en: "Tienen poder en la Iglesia para perdonar los pecados el Papa, los Obispos y los sacerdotes que están debidamente autorizados. (The power in the Church to forgive sins belongs to the Pope, the Bishops, and duly authorized priests.)"

  - es: "¿Cómo perdona la Iglesia los pecados? (How does the Church forgive sins?)"
    en: "La Iglesia perdona los pecados en nombre de Jesucristo, principalmente por los sacramentos del Bautismo y de la Penitencia. (The Church forgives sins in the name of Jesus Christ, principally through the sacraments of Baptism and Penance.)"

  - es: "¿Qué quiere decir «la resurrección de los muertos»? (What does \"the resurrection of the dead\" mean?)"
    en: "«La resurrección de los muertos» quiere decir que, como Cristo resucitó, así también nosotros resucitaremos al fin del mundo, volviendo a unirse nuestras almas con nuestros mismos cuerpos, para nunca más morir. (It means that, just as Christ rose, so too we will rise at the end of the world, our souls reuniting with our own bodies, never to die again.)"

  - es: "¿Qué significa «la vida eterna»? (What does \"life everlasting\" mean?)"
    en: "«La vida eterna» significa que después de la vida presente hay otra vida que no tiene fin. (It means that after this present life there is another life that has no end.)"

  - es: "¿Qué será de nuestra alma después de la muerte? (What will become of our soul after death?)"
    en: "Nuestra alma después de la muerte será juzgada por Dios para recibir premio o castigo según sus obras. (After death our soul will be judged by God to receive reward or punishment according to its deeds.)"

  - es: "¿Cómo premia Dios a los buenos y castiga a los malos? (How does God reward the good and punish the wicked?)"
    en: "Dios premia a los buenos dándoles el cielo, y castiga a los malos en el infierno. (God rewards the good by giving them heaven, and punishes the wicked in hell.)"

  - es: "¿Qué es el cielo? (What is heaven?)"
    en: "El cielo es el lugar donde los buenos viven con Dios eternamente felices. (Heaven is the place where the good live with God, eternally happy.)"

  - es: "¿Quiénes van al cielo? (Who goes to heaven?)"
    en: "Van al cielo los que mueren en gracia de Dios. (Those who die in the grace of God go to heaven.)"

  - es: "¿Qué es el purgatorio? (What is purgatory?)"
    en: "El purgatorio es el lugar de sufrimiento donde se purifican, antes de entrar en el cielo, los que mueren en gracia de Dios sin haber satisfecho por sus pecados. (Purgatory is the place of suffering where those who die in God's grace, but without having atoned for their sins, are purified before entering heaven.)"

  - es: "¿Qué es el infierno? (What is hell?)"
    en: "El infierno es el lugar donde los malos, apartados de Dios, sufren penas eternas. (Hell is the place where the wicked, cut off from God, suffer eternal punishment.)"

  - es: "¿Quiénes van al infierno? (Who goes to hell?)"
    en: "Van al infierno los que mueren en pecado mortal. (Those who die in mortal sin go to hell.)"

  - es: "¿Qué mandamientos debe cumplir el cristiano? (What commandments must a Christian fulfill?)"
    en: "El cristiano debe cumplir los mandamientos de la Ley de Dios y de la santa Madre Iglesia. (A Christian must fulfill the commandments of the Law of God and of holy Mother Church.)"

  - es: "¿Qué es la Ley de Dios? (What is the Law of God?)"
    en: "La Ley de Dios es lo que Dios manda al hombre para que lo cumpla. (The Law of God is what God commands man to fulfill.)"

  - es: "¿Quién es nuestro modelo en el cumplimiento de la Ley de Dios? (Who is our model in fulfilling the Law of God?)"
    en: "Nuestro modelo en el cumplimiento de la Ley de Dios es Jesucristo, que vino al mundo para hacer siempre la voluntad del Padre celestial. (Our model in fulfilling the Law of God is Jesus Christ, who came into the world to always do the will of the heavenly Father.)"

  - es: "¿Cuál es el primer mandamiento de la Ley de Dios? (What is the first commandment of the Law of God?)"
    en: "El primer mandamiento de la Ley de Dios es: amarás a Dios sobre todas las cosas. (The first commandment of the Law of God is: you shall love God above all things.)"

  - es: "¿Qué deberes comprende el primer mandamiento de la Ley de Dios? (What duties does the first commandment include?)"
    en: "El primer mandamiento de la Ley de Dios comprende los deberes de creer en Dios, esperar en Él, amarle sobre todas las cosas, y tributarle el honor debido. (The first commandment includes the duties of believing in God, hoping in Him, loving Him above all things, and giving Him the honor due to Him.)"

  - es: "¿Quién ama a Dios sobre todas las cosas? (Who loves God above all things?)"
    en: "Ama a Dios sobre todas las cosas el que cumple todos sus mandamientos. (He who keeps all His commandments loves God above all things.)"

  - es: "¿Quién tributa a Dios el honor debido? (Who gives God the honor due to Him?)"
    en: "Tributa a Dios el honor debido el que le reconoce como único y verdadero Dios, y le adora con suma reverencia de alma y cuerpo. (He who acknowledges God as the one true God, and adores Him with the utmost reverence of soul and body, gives Him the honor due to Him.)"

  - es: "¿Qué honor debemos tributar a Jesucristo? (What honor must we give to Jesus Christ?)"
    en: "A Jesucristo debemos tributar honor y culto de adoración, por ser el Hijo de Dios hecho hombre. (We must give Jesus Christ honor and worship of adoration, since He is the Son of God made man.)"

  - es: "¿Qué honor debemos tributar a la Virgen María? (What honor must we give to the Virgin Mary?)"
    en: "A la Virgen María debemos tributar honor y culto de veneración especialísima, por ser la Madre de Dios. (We must give the Virgin Mary honor and worship of especially high veneration, since she is the Mother of God.)"

  - es: "¿A quiénes más debemos tributar culto? (Whom else must we venerate?)"
    en: "Debemos también tributar culto de veneración a los Ángeles y a los Santos, porque ya viven con Dios eternamente felices en el cielo. (We must also give worship of veneration to the Angels and the Saints, because they already live eternally happy with God in heaven.)"

  - es: "¿Cuál es el segundo mandamiento de la Ley de Dios? (What is the second commandment of the Law of God?)"
    en: "El segundo mandamiento de la Ley de Dios es: no tomarás el nombre de Dios en vano. (The second commandment of the Law of God is: you shall not take the name of God in vain.)"

  - es: "¿Quién toma el nombre de Dios en vano? (Who takes the name of God in vain?)"
    en: "Toma el nombre de Dios en vano quien blasfema o lo usa sin el debido respeto. (He who blasphemes or uses it without due respect takes the name of God in vain.)"

  - es: "¿Qué es blasfemar? (What is blasphemy?)"
    en: "Blasfemar es decir palabras o hacer gestos injuriosos contra Dios, la Virgen, los Santos y la Iglesia. (Blasphemy is to say words or make gestures insulting to God, the Virgin, the Saints, or the Church.)"

  - es: "¿Quién usa el nombre de Dios sin el debido respeto? (Who uses the name of God without due respect?)"
    en: "Usa el nombre de Dios sin el debido respeto quien jura sin verdad, sin justicia o sin necesidad, y quien no cumple sus votos. (He who swears without truth, without justice, or without necessity, and he who does not fulfill his vows, uses the name of God without due respect.)"

  - es: "¿Qué es jurar? (What is to swear an oath?)"
    en: "Jurar es poner a Dios por testigo de lo que decimos o prometemos. (To swear an oath is to call God as witness to what we say or promise.)"

  - es: "¿Qué es voto? (What is a vow?)"
    en: "Voto es la promesa hecha a Dios de una cosa buena que no impide otra mejor, con intención de obligarse. (A vow is a promise made to God of some good thing that does not prevent a better one, made with the intention of binding oneself to it.)"

