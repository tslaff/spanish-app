id: catecismo_06
name: Catecismo 06
sentences:
- es: ¿Quiénes fueron nuestros primeros padres? (Who were our first parents?)
  en: Nuestros primeros padres fueron Adán y Eva, y de ellos descendemos todos los hombres. (Our first parents were Adam and
    Eve, and all mankind descends from them.)
- es: ¿Dónde colocó Dios a nuestros primeros padres? (Where did God place our first parents?)
  en: Dios colocó a nuestros primeros padres en un lugar delicioso, llamado paraíso terrenal. (God placed our first parents
    in a delightful place called the earthly paradise.)
- es: ¿Qué dones concedió el Señor a nuestros primeros padres? (What gifts did the Lord grant our first parents?)
  en: El Señor concedió a nuestros primeros padres el don divino de la gracia, el conocimiento de las cosas convenientes a
    su estado, y otros dones que los libraban de la inclinación al pecado, del dolor y de la muerte. (The Lord granted our
    first parents the divine gift of grace, knowledge suited to their state, and other gifts that freed them from the inclination
    to sin, from suffering, and from death.)
- es: ¿Cómo concedió el Señor estos dones a nuestros primeros padres? (For whom did the Lord grant these gifts to our first
    parents?)
  en: El Señor concedió estos dones a nuestros primeros padres para sí y para todos sus descendientes. (The Lord granted these
    gifts to our first parents for themselves and for all their descendants.)
- es: ¿Qué precepto impuso Dios a nuestros primeros padres? (What precept did God impose on our first parents?)
  en: Dios impuso a nuestros primeros padres el precepto de no comer del árbol de la ciencia del bien y del mal. (God imposed
    on our first parents the precept not to eat from the tree of the knowledge of good and evil.)
- es: ¿Obedecieron nuestros primeros padres el precepto de Dios? (Did our first parents obey God's precept?)
  en: Nuestros primeros padres no obedecieron el precepto de Dios, pues Eva, engañada por el demonio, comió el fruto prohibido
    y dio de comer a Adán. (Our first parents did not obey God's precept, for Eve, deceived by the devil, ate the forbidden
    fruit and gave it to Adam to eat.)
- es: ¿Fueron castigados nuestros primeros padres por esta desobediencia? (Were our first parents punished for this disobedience?)
  en: 'Nuestros primeros padres fueron castigados por esta desobediencia, y perdieron el don de la gracia; fueron echados
    del paraíso, y quedaron sometidos a la lucha con las pasiones, al dolor y a la muerte. (Our first parents were punished
    for this disobedience: they lost the gift of grace, were cast out of paradise, and were subjected to the struggle with
    the passions, to suffering, and to death.)'
- es: ¿A quiénes más perjudicó el pecado de nuestros primeros padres? (Whom else did the sin of our first parents harm?)
  en: El pecado de nuestros primeros padres perjudicó también a todos sus descendientes, que quedaron privados de la gracia
    y de los demás dones. (The sin of our first parents also harmed all their descendants, who were left deprived of grace
    and the other gifts.)
- es: ¿Qué es el pecado original? (What is original sin?)
  en: El pecado original es aquel con que todos nacemos, heredado de nuestros primeros padres. (Original sin is that with
    which we are all born, inherited from our first parents.)
- es: ¿Heredó también la Santísima Virgen el pecado original? (Did the Most Holy Virgin also inherit original sin?)
  en: La Santísima Virgen no heredó el pecado original, sino que, por singular privilegio, por los méritos de Jesucristo,
    fue inmaculada desde el primer instante de su concepción. (The Most Holy Virgin did not inherit original sin; rather,
    by a singular privilege, through the merits of Jesus Christ, she was immaculate from the first instant of her conception.)
