id: catecismo_10
name: Catecismo 10
sentences:
- es: ¿Cómo podemos reconocer la Iglesia de Cristo? (How can we recognize the Church of Christ?)
  en: Podemos reconocer la Iglesia de Cristo por ciertas notas o caracteres que Cristo le confirió. (We can recognize the
    Church of Christ by certain marks or characteristics that Christ gave her.)
- es: ¿Cuáles son las notas o caracteres que Cristo confirió a su Iglesia? (What are the marks that Christ gave His Church?)
  en: 'Las notas o caracteres que Cristo confirió a su Iglesia son cuatro: unidad, santidad, catolicidad y apostolicidad.
    (The marks that Christ gave His Church are four: unity, holiness, catholicity, and apostolicity.)'
- es: ¿Cuál es la verdadera Iglesia fundada por Cristo? (Which is the true Church founded by Christ?)
  en: La verdadera Iglesia fundada por Cristo es únicamente la Iglesia Romana, porque sólo ella es Una, Santa, Católica y
    Apostólica. (The true Church founded by Christ is only the Roman Church, because she alone is One, Holy, Catholic, and
    Apostolic.)
- es: ¿Qué quiere decir «comunión de los santos»? (What does "communion of saints" mean?)
  en: «Comunión de los santos» quiere decir que todos los miembros de la Iglesia están unidos con Jesucristo y entre sí formando
    un cuerpo, y participan de los mismos bienes espirituales. ("Communion of saints" means that all the members of the Church
    are united with Jesus Christ and with one another, forming one body, and share in the same spiritual goods.)
- es: ¿Cuáles son los miembros de la Iglesia? (Who are the members of the Church?)
  en: Los miembros de la Iglesia son los santos del cielo, las almas del purgatorio y los fieles de la tierra. (The members
    of the Church are the saints in heaven, the souls in purgatory, and the faithful on earth.)
- es: ¿De qué bienes espirituales participan los miembros de la Iglesia? (In what spiritual goods do the members of the Church
    share?)
  en: Los miembros de la Iglesia participan de los méritos de Jesucristo, de la Santísima Virgen y de los Santos; del sacrificio
    de la Misa; de los sacramentos, y de las oraciones y buenas obras de los fieles. (The members of the Church share in the
    merits of Jesus Christ, of the Most Holy Virgin, and of the Saints; in the sacrifice of the Mass; in the sacraments; and
    in the prayers and good works of the faithful.)
- es: ¿Tiene la Iglesia poder para perdonar los pecados? (Does the Church have the power to forgive sins?)
  en: La Iglesia tiene poder, recibido de Jesucristo, para perdonar todos los pecados de los hombres, por muchos y graves
    que sean. (The Church has the power, received from Jesus Christ, to forgive all the sins of men, however many and grave
    they may be.)
- es: ¿Quiénes tienen poder en la Iglesia para perdonar los pecados? (Who has the power in the Church to forgive sins?)
  en: Tienen poder en la Iglesia para perdonar los pecados el Papa, los Obispos y los sacerdotes que están debidamente autorizados.
    (The power in the Church to forgive sins belongs to the Pope, the Bishops, and duly authorized priests.)
- es: ¿Cómo perdona la Iglesia los pecados? (How does the Church forgive sins?)
  en: La Iglesia perdona los pecados en nombre de Jesucristo, principalmente por los sacramentos del Bautismo y de la Penitencia.
    (The Church forgives sins in the name of Jesus Christ, principally through the sacraments of Baptism and Penance.)
- es: ¿Qué quiere decir «la resurrección de los muertos»? (What does "the resurrection of the dead" mean?)
  en: «La resurrección de los muertos» quiere decir que, como Cristo resucitó, así también nosotros resucitaremos al fin del
    mundo, volviendo a unirse nuestras almas con nuestros mismos cuerpos, para nunca más morir. (It means that, just as Christ
    rose, so too we will rise at the end of the world, our souls reuniting with our own bodies, never to die again.)
