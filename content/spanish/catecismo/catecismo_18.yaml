id: catecismo_18
name: Catecismo 18
sentences:
- es: ¿Cómo peca el que no oye Misa en día de precepto? (How does one sin who does not hear Mass on a day of precept?)
  en: El que no oye Misa en día de precepto sin causa justa peca mortalmente. (One who, without just cause, does not hear
    Mass on a day of precept sins mortally.)
- es: ¿Cuál es el segundo mandamiento de la santa Madre Iglesia? (What is the second commandment of holy Mother Church?)
  en: 'El segundo mandamiento de la santa Madre Iglesia es: confesar los pecados mortales al menos una vez al año y en peligro
    de muerte y si se ha de comulgar. (The second commandment of holy Mother Church is: to confess mortal sins at least once
    a year, and in danger of death, and before receiving Communion.)'
- es: ¿A quién obliga el segundo mandamiento de la santa Madre Iglesia? (Whom does the second commandment of holy Mother Church
    bind?)
  en: El segundo mandamiento de la santa Madre Iglesia obliga a todos los cristianos que tienen uso de razón y están en pecado
    mortal. (It binds all Christians who have the use of reason and are in mortal sin.)
- es: ¿Cuál es el tercer mandamiento de la santa Madre Iglesia? (What is the third commandment of holy Mother Church?)
  en: 'El tercer mandamiento de la santa Madre Iglesia es: comulgar por Pascua florida. (The third commandment of holy Mother
    Church is: to receive Communion during the Easter season.)'
- es: ¿Cuándo estamos obligados a recibir la Comunión? (When are we obliged to receive Communion?)
  en: Estamos obligados a recibir la Comunión una vez al año, en el tiempo señalado por la Iglesia, y además en peligro de
    muerte como Viático. (We are obliged to receive Communion once a year, at the time appointed by the Church, and also in
    danger of death, as Viaticum.)
- es: ¿A quién obliga el precepto de comulgar? (Whom does the precept of receiving Communion bind?)
  en: El precepto de comulgar obliga a todos los cristianos que han llegado al uso de razón. (The precept of receiving Communion
    binds all Christians who have reached the use of reason.)
- es: ¿Cumplen el precepto de confesar y comulgar los que lo hacen sin las debidas disposiciones? (Do those who confess and
    receive Communion without the necessary dispositions fulfill the precept?)
  en: Los que confiesan y comulgan sin las debidas disposiciones no cumplen el precepto, sino que cometen un grave sacrilegio
    y tienen que volver a confesarse y comulgar. (They do not fulfill the precept, but rather commit a grave sacrilege and
    must confess and receive Communion again.)
- es: ¿Desea la Iglesia que confesemos y comulguemos con frecuencia? (Does the Church wish us to confess and receive Communion
    frequently?)
  en: La Iglesia desea que confesemos y comulguemos con frecuencia, y no debemos contentarnos con hacerlo una vez al año.
    (The Church wishes us to confess and receive Communion frequently, and we should not be content with doing so only once
    a year.)
- es: ¿Cuál es el cuarto mandamiento de la santa Madre Iglesia? (What is the fourth commandment of holy Mother Church?)
  en: 'El cuarto mandamiento de la santa Madre Iglesia es: ayunar y abstenerse de comer carne cuando lo manda la santa Madre
    Iglesia. (The fourth commandment of holy Mother Church is: to fast and abstain from meat when holy Mother Church commands
    it.)'
- es: ¿En qué consiste la ley del ayuno? (What does the law of fasting consist of?)
  en: La ley del ayuno consiste en no hacer más de una comida al día, si bien se permite un ligero desayuno y una frugal colación.
    (It consists of not eating more than one full meal a day, though a light breakfast and a small collation are allowed.)
