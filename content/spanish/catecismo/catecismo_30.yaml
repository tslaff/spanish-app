id: catecismo_30
name: Catecismo 30
sentences:
- es: ¿Qué pecado comete el que comulga en pecado mortal? (What sin does one commit who receives Communion in mortal sin?)
  en: El que comulga en pecado mortal comete un horrible sacrilegio. (One who receives Communion in mortal sin commits a horrible
    sacrilege.)
- es: ¿Qué es la Extremaunción? (What is Extreme Unction?)
  en: La Extremaunción es el sacramento que alivia el alma y el cuerpo del cristiano gravemente enfermo. (Extreme Unction
    is the sacrament that comforts the soul and body of a Christian who is gravely ill.)
- es: ¿Cuáles son los efectos de la Extremaunción? (What are the effects of Extreme Unction?)
  en: La Extremaunción aumenta la gracia santificante; perdona los pecados veniales y aun los mortales, si el enfermo está
    arrepentido y no ha podido confesarse; le da fuerzas para resistir las tentaciones y soportar los sufrimientos de la enfermedad;
    y le concede la salud del cuerpo si le conviene. (It increases sanctifying grace; forgives venial sins and even mortal
    sins, if the sick person is repentant and has been unable to confess; gives strength to resist temptation and bear the
    sufferings of illness; and grants bodily health if it is beneficial.)
- es: ¿Quién debe recibir la Extremaunción? (Who should receive Extreme Unction?)
  en: Debe recibir la Extremaunción todo cristiano, llegado al uso de razón, que se halle en peligro de muerte por enfermedad.
    (Every Christian who has reached the use of reason and is in danger of death from illness should receive it.)
- es: ¿Qué obligación tienen los familiares y los que asisten al enfermo? (What obligation do family members and caregivers
    of the sick have?)
  en: Los familiares y los que asisten al enfermo tienen obligación grave de procurar que el enfermo reciba la Extremaunción,
    y si es posible antes de que pierda el conocimiento. (They have a grave obligation to see that the sick person receives
    Extreme Unction, if possible before losing consciousness.)
- es: ¿Qué es el Orden sacerdotal? (What is Holy Orders?)
  en: El Orden sacerdotal es el sacramento que hace a algunos cristianos ministros de Dios. (Holy Orders is the sacrament
    that makes certain Christians ministers of God.)
- es: ¿Cuáles son las principales funciones sagradas del sacerdote? (What are the main sacred functions of the priest?)
  en: 'Las principales funciones sagradas del sacerdote son: celebrar la santa Misa, administrar los sacramentos, y predicar
    la palabra de Dios. (To celebrate holy Mass, to administer the sacraments, and to preach the word of God.)'
- es: ¿Es muy grande la dignidad del sacerdote? (Is the dignity of the priest very great?)
  en: La dignidad del sacerdote es la mayor que hay en la tierra, porque es el mediador entre Dios y los hombres. (The dignity
    of the priest is the greatest that exists on earth, because he is the mediator between God and men.)
- es: ¿Qué es el Matrimonio? (What is Matrimony?)
  en: El Matrimonio es el sacramento que santifica la unión del hombre y la mujer, y les da la gracia para que vivan en paz
    y críen hijos para el cielo. (Matrimony is the sacrament that sanctifies the union of man and woman, and gives them grace
    to live in peace and raise children for heaven.)
- es: ¿Qué deben hacer los esposos cristianos para vivir santamente? (What should Christian spouses do in order to live holy
    lives?)
  en: Para vivir santamente los esposos cristianos deben amarse y guardarse fidelidad, recibir los hijos que Dios les dé y
    educarlos cristianamente. (They should love one another and keep faith with each other, welcome the children God gives
    them, and raise them in a Christian manner.)
