id: catecismo_lecciones_36_42
name: "Catecismo - Lecciones 36-42"

sentences:
  - es: "¿Cuántas son las virtudes cardinales? (How many cardinal virtues are there?)"
    en: "Las virtudes cardinales son cuatro: prudencia, justicia, fortaleza y templanza. (There are four cardinal virtues: prudence, justice, fortitude, and temperance.)"

  - es: "¿Por qué se llaman cardinales? (Why are they called cardinal?)"
    en: "Se llaman cardinales porque todas las demás virtudes se fundan y se integran en ellas. (They are called cardinal because all the other virtues are grounded in and built upon them.)"

  - es: "¿Qué es la virtud de la religión? (What is the virtue of religion?)"
    en: "La virtud de la religión es la que nos mueve a dar el culto debido a Dios por ser nuestro Creador y Señor. (The virtue of religion is that which moves us to give God the worship due to Him as our Creator and Lord.)"

  - es: "¿Cuáles son los principales actos del culto debido a Dios? (What are the principal acts of the worship due to God?)"
    en: "Los principales actos del culto debido a Dios son: la adoración, la oración y el sacrificio, practicados privada y públicamente. (The principal acts of the worship due to God are: adoration, prayer, and sacrifice, practiced both privately and publicly.)"

  - es: "¿Cuáles son los principales pecados contra la religión? (What are the main sins against religion?)"
    en: "Los principales pecados contra la religión son: la idolatría, el sacrilegio y la superstición. (The main sins against religion are: idolatry, sacrilege, and superstition.)"

  - es: "¿Es pecado no tener ninguna religión? (Is it a sin to have no religion at all?)"
    en: "No tener ninguna religión es pecado gravísimo, porque es despreciar a Dios. (To have no religion at all is a most grave sin, because it is to despise God.)"

  - es: "¿Qué son los dones del Espíritu Santo? (What are the gifts of the Holy Spirit?)"
    en: "Los dones del Espíritu Santo son perfecciones sobrenaturales, que Dios nos concede para obedecer dócilmente sus inspiraciones, y facilitarnos el ejercicio de las virtudes. (The gifts of the Holy Spirit are supernatural perfections that God grants us so that we may docilely obey His inspirations, and which make the practice of the virtues easier for us.)"

  - es: "¿Cuáles son los dones del Espíritu Santo? (What are the gifts of the Holy Spirit?)"
    en: "Los dones del Espíritu Santo son siete: sabiduría, entendimiento, consejo, fortaleza, ciencia, piedad y temor de Dios. (The gifts of the Holy Spirit are seven: wisdom, understanding, counsel, fortitude, knowledge, piety, and fear of the Lord.)"

  - es: "¿A quiénes llama Jesucristo bienaventurados? (Whom does Jesus Christ call blessed?)"
    en: "Jesucristo llama bienaventurados a los cristianos que le imitan en el desprendimiento de los bienes de este mundo y en la estima de los bienes espirituales. (Jesus Christ calls blessed those Christians who imitate Him in detachment from the goods of this world and in esteem for spiritual goods.)"

  - es: "¿Cuántas son las bienaventuranzas? (How many beatitudes are there?)"
    en: "Las bienaventuranzas son ocho: los pobres de espíritu, los mansos, los que lloran, los que tienen hambre y sed de justicia, los misericordiosos, los limpios de corazón, los pacíficos, y los que padecen persecución a causa de la justicia. (There are eight beatitudes: the poor in spirit, the meek, those who mourn, those who hunger and thirst for justice, the merciful, the pure of heart, the peacemakers, and those who suffer persecution for the sake of justice.)"

  - es: "¿Qué es pecado? (What is sin?)"
    en: "Pecado es toda acción u omisión voluntaria contra la Ley de Dios. (Sin is any voluntary act or omission contrary to the Law of God.)"

  - es: "¿De qué maneras se comete el pecado? (In what ways is sin committed?)"
    en: "El pecado se comete por pensamiento, deseo, palabra, obra y omisión. (Sin is committed by thought, desire, word, deed, and omission.)"

  - es: "¿Cómo puede ser el pecado? (How can sin be?)"
    en: "El pecado puede ser mortal y venial. (Sin can be mortal or venial.)"

  - es: "¿Qué es pecado mortal? (What is mortal sin?)"
    en: "Pecado mortal es una desobediencia voluntaria a la Ley de Dios en materia grave, con plena advertencia y perfecto consentimiento. (Mortal sin is a voluntary disobedience to the Law of God in a grave matter, with full knowledge and complete consent.)"

  - es: "¿Por qué se llama pecado mortal? (Why is it called mortal sin?)"
    en: "Se llama pecado mortal porque priva al alma de la vida de la gracia y la hace merecedora de las penas del infierno. (It is called mortal sin because it deprives the soul of the life of grace and makes it deserving of the punishments of hell.)"

  - es: "¿Qué es pecado venial? (What is venial sin?)"
    en: "Pecado venial es una desobediencia voluntaria a la Ley de Dios en materia leve, o en materia grave sin plena advertencia o sin perfecto consentimiento. (Venial sin is a voluntary disobedience to the Law of God in a slight matter, or in a grave matter without full knowledge or without complete consent.)"

  - es: "¿Qué males nos causa el pecado venial? (What harm does venial sin cause us?)"
    en: "El pecado venial disminuye el fervor de la caridad, nos va disponiendo para el pecado mortal, y nos hace merecedores de las penas del purgatorio. (Venial sin diminishes the fervor of charity, disposes us toward mortal sin, and makes us deserving of the punishments of purgatory.)"

  - es: "¿Cuántos son los pecados capitales? (How many capital sins are there?)"
    en: "Los pecados capitales son siete: soberbia, avaricia, lujuria, ira, gula, envidia y pereza. (There are seven capital sins: pride, avarice, lust, wrath, gluttony, envy, and sloth.)"

  - es: "¿Qué virtudes hay contra estos siete vicios o pecados capitales? (What virtues oppose these seven capital sins?)"
    en: "Contra la soberbia, humildad; contra la avaricia, generosidad; contra la lujuria, castidad; contra la ira, paciencia; contra la gula, templanza; contra la envidia, caridad; y contra la pereza, diligencia. (Against pride, humility; against avarice, generosity; against lust, chastity; against wrath, patience; against gluttony, temperance; against envy, charity; and against sloth, diligence.)"

  - es: "¿Cuántos son los enemigos del alma? (How many enemies does the soul have?)"
    en: "Los enemigos del alma son tres: el mundo, el demonio y la carne. (The soul has three enemies: the world, the devil, and the flesh.)"

  - es: "¿Por qué el mundo, el demonio y la carne son enemigos del alma? (Why are the world, the devil, and the flesh enemies of the soul?)"
    en: "El mundo, el demonio y la carne son enemigos del alma porque con sus tentaciones nos inducen al pecado. (Because through their temptations they lead us into sin.)"

  - es: "¿Podemos con nuestras propias fuerzas cumplir todos los mandamientos y ganar el cielo? (Can we, by our own strength alone, keep all the commandments and gain heaven?)"
    en: "Sólo con nuestras fuerzas no podemos cumplir los mandamientos ni ganar el cielo, porque necesitamos el auxilio de la gracia. (By our own strength alone we cannot keep the commandments or gain heaven, because we need the help of grace.)"

  - es: "¿Qué es la gracia? (What is grace?)"
    en: "La gracia es un don sobrenatural que Dios nos concede para alcanzar la vida eterna. (Grace is a supernatural gift that God grants us to attain eternal life.)"

  - es: "¿Cuántas clases hay de gracia? (How many kinds of grace are there?)"
    en: "Hay dos clases de gracia: la gracia santificante y la gracia actual. (There are two kinds of grace: sanctifying grace and actual grace.)"

  - es: "¿A qué llamamos gracia santificante? (What do we call sanctifying grace?)"
    en: "Llamamos gracia santificante a la que nos hace hijos de Dios y herederos del cielo. (We call sanctifying grace that which makes us children of God and heirs of heaven.)"

  - es: "¿Qué es gracia actual? (What is actual grace?)"
    en: "Gracia actual es un auxilio de Dios que ilumina nuestro entendimiento o mueve nuestra voluntad para obrar el bien y evitar el mal. (Actual grace is a help from God that enlightens our mind or moves our will to do good and avoid evil.)"

  - es: "¿Cuáles son los medios principales para alcanzar la gracia? (What are the main means of obtaining grace?)"
    en: "Los medios principales para alcanzar la gracia son: la oración y los sacramentos. (The main means of obtaining grace are prayer and the sacraments.)"

  - es: "¿Qué es orar? (What is to pray?)"
    en: "Orar es hablar con Dios, nuestro Padre celestial, para alabarle, darle gracias y pedirle toda clase de bienes. (To pray is to speak with God, our heavenly Father, to praise Him, thank Him, and ask Him for every kind of blessing.)"

  - es: "¿Tenemos obligación de orar? (Are we obliged to pray?)"
    en: "Tenemos obligación de orar porque Jesucristo nos lo manda y porque es el medio ordinario para alcanzar la gracia y los beneficios de Dios. (We are obliged to pray because Jesus Christ commands it, and because it is the ordinary means of obtaining God's grace and blessings.)"

  - es: "¿Cómo hemos de orar? (How should we pray?)"
    en: "Hemos de orar con atención, humildad, confianza y perseverancia. (We should pray with attention, humility, trust, and perseverance.)"

  - es: "¿Oye siempre Dios nuestras oraciones? (Does God always hear our prayers?)"
    en: "Dios oye siempre nuestras oraciones y nos concede lo que es más conveniente para nuestra salvación. (God always hears our prayers, and grants us whatever is most fitting for our salvation.)"

  - es: "¿Cuál es la oración más excelente? (What is the most excellent prayer?)"
    en: "La oración más excelente es el Padrenuestro, que enseñó Jesucristo a los Apóstoles. (The most excellent prayer is the Our Father, which Jesus Christ taught the Apostles.)"

  - es: "¿Cuáles son las principales oraciones a la Santísima Virgen? (What are the main prayers to the Most Holy Virgin?)"
    en: "Las principales oraciones a la Santísima Virgen son: el Avemaría y la Salve. (The main prayers to the Most Holy Virgin are the Hail Mary and the Salve (Hail Holy Queen).)"

  - es: "¿Es conveniente también hacer oración a los Ángeles y a los Santos? (Is it also fitting to pray to the Angels and Saints?)"
    en: "Es conveniente también hacer oración a los Ángeles y a los Santos para que intercedan por nosotros delante de Dios. (It is also fitting to pray to the Angels and Saints, so that they may intercede for us before God.)"

  - es: "¿Qué es sacramento? (What is a sacrament?)"
    en: "Sacramento es una acción exterior que significa y da la gracia. (A sacrament is an outward action that signifies and confers grace.)"

  - es: "¿Quién instituyó los sacramentos? (Who instituted the sacraments?)"
    en: "Los sacramentos los instituyó Jesucristo. (Jesus Christ instituted the sacraments.)"

  - es: "¿Cuántos son los sacramentos? (How many sacraments are there?)"
    en: "Los sacramentos son siete: Bautismo, Confirmación, Penitencia, Eucaristía, Extremaunción, Orden sacerdotal y Matrimonio. (There are seven sacraments: Baptism, Confirmation, Penance, Eucharist, Extreme Unction, Holy Orders, and Matrimony.)"

  - es: "¿Los sacramentos dan siempre la gracia? (Do the sacraments always confer grace?)"
    en: "Los sacramentos dan siempre la gracia si se reciben con las disposiciones necesarias. (The sacraments always confer grace if they are received with the necessary dispositions.)"

  - es: "¿Qué pecado comete el que recibe un sacramento sin las disposiciones necesarias? (What sin does one commit who receives a sacrament without the necessary dispositions?)"
    en: "El que recibe un sacramento sin las disposiciones necesarias comete un pecado mortal de sacrilegio. (One who receives a sacrament without the necessary dispositions commits a mortal sin of sacrilege.)"

  - es: "¿Qué sacramentos se reciben una sola vez? (Which sacraments are received only once?)"
    en: "Se reciben una sola vez el Bautismo, la Confirmación y el Orden sacerdotal, porque imprimen en el alma una señal imborrable que se llama carácter sacramental. (Baptism, Confirmation, and Holy Orders are received only once, because they imprint on the soul an indelible mark called the sacramental character.)"

