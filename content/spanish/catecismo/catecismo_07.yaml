id: catecismo_07
name: Catecismo 07
sentences:
- es: ¿Cómo se quita el pecado original? (How is original sin removed?)
  en: El pecado original se quita por el Bautismo. (Original sin is removed through Baptism.)
- es: ¿Cuál de las tres Personas de la Santísima Trinidad se hizo hombre? (Which of the three Persons of the Most Holy Trinity
    became man?)
  en: Se hizo hombre la segunda Persona de la Santísima Trinidad, que es el Hijo. (The second Person of the Most Holy Trinity,
    who is the Son, became man.)
- es: ¿Para qué se hizo hombre el Hijo de Dios? (Why did the Son of God become man?)
  en: El Hijo de Dios se hizo hombre para salvarnos y darnos ejemplo de vida. (The Son of God became man to save us and to
    give us an example of life.)
- es: ¿Quién es Jesucristo? (Who is Jesus Christ?)
  en: Jesucristo es el Hijo de Dios hecho hombre, que nació de la Virgen María. (Jesus Christ is the Son of God made man,
    who was born of the Virgin Mary.)
- es: ¿Quién es la Virgen María? (Who is the Virgin Mary?)
  en: La Virgen María es la Señora llena de gracia y virtudes, concebida sin pecado, que es Madre de Dios y Madre nuestra
    y está en el cielo. (The Virgin Mary is the Lady full of grace and virtues, conceived without sin, who is Mother of God
    and our Mother, and is in heaven.)
- es: ¿Cómo se realizó la Encarnación del Hijo de Dios? (How was the Incarnation of the Son of God accomplished?)
  en: La Encarnación del Hijo de Dios se realizó formando el Espíritu Santo de las purísimas entrañas de la Virgen María un
    cuerpo perfectísimo y creando un alma nobilísima que unió a aquel cuerpo; en el mismo instante a este cuerpo y alma se
    unió el Hijo de Dios; y de esta suerte el que antes era sólo Dios, sin dejar de serlo, quedó hecho hombre. (The Incarnation
    of the Son of God was accomplished when the Holy Spirit formed, from the most pure womb of the Virgin Mary, a most perfect
    body and created a most noble soul, which He united to that body; in that same instant the Son of God united Himself to
    this body and soul; and thus He who before was only God, without ceasing to be so, became man.)
- es: ¿Por qué decimos que la Virgen María es Madre de Dios? (Why do we say the Virgin Mary is Mother of God?)
  en: Decimos que la Virgen María es Madre de Dios, porque de Ella nació Jesucristo, que es verdadero Dios y verdadero hombre.
    (We say the Virgin Mary is Mother of God because Jesus Christ, true God and true man, was born of her.)
- es: ¿Cuántas naturalezas hay en Jesucristo? (How many natures are there in Jesus Christ?)
  en: 'En Jesucristo hay dos naturalezas, una divina porque es Dios y otra humana porque es hombre. (In Jesus Christ there
    are two natures: one divine, because He is God, and one human, because He is man.)'
- es: ¿Cuántas personas hay en Jesucristo? (How many persons are there in Jesus Christ?)
  en: En Jesucristo hay una sola persona, que es divina, y es la segunda de la Santísima Trinidad. (In Jesus Christ there
    is only one person, who is divine, the second Person of the Most Holy Trinity.)
- es: ¿Cómo nos salvó Jesucristo? (How did Jesus Christ save us?)
  en: Jesucristo nos salvó padeciendo y muriendo en la Cruz. (Jesus Christ saved us by suffering and dying on the Cross.)
