id: catecismo_08
name: Catecismo 08
sentences:
- es: ¿Para qué quiso Jesucristo padecer y morir en la Cruz? (Why did Jesus Christ wish to suffer and die on the Cross?)
  en: Jesucristo quiso padecer y morir en la Cruz para redimirnos del pecado y librarnos de la muerte eterna. (Jesus Christ
    wished to suffer and die on the Cross to redeem us from sin and free us from eternal death.)
- es: ¿Cómo nos redimió Jesucristo? (How did Jesus Christ redeem us?)
  en: Jesucristo nos redimió ofreciendo el sacrificio de su vida en la Cruz, para obtener el perdón de nuestros pecados y
    devolvernos la gracia y amistad de Dios. (Jesus Christ redeemed us by offering the sacrifice of His life on the Cross,
    to obtain forgiveness for our sins and restore to us the grace and friendship of God.)
- es: ¿Qué quiere decir «descendió a los infiernos»? (What does "he descended into hell" mean?)
  en: «Descendió a los infiernos» quiere decir que, después de la muerte del Señor, su alma, unida a la divinidad, fue al
    encuentro de las almas santas que esperaban su venida en el limbo de los justos, para anunciarles la redención y llevarlas
    al cielo. ("He descended into hell" means that, after the Lord's death, His soul, united to His divinity, went to meet
    the holy souls awaiting His coming in the limbo of the just, to announce redemption to them and lead them to heaven.)
- es: ¿Cómo resucitó Jesucristo? (How did Jesus Christ rise from the dead?)
  en: Jesucristo resucitó uniendo de nuevo su alma al cuerpo, y saliendo vivo y glorioso del sepulcro para nunca más morir.
    (Jesus Christ rose by reuniting His soul to His body, coming forth alive and glorious from the tomb, never to die again.)
- es: ¿A quiénes se apareció Jesucristo después de resucitado? (To whom did Jesus Christ appear after rising?)
  en: Jesucristo, después de resucitado, se apareció a su Madre Santísima, a las santas mujeres, a los Apóstoles y a muchos
    discípulos. (After rising, Jesus Christ appeared to His Most Holy Mother, to the holy women, to the Apostles, and to many
    disciples.)
- es: ¿Dónde está Jesucristo? (Where is Jesus Christ?)
  en: Jesucristo, después de su muerte, resucitó y está en el cielo y en el Santísimo Sacramento del Altar. (After His death,
    Jesus Christ rose again and is in heaven and in the Most Blessed Sacrament of the Altar.)
- es: ¿Cuándo subió Jesucristo a los cielos? (When did Jesus Christ ascend into heaven?)
  en: Jesucristo subió a los cielos por su propio poder a los cuarenta días después de resucitado, en presencia de sus discípulos.
    (Jesus Christ ascended into heaven by His own power forty days after rising, in the presence of His disciples.)
- es: ¿Qué entendemos al decir que Jesucristo está sentado a la diestra de Dios Padre? (What do we understand by saying Jesus
    Christ is seated at the right hand of God the Father?)
  en: Al decir que Jesucristo está sentado a la diestra de Dios Padre, entendemos que Jesucristo en cuanto Dios tiene igual
    poder y gloria que el Padre, y participa plenamente del mismo poder y gloria en cuanto hombre. (By this we understand
    that Jesus Christ, as God, has equal power and glory with the Father, and fully shares in that same power and glory as
    man.)
- es: ¿Cuándo ha de venir Jesucristo a juzgar a los vivos y a los muertos? (When will Jesus Christ come to judge the living
    and the dead?)
  en: Jesucristo ha de venir a juzgar a los vivos y a los muertos, con toda su gloria y majestad, al fin del mundo. (Jesus
    Christ will come to judge the living and the dead, with all His glory and majesty, at the end of the world.)
- es: ¿Qué prometió Jesucristo al subir a los cielos? (What did Jesus Christ promise when He ascended into heaven?)
  en: Jesucristo, al subir a los cielos, prometió que nos enviaría el Espíritu Santo. (When He ascended into heaven, Jesus
    Christ promised that He would send us the Holy Spirit.)
- es: ¿Quién es el Espíritu Santo? (Who is the Holy Spirit?)
  en: El Espíritu Santo es la tercera Persona de la Santísima Trinidad, que procede del Padre y del Hijo. (The Holy Spirit
    is the third Person of the Most Holy Trinity, who proceeds from the Father and the Son.)
