id: catecismo_20
name: Catecismo 20
sentences:
- es: ¿Qué deben saber los cristianos además de las verdades de fe? (What must Christians know besides the truths of faith?)
  en: Los cristianos, además de las verdades de fe, deben saber el Padrenuestro, el Avemaría, los mandamientos de la Ley de
    Dios y de la Iglesia, los sacramentos y los deberes del propio estado. (They must also know the Our Father, the Hail Mary,
    the commandments of the Law of God and of the Church, the sacraments, and the duties of their own state in life.)
- es: ¿Cuáles son los principales pecados contra la fe? (What are the main sins against faith?)
  en: 'Los principales pecados contra la fe son: la infidelidad, la apostasía y la herejía. (The main sins against faith are:
    infidelity, apostasy, and heresy.)'
- es: ¿Basta la fe para salvarnos? (Is faith enough to save us?)
  en: Para salvarnos no basta la fe, porque la fe sola sin buenas obras es una fe muerta. (Faith alone is not enough to save
    us, because faith without good works is a dead faith.)
- es: ¿Qué es esperanza? (What is hope?)
  en: Esperanza es una virtud sobrenatural por la cual confiamos que Dios nos dará la gloria mediante su gracia y nuestras
    buenas obras. (Hope is a supernatural virtue by which we trust that God will give us glory through His grace and our good
    works.)
- es: ¿Por qué debemos esperar en Dios? (Why must we hope in God?)
  en: Debemos esperar en Dios porque es Padre omnipotente, misericordioso y fidelísimo en cumplir sus promesas. (We must hope
    in God because He is an all-powerful, merciful Father, most faithful in keeping His promises.)
- es: ¿Cuáles son los principales pecados contra la esperanza? (What are the main sins against hope?)
  en: 'Los principales pecados contra la esperanza son dos: la presunción y la desesperación. (The main sins against hope
    are two: presumption and despair.)'
- es: ¿Puede el pecador tener motivos para desesperar de su salvación? (Can a sinner have reason to despair of his salvation?)
  en: El pecador nunca puede tener motivos para desesperar de su salvación, porque la misericordia de Dios es infinita y siempre
    concede la gracia del arrepentimiento a quien humilde y confiadamente se la pide. (A sinner can never have reason to despair
    of his salvation, because God's mercy is infinite and always grants the grace of repentance to whoever asks for it humbly
    and trustingly.)
- es: ¿Cuál es la principal virtud del cristiano? (What is the principal virtue of a Christian?)
  en: La principal virtud del cristiano es la caridad. (The principal virtue of a Christian is charity.)
- es: ¿Qué es caridad? (What is charity?)
  en: Caridad es una virtud sobrenatural por la que amamos a Dios sobre todas las cosas por ser quien es, y a nosotros y al
    prójimo por amor de Dios. (Charity is a supernatural virtue by which we love God above all things for who He is, and love
    ourselves and our neighbor for the love of God.)
- es: ¿Por qué debemos amar a Dios sobre todas las cosas? (Why must we love God above all things?)
  en: Debemos amar a Dios sobre todas las cosas porque sólo Dios es infinitamente amable y nos ha creado para el cielo. (We
    must love God above all things because only God is infinitely lovable and He has created us for heaven.)
