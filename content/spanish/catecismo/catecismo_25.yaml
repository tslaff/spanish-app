id: catecismo_25
name: Catecismo 25
sentences:
- es: ¿Cuántos son los sacramentos? (How many sacraments are there?)
  en: 'Los sacramentos son siete: Bautismo, Confirmación, Penitencia, Eucaristía, Extremaunción, Orden sacerdotal y Matrimonio.
    (There are seven sacraments: Baptism, Confirmation, Penance, Eucharist, Extreme Unction, Holy Orders, and Matrimony.)'
- es: ¿Los sacramentos dan siempre la gracia? (Do the sacraments always confer grace?)
  en: Los sacramentos dan siempre la gracia si se reciben con las disposiciones necesarias. (The sacraments always confer
    grace if they are received with the necessary dispositions.)
- es: ¿Qué pecado comete el que recibe un sacramento sin las disposiciones necesarias? (What sin does one commit who receives
    a sacrament without the necessary dispositions?)
  en: El que recibe un sacramento sin las disposiciones necesarias comete un pecado mortal de sacrilegio. (One who receives
    a sacrament without the necessary dispositions commits a mortal sin of sacrilege.)
- es: ¿Qué sacramentos se reciben una sola vez? (Which sacraments are received only once?)
  en: Se reciben una sola vez el Bautismo, la Confirmación y el Orden sacerdotal, porque imprimen en el alma una señal imborrable
    que se llama carácter sacramental. (Baptism, Confirmation, and Holy Orders are received only once, because they imprint
    on the soul an indelible mark called the sacramental character.)
- es: ¿Qué es el Bautismo? (What is Baptism?)
  en: El Bautismo es el sacramento que nos quita el pecado original y nos hace cristianos. (Baptism is the sacrament that
    takes away original sin and makes us Christians.)
- es: ¿Qué efectos produce el Bautismo? (What effects does Baptism produce?)
  en: El Bautismo da la gracia santificante; perdona todos los pecados que tuviere el que se bautiza y las penas por ellos
    debidas; e imprime en el alma el carácter sacramental que nos hace cristianos. (Baptism gives sanctifying grace; forgives
    all the sins the person being baptized may have and the punishments owed for them; and imprints on the soul the sacramental
    character that makes us Christians.)
- es: ¿Es necesario el Bautismo? (Is Baptism necessary?)
  en: El Bautismo es el más necesario de los sacramentos, porque Jesucristo ha dicho que sin el Bautismo nadie puede entrar
    en el reino de Dios. (Baptism is the most necessary of the sacraments, because Jesus Christ said that without Baptism
    no one can enter the kingdom of God.)
- es: ¿Quién es el ministro del Bautismo? (Who is the minister of Baptism?)
  en: El ministro ordinario del Bautismo es el sacerdote, pero en caso de necesidad puede bautizar cualquier hombre o mujer
    que tenga uso de razón. (The ordinary minister of Baptism is the priest, but in case of necessity, any man or woman who
    has the use of reason may baptize.)
- es: ¿Cómo se administra el Bautismo? (How is Baptism administered?)
  en: 'El Bautismo se administra derramando agua natural sobre la cabeza del que se bautiza, diciendo al mismo tiempo con
    intención de bautizar: «Yo te bautizo en el nombre del Padre, y del Hijo, y del Espíritu Santo». (Baptism is administered
    by pouring natural water on the head of the one being baptized, while saying, with the intention of baptizing: "I baptize
    you in the name of the Father, and of the Son, and of the Holy Spirit.")'
- es: ¿Cuándo se debe administrar el Bautismo a los niños? (When should children be baptized?)
  en: El Bautismo se debe administrar a los niños lo más pronto posible. (Children should be baptized as soon as possible.)
