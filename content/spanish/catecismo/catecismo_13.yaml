id: catecismo_13
name: Catecismo 13
sentences:
- es: ¿Qué es blasfemar? (What is blasphemy?)
  en: Blasfemar es decir palabras o hacer gestos injuriosos contra Dios, la Virgen, los Santos y la Iglesia. (Blasphemy is
    to say words or make gestures insulting to God, the Virgin, the Saints, or the Church.)
- es: ¿Quién usa el nombre de Dios sin el debido respeto? (Who uses the name of God without due respect?)
  en: Usa el nombre de Dios sin el debido respeto quien jura sin verdad, sin justicia o sin necesidad, y quien no cumple sus
    votos. (He who swears without truth, without justice, or without necessity, and he who does not fulfill his vows, uses
    the name of God without due respect.)
- es: ¿Qué es jurar? (What is to swear an oath?)
  en: Jurar es poner a Dios por testigo de lo que decimos o prometemos. (To swear an oath is to call God as witness to what
    we say or promise.)
- es: ¿Qué es voto? (What is a vow?)
  en: Voto es la promesa hecha a Dios de una cosa buena que no impide otra mejor, con intención de obligarse. (A vow is a
    promise made to God of some good thing that does not prevent a better one, made with the intention of binding oneself
    to it.)
- es: ¿Cuál es el tercer mandamiento de la Ley de Dios? (What is the third commandment of the Law of God?)
  en: 'El tercer mandamiento de la Ley de Dios es: santificarás las fiestas. (The third commandment of the Law of God is:
    you shall keep the feast days holy.)'
- es: ¿Quién santifica las fiestas? (Who keeps the feast days holy?)
  en: Santifica las fiestas el que emplea los días de fiesta en dar culto a Dios, oyendo Misa, y se abstiene de trabajos corporales.
    (He who spends feast days giving worship to God, hearing Mass, and refrains from manual labor keeps the feast days holy.)
- es: ¿Peca quien trabaja en los días de fiesta? (Does one who works on feast days sin?)
  en: Peca quien trabaja en los días de fiesta sin licencia o necesidad. (One who works on feast days without permission or
    necessity sins.)
- es: ¿Cuál es el cuarto mandamiento de la Ley de Dios? (What is the fourth commandment of the Law of God?)
  en: 'El cuarto mandamiento de la Ley de Dios es: honrarás a tu padre y a tu madre. (The fourth commandment of the Law of
    God is: honor your father and your mother.)'
- es: ¿Quién honra a su padre y a su madre? (Who honors his father and mother?)
  en: Honra a su padre y a su madre quien los ama, reverencia y obedece. (He who loves, reveres, and obeys them honors his
    father and mother.)
- es: ¿A quién deben los niños tener por modelo? (Whom should children take as their model?)
  en: Los niños deben tener por modelo al Niño Jesús, y amar y obedecer a sus padres como Jesús amó y obedeció a la Virgen
    María y a San José. (Children should take the Child Jesus as their model, and love and obey their parents as Jesus loved
    and obeyed the Virgin Mary and Saint Joseph.)
