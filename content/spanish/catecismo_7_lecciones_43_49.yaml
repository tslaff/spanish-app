id: catecismo_lecciones_43_49
name: "Catecismo - Lecciones 43-49"

sentences:
  - es: "¿Qué es el Bautismo? (What is Baptism?)"
    en: "El Bautismo es el sacramento que nos quita el pecado original y nos hace cristianos. (Baptism is the sacrament that takes away original sin and makes us Christians.)"

  - es: "¿Qué efectos produce el Bautismo? (What effects does Baptism produce?)"
    en: "El Bautismo da la gracia santificante; perdona todos los pecados que tuviere el que se bautiza y las penas por ellos debidas; e imprime en el alma el carácter sacramental que nos hace cristianos. (Baptism gives sanctifying grace; forgives all the sins the person being baptized may have and the punishments owed for them; and imprints on the soul the sacramental character that makes us Christians.)"

  - es: "¿Es necesario el Bautismo? (Is Baptism necessary?)"
    en: "El Bautismo es el más necesario de los sacramentos, porque Jesucristo ha dicho que sin el Bautismo nadie puede entrar en el reino de Dios. (Baptism is the most necessary of the sacraments, because Jesus Christ said that without Baptism no one can enter the kingdom of God.)"

  - es: "¿Quién es el ministro del Bautismo? (Who is the minister of Baptism?)"
    en: "El ministro ordinario del Bautismo es el sacerdote, pero en caso de necesidad puede bautizar cualquier hombre o mujer que tenga uso de razón. (The ordinary minister of Baptism is the priest, but in case of necessity, any man or woman who has the use of reason may baptize.)"

  - es: "¿Cómo se administra el Bautismo? (How is Baptism administered?)"
    en: "El Bautismo se administra derramando agua natural sobre la cabeza del que se bautiza, diciendo al mismo tiempo con intención de bautizar: «Yo te bautizo en el nombre del Padre, y del Hijo, y del Espíritu Santo». (Baptism is administered by pouring natural water on the head of the one being baptized, while saying, with the intention of baptizing: \"I baptize you in the name of the Father, and of the Son, and of the Holy Spirit.\")"

  - es: "¿Cuándo se debe administrar el Bautismo a los niños? (When should children be baptized?)"
    en: "El Bautismo se debe administrar a los niños lo más pronto posible. (Children should be baptized as soon as possible.)"

  - es: "¿Qué es la Confirmación? (What is Confirmation?)"
    en: "La Confirmación es el sacramento que nos aumenta la gracia del Espíritu Santo, para fortalecernos en la fe y hacernos soldados y apóstoles de Cristo. (Confirmation is the sacrament that increases in us the grace of the Holy Spirit, to strengthen us in the faith and make us soldiers and apostles of Christ.)"

  - es: "¿Cómo se debe recibir la Confirmación? (How should Confirmation be received?)"
    en: "La Confirmación se debe recibir en estado de gracia, y conociendo las principales verdades cristianas. (Confirmation should be received in a state of grace, and while knowing the main Christian truths.)"

  - es: "¿Quién es el ministro de la Confirmación? (Who is the minister of Confirmation?)"
    en: "El ministro ordinario de la Confirmación es el Obispo, pero en caso de peligro de muerte, en ausencia del Obispo, puede confirmar el párroco. (The ordinary minister of Confirmation is the Bishop, but in danger of death, in the Bishop's absence, the parish priest may confirm.)"

  - es: "¿Qué es la Penitencia? (What is Penance?)"
    en: "La Penitencia es el sacramento que perdona los pecados cometidos después del Bautismo. (Penance is the sacrament that forgives sins committed after Baptism.)"

  - es: "¿Cuándo recibimos el sacramento de la Penitencia? (When do we receive the sacrament of Penance?)"
    en: "Recibimos el sacramento de la Penitencia cuando nos confesamos bien y recibimos la absolución. (We receive it when we make a good confession and receive absolution.)"

  - es: "¿Cuántas cosas son necesarias para confesarnos bien? (How many things are necessary to make a good confession?)"
    en: "Para confesarnos bien son necesarias cinco cosas: examen de conciencia, dolor de los pecados, propósito de la enmienda, decir los pecados al confesor y cumplir la penitencia. (Five things are necessary: examination of conscience, sorrow for one's sins, purpose of amendment, telling one's sins to the confessor, and fulfilling the penance.)"

  - es: "¿Qué es examen de conciencia? (What is examination of conscience?)"
    en: "Examen de conciencia es recordar todos los pecados cometidos desde la última confesión bien hecha. (Examination of conscience is recalling all the sins committed since one's last good confession.)"

  - es: "¿Qué es dolor de los pecados? (What is sorrow for sin?)"
    en: "Dolor de los pecados es un sentimiento o pena de haber ofendido a Dios por ser infinitamente bueno, o porque nos puede castigar, o por la fealdad del pecado. (Sorrow for sin is a feeling of grief for having offended God, whether because He is infinitely good, or because He can punish us, or because of the ugliness of sin.)"

  - es: "¿De cuántas maneras es el dolor de los pecados? (In how many ways can sorrow for sin be?)"
    en: "El dolor de los pecados es de dos maneras: dolor de contrición y dolor de atrición. (Sorrow for sin can be of two kinds: sorrow of contrition and sorrow of attrition.)"

  - es: "¿Qué es dolor de contrición? (What is sorrow of contrition?)"
    en: "Dolor de contrición es un sentimiento o pena de haber ofendido a Dios por ser Él quien es, Bondad infinita, digno de ser amado sobre todas las cosas. (Sorrow of contrition is a feeling of grief for having offended God because of who He is, infinite Goodness, worthy of being loved above all things.)"

  - es: "¿El dolor de contrición perdona los pecados mortales? (Does sorrow of contrition forgive mortal sins?)"
    en: "El dolor de contrición perdona inmediatamente los pecados mortales, si se tiene el propósito de confesarlos. (Sorrow of contrition immediately forgives mortal sins, if one has the intention of confessing them.)"

  - es: "¿Qué es dolor de atrición? (What is sorrow of attrition?)"
    en: "Dolor de atrición es un sentimiento o pena de haber ofendido a Dios por temor al castigo o por la misma fealdad del pecado. (Sorrow of attrition is a feeling of grief for having offended God out of fear of punishment or because of the ugliness of sin itself.)"

  - es: "¿Basta el dolor de atrición para perdonar los pecados mortales? (Is sorrow of attrition enough to forgive mortal sins?)"
    en: "El dolor de atrición no basta para perdonar los pecados mortales, sino que es necesario confesarlos y recibir la absolución. (Sorrow of attrition alone is not enough; it is also necessary to confess them and receive absolution.)"

  - es: "¿Qué es propósito de la enmienda? (What is purpose of amendment?)"
    en: "Propósito de la enmienda es una firme resolución de no volver a pecar. (Purpose of amendment is a firm resolution never to sin again.)"

  - es: "¿Cuándo tenemos verdadero propósito de la enmienda? (When do we have a true purpose of amendment?)"
    en: "Tenemos verdadero propósito de la enmienda cuando estamos dispuestos a poner los medios necesarios para evitar el pecado y huir de las ocasiones de pecar. (When we are willing to use the necessary means to avoid sin and to flee the occasions of sin.)"

  - es: "¿Qué pecados debemos confesar? (What sins must we confess?)"
    en: "Debemos confesar todos los pecados mortales, y conviene decir también los veniales. (We must confess all mortal sins, and it is also good to mention venial sins.)"

  - es: "¿Cómo se han de confesar los pecados? (How should sins be confessed?)"
    en: "Los pecados se han de confesar con humildad y sencillez, manifestando los ciertos como ciertos, los dudosos como dudosos, y aquellas circunstancias que aumenten o disminuyan su gravedad. (Sins should be confessed with humility and simplicity, stating what is certain as certain and what is doubtful as doubtful, along with the circumstances that increase or lessen their gravity.)"

  - es: "¿Hay que confesar el número exacto de los pecados mortales cometidos? (Must one confess the exact number of mortal sins committed?)"
    en: "Hay que confesar el número exacto de los pecados mortales cometidos, y si no se recuerda, el número aproximado. (One must confess the exact number, and if it is not remembered, the approximate number.)"

  - es: "¿Cómo peca el que calla a sabiendas algún pecado mortal? (How does one sin who knowingly conceals a mortal sin?)"
    en: "El que calla a sabiendas algún pecado mortal comete un grave sacrilegio y no se le perdonan los pecados confesados. (One who knowingly conceals a mortal sin commits a grave sacrilege, and the sins confessed are not forgiven.)"

  - es: "¿Qué es cumplir la penitencia? (What is it to fulfill one's penance?)"
    en: "Cumplir la penitencia es rezar las oraciones y hacer las buenas obras que manda el confesor, para satisfacer por la pena temporal de los pecados. (It is to say the prayers and perform the good works the confessor assigns, in order to make satisfaction for the temporal punishment due to sin.)"

  - es: "¿Qué es la Eucaristía? (What is the Eucharist?)"
    en: "La Eucaristía es el sacramento del Cuerpo y Sangre de Jesucristo bajo las especies de pan y de vino. (The Eucharist is the sacrament of the Body and Blood of Jesus Christ under the appearances of bread and wine.)"

  - es: "¿Cuántas cosas hay que considerar en la Eucaristía? (How many things must be considered in the Eucharist?)"
    en: "En la Eucaristía hay que considerar tres cosas: que en la Eucaristía está real y verdaderamente Jesucristo; que en la Eucaristía se ofrece por nosotros Jesucristo en la santa Misa; y que en la Eucaristía recibimos a Jesucristo en la sagrada Comunión. (Three things: that Jesus Christ is really and truly present in the Eucharist; that in the Eucharist Jesus Christ is offered for us in the holy Mass; and that in the Eucharist we receive Jesus Christ in holy Communion.)"

  - es: "¿Cuándo instituyó Jesucristo la Eucaristía? (When did Jesus Christ institute the Eucharist?)"
    en: "Jesucristo instituyó la Eucaristía el día de Jueves Santo, en la última Cena. (Jesus Christ instituted the Eucharist on Holy Thursday, at the Last Supper.)"

  - es: "¿Cuándo empieza Jesucristo a estar en la Eucaristía? (When does Jesus Christ begin to be present in the Eucharist?)"
    en: "Jesucristo empieza a estar en la Eucaristía en el momento de la consagración de la Misa. (At the moment of the consecration during Mass.)"

  - es: "¿Qué es la Hostia antes de la consagración? (What is the Host before the consecration?)"
    en: "La Hostia antes de la consagración es pan de trigo. (Before the consecration, the Host is wheat bread.)"

  - es: "¿Qué es la Hostia después de la consagración? (What is the Host after the consecration?)"
    en: "La Hostia después de la consagración es el Cuerpo de Jesucristo. (After the consecration, the Host is the Body of Jesus Christ.)"

  - es: "¿Qué hay en el cáliz antes de la consagración? (What is in the chalice before the consecration?)"
    en: "En el cáliz antes de la consagración hay vino con unas gotas de agua. (Before the consecration, the chalice contains wine with a few drops of water.)"

  - es: "¿Qué hay en el cáliz después de la consagración? (What is in the chalice after the consecration?)"
    en: "En el cáliz después de la consagración está la Sangre de Jesucristo. (After the consecration, the chalice contains the Blood of Jesus Christ.)"

  - es: "¿Cómo está Jesucristo en la Eucaristía? (How is Jesus Christ present in the Eucharist?)"
    en: "Jesucristo está todo entero en todas y cada una de las partes de la Eucaristía. (Jesus Christ is present, whole and entire, in each and every part of the Eucharist.)"

  - es: "¿Qué es la santa Misa? (What is the holy Mass?)"
    en: "La santa Misa es el sacrificio del Cuerpo y Sangre de Jesucristo, que se ofrece a Dios por ministerio del sacerdote en memoria y renovación del sacrificio de la Cruz. (The holy Mass is the sacrifice of the Body and Blood of Jesus Christ, offered to God through the ministry of the priest, in memory and renewal of the sacrifice of the Cross.)"

  - es: "¿Por qué decimos que la santa Misa es sacrificio? (Why do we say the holy Mass is a sacrifice?)"
    en: "Decimos que la santa Misa es sacrificio porque en ella Jesucristo se ofrece como víctima, en reconocimiento de la suprema majestad de Dios, y en reparación de nuestros pecados. (Because in it Jesus Christ offers Himself as a victim, in acknowledgment of the supreme majesty of God and in reparation for our sins.)"

  - es: "¿Es la santa Misa el mismo sacrificio de la Cruz? (Is the holy Mass the same sacrifice as that of the Cross?)"
    en: "La santa Misa es el mismo sacrificio de la Cruz, porque en la Misa el mismo Jesucristo renueva el ofrecimiento de su pasión y muerte hecho en el Calvario. (The holy Mass is the very same sacrifice as that of the Cross, because in the Mass Jesus Christ Himself renews the offering of His passion and death made on Calvary.)"

  - es: "¿Cuáles son los fines de la santa Misa? (What are the ends of the holy Mass?)"
    en: "Los fines de la santa Misa son cuatro: adorar a Dios, darle gracias, pedirle beneficios y satisfacer por nuestros pecados. (The ends of the holy Mass are four: to adore God, to thank Him, to ask Him for blessings, and to make satisfaction for our sins.)"

  - es: "¿Cuáles son las partes principales de la santa Misa? (What are the main parts of the holy Mass?)"
    en: "Las partes principales de la santa Misa son: el ofertorio, la consagración y la comunión. (The main parts of the holy Mass are: the offertory, the consecration, and the communion.)"

  - es: "¿Qué es la sagrada Comunión? (What is holy Communion?)"
    en: "La sagrada Comunión es recibir al mismo Jesucristo bajo las especies de pan y vino. (Holy Communion is receiving Jesus Christ Himself under the appearances of bread and wine.)"

  - es: "¿Para qué recibimos a Jesucristo en la sagrada Comunión? (Why do we receive Jesus Christ in holy Communion?)"
    en: "Recibimos a Jesucristo en la sagrada Comunión para que sea alimento de nuestras almas, nos aumente la gracia y nos dé la vida eterna. (So that He may be the food of our souls, increase grace in us, and give us eternal life.)"

  - es: "¿Cuántas cosas son necesarias para recibir bien la sagrada Comunión? (How many things are necessary to receive holy Communion well?)"
    en: "Para recibir bien la sagrada Comunión son necesarias tres cosas: estar en gracia de Dios, guardar el ayuno eucarístico y saber a quién recibimos. (Three things: to be in the grace of God, to keep the Eucharistic fast, and to know whom we are receiving.)"

  - es: "¿Qué quiere decir estar en gracia de Dios? (What does it mean to be in the grace of God?)"
    en: "Estar en gracia de Dios quiere decir estar limpio de pecado mortal. (To be free from mortal sin.)"

  - es: "¿Qué es guardar el ayuno eucarístico? (What is keeping the Eucharistic fast?)"
    en: "Guardar el ayuno eucarístico es no haber comido ni tomado bebidas alcohólicas desde tres horas antes, ni bebido otros líquidos desde una hora antes de comulgar. El agua no rompe el ayuno. (Not having eaten or drunk alcoholic beverages for three hours beforehand, nor drunk other liquids for one hour before receiving Communion. Water does not break the fast.)"

  - es: "¿Cómo hemos de acercarnos a la sagrada Comunión? (How should we approach holy Communion?)"
    en: "Hemos de acercarnos a la sagrada Comunión con fe viva, fervor, humildad y modestia. (We should approach holy Communion with living faith, fervor, humility, and modesty.)"

  - es: "¿Qué pecado comete el que comulga en pecado mortal? (What sin does one commit who receives Communion in mortal sin?)"
    en: "El que comulga en pecado mortal comete un horrible sacrilegio. (One who receives Communion in mortal sin commits a horrible sacrilege.)"

  - es: "¿Qué es la Extremaunción? (What is Extreme Unction?)"
    en: "La Extremaunción es el sacramento que alivia el alma y el cuerpo del cristiano gravemente enfermo. (Extreme Unction is the sacrament that comforts the soul and body of a Christian who is gravely ill.)"

  - es: "¿Cuáles son los efectos de la Extremaunción? (What are the effects of Extreme Unction?)"
    en: "La Extremaunción aumenta la gracia santificante; perdona los pecados veniales y aun los mortales, si el enfermo está arrepentido y no ha podido confesarse; le da fuerzas para resistir las tentaciones y soportar los sufrimientos de la enfermedad; y le concede la salud del cuerpo si le conviene. (It increases sanctifying grace; forgives venial sins and even mortal sins, if the sick person is repentant and has been unable to confess; gives strength to resist temptation and bear the sufferings of illness; and grants bodily health if it is beneficial.)"

  - es: "¿Quién debe recibir la Extremaunción? (Who should receive Extreme Unction?)"
    en: "Debe recibir la Extremaunción todo cristiano, llegado al uso de razón, que se halle en peligro de muerte por enfermedad. (Every Christian who has reached the use of reason and is in danger of death from illness should receive it.)"

  - es: "¿Qué obligación tienen los familiares y los que asisten al enfermo? (What obligation do family members and caregivers of the sick have?)"
    en: "Los familiares y los que asisten al enfermo tienen obligación grave de procurar que el enfermo reciba la Extremaunción, y si es posible antes de que pierda el conocimiento. (They have a grave obligation to see that the sick person receives Extreme Unction, if possible before losing consciousness.)"

  - es: "¿Qué es el Orden sacerdotal? (What is Holy Orders?)"
    en: "El Orden sacerdotal es el sacramento que hace a algunos cristianos ministros de Dios. (Holy Orders is the sacrament that makes certain Christians ministers of God.)"

  - es: "¿Cuáles son las principales funciones sagradas del sacerdote? (What are the main sacred functions of the priest?)"
    en: "Las principales funciones sagradas del sacerdote son: celebrar la santa Misa, administrar los sacramentos, y predicar la palabra de Dios. (To celebrate holy Mass, to administer the sacraments, and to preach the word of God.)"

  - es: "¿Es muy grande la dignidad del sacerdote? (Is the dignity of the priest very great?)"
    en: "La dignidad del sacerdote es la mayor que hay en la tierra, porque es el mediador entre Dios y los hombres. (The dignity of the priest is the greatest that exists on earth, because he is the mediator between God and men.)"

  - es: "¿Qué es el Matrimonio? (What is Matrimony?)"
    en: "El Matrimonio es el sacramento que santifica la unión del hombre y la mujer, y les da la gracia para que vivan en paz y críen hijos para el cielo. (Matrimony is the sacrament that sanctifies the union of man and woman, and gives them grace to live in peace and raise children for heaven.)"

  - es: "¿Qué deben hacer los esposos cristianos para vivir santamente? (What should Christian spouses do in order to live holy lives?)"
    en: "Para vivir santamente los esposos cristianos deben amarse y guardarse fidelidad, recibir los hijos que Dios les dé y educarlos cristianamente. (They should love one another and keep faith with each other, welcome the children God gives them, and raise them in a Christian manner.)"

