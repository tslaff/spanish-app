id: catecismo_lecciones_29_35
name: "Catecismo - Lecciones 29-35"

sentences:
  - es: "¿Cuál es el décimo mandamiento de la Ley de Dios? (What is the tenth commandment of the Law of God?)"
    en: "El décimo mandamiento de la Ley de Dios es: no codiciarás los bienes ajenos. (The tenth commandment of the Law of God is: you shall not covet your neighbor's goods.)"

  - es: "¿Qué nos manda el décimo mandamiento? (What does the tenth commandment command us?)"
    en: "El décimo mandamiento nos manda conformarnos con los bienes que Dios nos ha dado y con los que honradamente podamos adquirir. (The tenth commandment commands us to be content with the goods God has given us and with those we can honestly acquire.)"

  - es: "¿Qué prohíbe el décimo mandamiento? (What does the tenth commandment forbid?)"
    en: "El décimo mandamiento prohíbe el deseo desordenado de riquezas y la envidia de los bienes ajenos. (The tenth commandment forbids the disordered desire for wealth and envy of another's goods.)"

  - es: "¿Es lícito aspirar dentro de la justicia a una mejor distribución de bienes? (Is it lawful to strive, within justice, for a better distribution of goods?)"
    en: "Es lícito aspirar dentro de la justicia a una mejor distribución de bienes, en conformidad con el destino que Dios les ha dado y con las exigencias del bien común. (It is lawful to strive, within justice, for a better distribution of goods, in accordance with the purpose God has given them and the demands of the common good.)"

  - es: "¿Qué poder dio Jesucristo a su Iglesia? (What power did Jesus Christ give His Church?)"
    en: "Jesucristo dio a su Iglesia el poder de enseñar, de santificar y de gobernar a los fieles en orden a la vida eterna. (Jesus Christ gave His Church the power to teach, to sanctify, and to govern the faithful for the sake of eternal life.)"

  - es: "¿Estamos obligados los cristianos a cumplir los mandamientos de la Iglesia? (Are Christians obliged to keep the commandments of the Church?)"
    en: "Los cristianos estamos obligados a cumplir los mandamientos de la Iglesia, porque la Iglesia manda con autoridad recibida de Jesucristo. (We Christians are obliged to keep the commandments of the Church, because the Church commands with authority received from Jesus Christ.)"

  - es: "¿Cuál es el primer mandamiento de la santa Madre Iglesia? (What is the first commandment of holy Mother Church?)"
    en: "El primer mandamiento de la santa Madre Iglesia es: oír Misa entera todos los domingos y fiestas de guardar. (The first commandment of holy Mother Church is: to hear Mass in its entirety every Sunday and holy day of obligation.)"

  - es: "¿Quién oye Misa entera? (Who hears Mass in its entirety?)"
    en: "Oye Misa entera quien asiste a toda ella con la debida atención. (He who attends the whole of it with due attention hears Mass in its entirety.)"

  - es: "¿Quiénes están obligados a oír Misa los domingos y fiestas de guardar? (Who is obliged to hear Mass on Sundays and holy days of obligation?)"
    en: "Están obligados a oír Misa los domingos y fiestas de guardar todos los cristianos que han cumplido siete años y tienen uso de razón. (All Christians who have completed seven years of age and have the use of reason are obliged to hear Mass on Sundays and holy days of obligation.)"

  - es: "¿Cómo peca el que no oye Misa en día de precepto? (How does one sin who does not hear Mass on a day of precept?)"
    en: "El que no oye Misa en día de precepto sin causa justa peca mortalmente. (One who, without just cause, does not hear Mass on a day of precept sins mortally.)"

  - es: "¿Cuál es el segundo mandamiento de la santa Madre Iglesia? (What is the second commandment of holy Mother Church?)"
    en: "El segundo mandamiento de la santa Madre Iglesia es: confesar los pecados mortales al menos una vez al año y en peligro de muerte y si se ha de comulgar. (The second commandment of holy Mother Church is: to confess mortal sins at least once a year, and in danger of death, and before receiving Communion.)"

  - es: "¿A quién obliga el segundo mandamiento de la santa Madre Iglesia? (Whom does the second commandment of holy Mother Church bind?)"
    en: "El segundo mandamiento de la santa Madre Iglesia obliga a todos los cristianos que tienen uso de razón y están en pecado mortal. (It binds all Christians who have the use of reason and are in mortal sin.)"

  - es: "¿Cuál es el tercer mandamiento de la santa Madre Iglesia? (What is the third commandment of holy Mother Church?)"
    en: "El tercer mandamiento de la santa Madre Iglesia es: comulgar por Pascua florida. (The third commandment of holy Mother Church is: to receive Communion during the Easter season.)"

  - es: "¿Cuándo estamos obligados a recibir la Comunión? (When are we obliged to receive Communion?)"
    en: "Estamos obligados a recibir la Comunión una vez al año, en el tiempo señalado por la Iglesia, y además en peligro de muerte como Viático. (We are obliged to receive Communion once a year, at the time appointed by the Church, and also in danger of death, as Viaticum.)"

  - es: "¿A quién obliga el precepto de comulgar? (Whom does the precept of receiving Communion bind?)"
    en: "El precepto de comulgar obliga a todos los cristianos que han llegado al uso de razón. (The precept of receiving Communion binds all Christians who have reached the use of reason.)"

  - es: "¿Cumplen el precepto de confesar y comulgar los que lo hacen sin las debidas disposiciones? (Do those who confess and receive Communion without the necessary dispositions fulfill the precept?)"
    en: "Los que confiesan y comulgan sin las debidas disposiciones no cumplen el precepto, sino que cometen un grave sacrilegio y tienen que volver a confesarse y comulgar. (They do not fulfill the precept, but rather commit a grave sacrilege and must confess and receive Communion again.)"

  - es: "¿Desea la Iglesia que confesemos y comulguemos con frecuencia? (Does the Church wish us to confess and receive Communion frequently?)"
    en: "La Iglesia desea que confesemos y comulguemos con frecuencia, y no debemos contentarnos con hacerlo una vez al año. (The Church wishes us to confess and receive Communion frequently, and we should not be content with doing so only once a year.)"

  - es: "¿Cuál es el cuarto mandamiento de la santa Madre Iglesia? (What is the fourth commandment of holy Mother Church?)"
    en: "El cuarto mandamiento de la santa Madre Iglesia es: ayunar y abstenerse de comer carne cuando lo manda la santa Madre Iglesia. (The fourth commandment of holy Mother Church is: to fast and abstain from meat when holy Mother Church commands it.)"

  - es: "¿En qué consiste la ley del ayuno? (What does the law of fasting consist of?)"
    en: "La ley del ayuno consiste en no hacer más de una comida al día, si bien se permite un ligero desayuno y una frugal colación. (It consists of not eating more than one full meal a day, though a light breakfast and a small collation are allowed.)"

  - es: "¿A quiénes obliga la ley del ayuno y de la abstinencia? (Whom does the law of fasting and abstinence bind?)"
    en: "La ley del ayuno obliga a los que han cumplido veintiún años y no han llegado a los sesenta; la ley de la abstinencia obliga a los que han cumplido siete años. (The law of fasting binds those who have completed twenty-one years of age and have not yet reached sixty; the law of abstinence binds those who have completed seven years of age.)"

  - es: "¿Qué es la Bula de la santa Cruzada? (What is the Bull of the Holy Crusade?)"
    en: "La Bula de la santa Cruzada es un privilegio pontificio, que concede a los españoles gracias especiales, y les dispensa del ayuno y de la abstinencia en ciertos días. (The Bull of the Holy Crusade is a pontifical privilege that grants Spaniards special favors and dispenses them from fasting and abstinence on certain days.)"

  - es: "¿Cuál es el quinto mandamiento de la santa Madre Iglesia? (What is the fifth commandment of holy Mother Church?)"
    en: "El quinto mandamiento de la santa Madre Iglesia es: ayudar a la Iglesia en sus necesidades. (The fifth commandment of holy Mother Church is: to help support the Church in her needs.)"

  - es: "¿Cuáles son las principales necesidades de la Iglesia? (What are the main needs of the Church?)"
    en: "Las principales necesidades de la Iglesia son: el sostenimiento del culto y sus ministros, el Seminario, las Misiones y las obras católicas. (The main needs of the Church are: the support of worship and its ministers, the Seminary, the Missions, and Catholic works.)"

  - es: "¿Qué es virtud? (What is virtue?)"
    en: "Virtud es una disposición permanente del alma para obrar el bien. (Virtue is a lasting disposition of the soul to do good.)"

  - es: "¿Cuántas clases hay de virtudes? (How many kinds of virtues are there?)"
    en: "Hay dos clases de virtudes: teologales y cardinales. (There are two kinds of virtues: theological and cardinal.)"

  - es: "¿Cuántas son las virtudes teologales? (How many theological virtues are there?)"
    en: "Las virtudes teologales son tres: fe, esperanza y caridad. (There are three theological virtues: faith, hope, and charity.)"

  - es: "¿Por qué se llaman teologales? (Why are they called theological?)"
    en: "Se llaman teologales porque tienen a Dios por objeto inmediato, y Él nos las da con su gracia para ganar el cielo. (They are called theological because they have God as their immediate object, and He gives them to us with His grace so that we may gain heaven.)"

  - es: "¿Qué es fe? (What is faith?)"
    en: "Fe es una virtud sobrenatural por la que creemos firmemente lo que Dios ha revelado y la Iglesia nos enseña. (Faith is a supernatural virtue by which we firmly believe what God has revealed and the Church teaches us.)"

  - es: "¿Qué verdades de fe es necesario creer para salvarnos? (What truths of faith must we believe in order to be saved?)"
    en: "Para salvarnos es necesario creer en la existencia de Dios, el misterio de la Santísima Trinidad, la Encarnación del Hijo de Dios y la vida eterna. (It is necessary to believe in the existence of God, the mystery of the Most Holy Trinity, the Incarnation of the Son of God, and life everlasting.)"

  - es: "¿Qué deben saber los cristianos además de las verdades de fe? (What must Christians know besides the truths of faith?)"
    en: "Los cristianos, además de las verdades de fe, deben saber el Padrenuestro, el Avemaría, los mandamientos de la Ley de Dios y de la Iglesia, los sacramentos y los deberes del propio estado. (They must also know the Our Father, the Hail Mary, the commandments of the Law of God and of the Church, the sacraments, and the duties of their own state in life.)"

  - es: "¿Cuáles son los principales pecados contra la fe? (What are the main sins against faith?)"
    en: "Los principales pecados contra la fe son: la infidelidad, la apostasía y la herejía. (The main sins against faith are: infidelity, apostasy, and heresy.)"

  - es: "¿Basta la fe para salvarnos? (Is faith enough to save us?)"
    en: "Para salvarnos no basta la fe, porque la fe sola sin buenas obras es una fe muerta. (Faith alone is not enough to save us, because faith without good works is a dead faith.)"

  - es: "¿Qué es esperanza? (What is hope?)"
    en: "Esperanza es una virtud sobrenatural por la cual confiamos que Dios nos dará la gloria mediante su gracia y nuestras buenas obras. (Hope is a supernatural virtue by which we trust that God will give us glory through His grace and our good works.)"

  - es: "¿Por qué debemos esperar en Dios? (Why must we hope in God?)"
    en: "Debemos esperar en Dios porque es Padre omnipotente, misericordioso y fidelísimo en cumplir sus promesas. (We must hope in God because He is an all-powerful, merciful Father, most faithful in keeping His promises.)"

  - es: "¿Cuáles son los principales pecados contra la esperanza? (What are the main sins against hope?)"
    en: "Los principales pecados contra la esperanza son dos: la presunción y la desesperación. (The main sins against hope are two: presumption and despair.)"

  - es: "¿Puede el pecador tener motivos para desesperar de su salvación? (Can a sinner have reason to despair of his salvation?)"
    en: "El pecador nunca puede tener motivos para desesperar de su salvación, porque la misericordia de Dios es infinita y siempre concede la gracia del arrepentimiento a quien humilde y confiadamente se la pide. (A sinner can never have reason to despair of his salvation, because God's mercy is infinite and always grants the grace of repentance to whoever asks for it humbly and trustingly.)"

  - es: "¿Cuál es la principal virtud del cristiano? (What is the principal virtue of a Christian?)"
    en: "La principal virtud del cristiano es la caridad. (The principal virtue of a Christian is charity.)"

  - es: "¿Qué es caridad? (What is charity?)"
    en: "Caridad es una virtud sobrenatural por la que amamos a Dios sobre todas las cosas por ser quien es, y a nosotros y al prójimo por amor de Dios. (Charity is a supernatural virtue by which we love God above all things for who He is, and love ourselves and our neighbor for the love of God.)"

  - es: "¿Por qué debemos amar a Dios sobre todas las cosas? (Why must we love God above all things?)"
    en: "Debemos amar a Dios sobre todas las cosas porque sólo Dios es infinitamente amable y nos ha creado para el cielo. (We must love God above all things because only God is infinitely lovable and He has created us for heaven.)"

  - es: "¿Cómo hemos de amarnos a nosotros mismos? (How should we love ourselves?)"
    en: "Hemos de amarnos a nosotros mismos procurando los verdaderos bienes de alma y cuerpo en orden a la vida eterna. (We should love ourselves by seeking the true goods of soul and body, in view of eternal life.)"

  - es: "¿Quién es nuestro prójimo? (Who is our neighbor?)"
    en: "Nuestro prójimo son todos los hombres, aun nuestros enemigos. (Our neighbor is all mankind, even our enemies.)"

  - es: "¿Por qué debemos amar al prójimo? (Why must we love our neighbor?)"
    en: "Debemos amar al prójimo porque todos los hombres somos hermanos, hijos del mismo Padre celestial, redimidos con la sangre de Jesucristo y destinados al mismo cielo. (We must love our neighbor because all of us are brothers, children of the same heavenly Father, redeemed by the blood of Jesus Christ, and destined for the same heaven.)"

  - es: "¿Por qué debemos amar también a nuestros enemigos? (Why must we also love our enemies?)"
    en: "Debemos amar también a nuestros enemigos porque son hermanos nuestros y porque Jesucristo así nos lo mandó y nos lo enseñó con su ejemplo. (We must also love our enemies because they are our brothers, and because Jesus Christ commanded it and taught it to us by His example.)"

  - es: "¿Cómo se ejercita la caridad con el prójimo? (How is charity toward one's neighbor practiced?)"
    en: "La caridad con el prójimo se ejercita respetando sus derechos de justicia y practicando las obras de misericordia. (It is practiced by respecting his rights in justice and by practicing the works of mercy.)"

