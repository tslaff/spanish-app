id: catecismo_lecciones_22_28
name: "Catecismo - Lecciones 22-28"

sentences:
  - es: "¿Cuál es el tercer mandamiento de la Ley de Dios?"
    en: "El tercer mandamiento de la Ley de Dios es: santificarás las fiestas."

  - es: "¿Quién santifica las fiestas?"
    en: "Santifica las fiestas el que emplea los días de fiesta en dar culto a Dios, oyendo Misa, y se abstiene de trabajos corporales."

  - es: "¿Peca quien trabaja en los días de fiesta?"
    en: "Peca quien trabaja en los días de fiesta sin licencia o necesidad."

  - es: "¿Cuál es el cuarto mandamiento de la Ley de Dios?"
    en: "El cuarto mandamiento de la Ley de Dios es: honrarás a tu padre y a tu madre."

  - es: "¿Quién honra a su padre y a su madre?"
    en: "Honra a su padre y a su madre quien los ama, reverencia y obedece."

  - es: "¿A quién deben los niños tener por modelo?"
    en: "Los niños deben tener por modelo al Niño Jesús, y amar y obedecer a sus padres como Jesús amó y obedeció a la Virgen María y a San José."

  - es: "¿A quiénes más debemos honrar?"
    en: "Debemos también honrar a los mayores en edad, dignidad y gobierno."

  - es: "¿Cuáles son los deberes de los padres?"
    en: "Los deberes de los padres son: amar, sustentar y educar cristianamente a sus hijos."

  - es: "¿Cuáles son los deberes de los esposos entre sí?"
    en: "Los deberes de los esposos entre sí son: amarse, ayudarse y guardarse fidelidad."

  - es: "¿Cuáles son nuestros deberes para con la Patria?"
    en: "Nuestros deberes para con la Patria son: amarla, defenderla, cumplir sus leyes y contribuir al bien común."

  - es: "¿Cuál es el quinto mandamiento de la Ley de Dios?"
    en: "El quinto mandamiento de la Ley de Dios es: no matarás."

  - es: "¿Qué nos manda el quinto mandamiento de la Ley de Dios?"
    en: "El quinto mandamiento de la Ley de Dios nos manda querer bien a todos y perdonar a nuestros enemigos."

  - es: "¿Qué prohíbe el quinto mandamiento de la Ley de Dios?"
    en: "El quinto mandamiento de la Ley de Dios prohíbe hacer daño a la propia vida o a la de otros con palabras, obras o deseos."

  - es: "¿Quién peca contra sí mismo en el quinto mandamiento de la Ley de Dios?"
    en: "Peca contra sí mismo en el quinto mandamiento de la Ley de Dios el que se quita la vida, o se mutila, la pone en peligro sin necesidad, se embriaga, y por desesperación se desea la muerte."

  - es: "¿Quién peca contra el prójimo en el quinto mandamiento de la Ley de Dios?"
    en: "Peca contra el prójimo en el quinto mandamiento de la Ley de Dios el que le da la muerte o le hiere, el que le odia o está enemistado con él, el que le desea mal o le insulta, y el que le escandaliza."

  - es: "¿Qué es escándalo?"
    en: "Escándalo es toda palabra, obra u omisión que incita a otros a caer en pecado."

  - es: "¿Es lícita la venganza?"
    en: "La venganza nunca es lícita, porque nadie debe tomarse la justicia por su mano."

  - es: "¿Cuál es el sexto mandamiento de la Ley de Dios?"
    en: "El sexto mandamiento de la Ley de Dios es: no cometerás actos impuros."

  - es: "¿Qué nos manda el sexto mandamiento?"
    en: "El sexto mandamiento nos manda que seamos puros y castos en obras y palabras."

  - es: "¿Tenemos los cristianos un motivo especial para amar la pureza?"
    en: "Los cristianos tenemos un motivo especial para amar la pureza, porque somos por la gracia miembros de Cristo y templos del Espíritu Santo."

  - es: "¿Quiénes pecan contra la pureza?"
    en: "Pecan contra la pureza los que consigo o con otros cometen acciones deshonestas, y los que voluntariamente se ponen a sí mismos o ponen a otros en peligro de cometerlas."

  - es: "¿Cuáles son los medios principales para guardar la pureza?"
    en: "Los medios principales para guardar la pureza son: la confesión y comunión frecuentes, la devoción a la Santísima Virgen, la modestia y la huida de las ocasiones peligrosas, como conversaciones, miradas, lecturas, modas, bailes y espectáculos deshonestos."

  - es: "¿Cuál es el séptimo mandamiento de la Ley de Dios?"
    en: "El séptimo mandamiento de la Ley de Dios es: no hurtarás."

  - es: "¿Qué prohíbe el séptimo mandamiento?"
    en: "El séptimo mandamiento prohíbe hacer daño al prójimo en sus bienes."

  - es: "¿Quiénes pecan contra el séptimo mandamiento?"
    en: "Pecan contra el séptimo mandamiento los que roban; los que perjudican y defraudan al prójimo en sus bienes; los que no pagan el justo salario o no trabajan lo que deben; y los que retienen bienes ajenos contra la voluntad de su dueño."

  - es: "¿A qué están obligados los que han hecho daño al prójimo en sus bienes?"
    en: "Los que han hecho daño al prójimo en sus bienes, están obligados a restituir lo mal adquirido y a reparar los daños culpablemente causados."

  - es: "¿Cuál es el octavo mandamiento de la Ley de Dios?"
    en: "El octavo mandamiento de la Ley de Dios es: no dirás falso testimonio ni mentirás."

  - es: "¿Qué nos manda el octavo mandamiento?"
    en: "El octavo mandamiento nos manda decir la verdad y respetar la fama del prójimo."

  - es: "¿Qué prohíbe el octavo mandamiento?"
    en: "El octavo mandamiento prohíbe la mentira, la calumnia, la maledicencia o difamación, el falso testimonio, el juicio temerario y toda ofensa contra el honor y la fama del prójimo."

  - es: "¿Qué es mentir?"
    en: "Mentir es decir lo contrario de lo que se piensa, con intención de engañar."

  - es: "¿Qué es calumniar?"
    en: "Calumniar es atribuir al prójimo pecados o defectos que no tiene."

  - es: "¿Qué es la maledicencia?"
    en: "La maledicencia o difamación es hablar mal del prójimo, difundiendo sus defectos y privándole de su fama."

  - es: "¿Qué es falso testimonio?"
    en: "Falso testimonio es declarar en juicio alguna cosa contra la verdad."

  - es: "¿Qué es juicio temerario?"
    en: "Juicio temerario es juzgar mal del prójimo sin motivo suficiente."

  - es: "¿A qué están obligados los que han perjudicado al prójimo en su fama?"
    en: "Los que han perjudicado al prójimo en su fama están obligados a reparar en lo posible el daño causado."

  - es: "¿Cuál es el noveno mandamiento de la Ley de Dios?"
    en: "El noveno mandamiento de la Ley de Dios es: no consentirás pensamientos ni deseos impuros."

  - es: "¿Qué nos manda el noveno mandamiento?"
    en: "El noveno mandamiento nos manda que seamos puros y castos en pensamientos y deseos."

  - es: "¿Cuándo son pecado los pensamientos y deseos impuros?"
    en: "Los pensamientos y deseos impuros son pecado cuando la voluntad se complace en ellos; pero no son pecado si la voluntad no los consiente y procura rechazarlos."

