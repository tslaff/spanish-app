id: catecismo_lecciones_29_35
name: "Catecismo - Lecciones 29-35"

sentences:
  - es: "¿Cuál es el décimo mandamiento de la Ley de Dios?"
    en: "El décimo mandamiento de la Ley de Dios es: no codiciarás los bienes ajenos."

  - es: "¿Qué nos manda el décimo mandamiento?"
    en: "El décimo mandamiento nos manda conformarnos con los bienes que Dios nos ha dado y con los que honradamente podamos adquirir."

  - es: "¿Qué prohíbe el décimo mandamiento?"
    en: "El décimo mandamiento prohíbe el deseo desordenado de riquezas y la envidia de los bienes ajenos."

  - es: "¿Es lícito aspirar dentro de la justicia a una mejor distribución de bienes?"
    en: "Es lícito aspirar dentro de la justicia a una mejor distribución de bienes, en conformidad con el destino que Dios les ha dado y con las exigencias del bien común."

  - es: "¿Qué poder dio Jesucristo a su Iglesia?"
    en: "Jesucristo dio a su Iglesia el poder de enseñar, de santificar y de gobernar a los fieles en orden a la vida eterna."

  - es: "¿Estamos obligados los cristianos a cumplir los mandamientos de la Iglesia?"
    en: "Los cristianos estamos obligados a cumplir los mandamientos de la Iglesia, porque la Iglesia manda con autoridad recibida de Jesucristo."

  - es: "¿Cuál es el primer mandamiento de la santa Madre Iglesia?"
    en: "El primer mandamiento de la santa Madre Iglesia es: oír Misa entera todos los domingos y fiestas de guardar."

  - es: "¿Quién oye Misa entera?"
    en: "Oye Misa entera quien asiste a toda ella con la debida atención."

  - es: "¿Quiénes están obligados a oír Misa los domingos y fiestas de guardar?"
    en: "Están obligados a oír Misa los domingos y fiestas de guardar todos los cristianos que han cumplido siete años y tienen uso de razón."

  - es: "¿Cómo peca el que no oye Misa en día de precepto?"
    en: "El que no oye Misa en día de precepto sin causa justa peca mortalmente."

  - es: "¿Cuál es el segundo mandamiento de la santa Madre Iglesia?"
    en: "El segundo mandamiento de la santa Madre Iglesia es: confesar los pecados mortales al menos una vez al año y en peligro de muerte y si se ha de comulgar."

  - es: "¿A quién obliga el segundo mandamiento de la santa Madre Iglesia?"
    en: "El segundo mandamiento de la santa Madre Iglesia obliga a todos los cristianos que tienen uso de razón y están en pecado mortal."

  - es: "¿Cuál es el tercer mandamiento de la santa Madre Iglesia?"
    en: "El tercer mandamiento de la santa Madre Iglesia es: comulgar por Pascua florida."

  - es: "¿Cuándo estamos obligados a recibir la Comunión?"
    en: "Estamos obligados a recibir la Comunión una vez al año, en el tiempo señalado por la Iglesia, y además en peligro de muerte como Viático."

  - es: "¿A quién obliga el precepto de comulgar?"
    en: "El precepto de comulgar obliga a todos los cristianos que han llegado al uso de razón."

  - es: "¿Cumplen el precepto de confesar y comulgar los que lo hacen sin las debidas disposiciones?"
    en: "Los que confiesan y comulgan sin las debidas disposiciones no cumplen el precepto, sino que cometen un grave sacrilegio y tienen que volver a confesarse y comulgar."

  - es: "¿Desea la Iglesia que confesemos y comulguemos con frecuencia?"
    en: "La Iglesia desea que confesemos y comulguemos con frecuencia, y no debemos contentarnos con hacerlo una vez al año."

  - es: "¿Cuál es el cuarto mandamiento de la santa Madre Iglesia?"
    en: "El cuarto mandamiento de la santa Madre Iglesia es: ayunar y abstenerse de comer carne cuando lo manda la santa Madre Iglesia."

  - es: "¿En qué consiste la ley del ayuno?"
    en: "La ley del ayuno consiste en no hacer más de una comida al día, si bien se permite un ligero desayuno y una frugal colación."

  - es: "¿A quiénes obliga la ley del ayuno y de la abstinencia?"
    en: "La ley del ayuno obliga a los que han cumplido veintiún años y no han llegado a los sesenta; la ley de la abstinencia obliga a los que han cumplido siete años."

  - es: "¿Qué es la Bula de la santa Cruzada?"
    en: "La Bula de la santa Cruzada es un privilegio pontificio, que concede a los españoles gracias especiales, y les dispensa del ayuno y de la abstinencia en ciertos días."

  - es: "¿Cuál es el quinto mandamiento de la santa Madre Iglesia?"
    en: "El quinto mandamiento de la santa Madre Iglesia es: ayudar a la Iglesia en sus necesidades."

  - es: "¿Cuáles son las principales necesidades de la Iglesia?"
    en: "Las principales necesidades de la Iglesia son: el sostenimiento del culto y sus ministros, el Seminario, las Misiones y las obras católicas."

  - es: "¿Qué es virtud?"
    en: "Virtud es una disposición permanente del alma para obrar el bien."

  - es: "¿Cuántas clases hay de virtudes?"
    en: "Hay dos clases de virtudes: teologales y cardinales."

  - es: "¿Cuántas son las virtudes teologales?"
    en: "Las virtudes teologales son tres: fe, esperanza y caridad."

  - es: "¿Por qué se llaman teologales?"
    en: "Se llaman teologales porque tienen a Dios por objeto inmediato, y Él nos las da con su gracia para ganar el cielo."

  - es: "¿Qué es fe?"
    en: "Fe es una virtud sobrenatural por la que creemos firmemente lo que Dios ha revelado y la Iglesia nos enseña."

  - es: "¿Qué verdades de fe es necesario creer para salvarnos?"
    en: "Para salvarnos es necesario creer en la existencia de Dios, el misterio de la Santísima Trinidad, la Encarnación del Hijo de Dios y la vida eterna."

  - es: "¿Qué deben saber los cristianos además de las verdades de fe?"
    en: "Los cristianos, además de las verdades de fe, deben saber el Padrenuestro, el Avemaría, los mandamientos de la Ley de Dios y de la Iglesia, los sacramentos y los deberes del propio estado."

  - es: "¿Cuáles son los principales pecados contra la fe?"
    en: "Los principales pecados contra la fe son: la infidelidad, la apostasía y la herejía."

  - es: "¿Basta la fe para salvarnos?"
    en: "Para salvarnos no basta la fe, porque la fe sola sin buenas obras es una fe muerta."

  - es: "¿Qué es esperanza?"
    en: "Esperanza es una virtud sobrenatural por la cual confiamos que Dios nos dará la gloria mediante su gracia y nuestras buenas obras."

  - es: "¿Por qué debemos esperar en Dios?"
    en: "Debemos esperar en Dios porque es Padre omnipotente, misericordioso y fidelísimo en cumplir sus promesas."

  - es: "¿Cuáles son los principales pecados contra la esperanza?"
    en: "Los principales pecados contra la esperanza son dos: la presunción y la desesperación."

  - es: "¿Puede el pecador tener motivos para desesperar de su salvación?"
    en: "El pecador nunca puede tener motivos para desesperar de su salvación, porque la misericordia de Dios es infinita y siempre concede la gracia del arrepentimiento a quien humilde y confiadamente se la pide."

  - es: "¿Cuál es la principal virtud del cristiano?"
    en: "La principal virtud del cristiano es la caridad."

  - es: "¿Qué es caridad?"
    en: "Caridad es una virtud sobrenatural por la que amamos a Dios sobre todas las cosas por ser quien es, y a nosotros y al prójimo por amor de Dios."

  - es: "¿Por qué debemos amar a Dios sobre todas las cosas?"
    en: "Debemos amar a Dios sobre todas las cosas porque sólo Dios es infinitamente amable y nos ha creado para el cielo."

  - es: "¿Cómo hemos de amarnos a nosotros mismos?"
    en: "Hemos de amarnos a nosotros mismos procurando los verdaderos bienes de alma y cuerpo en orden a la vida eterna."

  - es: "¿Quién es nuestro prójimo?"
    en: "Nuestro prójimo son todos los hombres, aun nuestros enemigos."

  - es: "¿Por qué debemos amar al prójimo?"
    en: "Debemos amar al prójimo porque todos los hombres somos hermanos, hijos del mismo Padre celestial, redimidos con la sangre de Jesucristo y destinados al mismo cielo."

  - es: "¿Por qué debemos amar también a nuestros enemigos?"
    en: "Debemos amar también a nuestros enemigos porque son hermanos nuestros y porque Jesucristo así nos lo mandó y nos lo enseñó con su ejemplo."

  - es: "¿Cómo se ejercita la caridad con el prójimo?"
    en: "La caridad con el prójimo se ejercita respetando sus derechos de justicia y practicando las obras de misericordia."

