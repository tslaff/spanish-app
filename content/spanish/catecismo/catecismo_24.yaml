id: catecismo_24
name: Catecismo 24
sentences:
- es: ¿Cuáles son los medios principales para alcanzar la gracia? (What are the main means of obtaining grace?)
  en: 'Los medios principales para alcanzar la gracia son: la oración y los sacramentos. (The main means of obtaining grace
    are prayer and the sacraments.)'
- es: ¿Qué es orar? (What is to pray?)
  en: Orar es hablar con Dios, nuestro Padre celestial, para alabarle, darle gracias y pedirle toda clase de bienes. (To pray
    is to speak with God, our heavenly Father, to praise Him, thank Him, and ask Him for every kind of blessing.)
- es: ¿Tenemos obligación de orar? (Are we obliged to pray?)
  en: Tenemos obligación de orar porque Jesucristo nos lo manda y porque es el medio ordinario para alcanzar la gracia y los
    beneficios de Dios. (We are obliged to pray because Jesus Christ commands it, and because it is the ordinary means of
    obtaining God's grace and blessings.)
- es: ¿Cómo hemos de orar? (How should we pray?)
  en: Hemos de orar con atención, humildad, confianza y perseverancia. (We should pray with attention, humility, trust, and
    perseverance.)
- es: ¿Oye siempre Dios nuestras oraciones? (Does God always hear our prayers?)
  en: Dios oye siempre nuestras oraciones y nos concede lo que es más conveniente para nuestra salvación. (God always hears
    our prayers, and grants us whatever is most fitting for our salvation.)
- es: ¿Cuál es la oración más excelente? (What is the most excellent prayer?)
  en: La oración más excelente es el Padrenuestro, que enseñó Jesucristo a los Apóstoles. (The most excellent prayer is the
    Our Father, which Jesus Christ taught the Apostles.)
- es: ¿Cuáles son las principales oraciones a la Santísima Virgen? (What are the main prayers to the Most Holy Virgin?)
  en: 'Las principales oraciones a la Santísima Virgen son: el Avemaría y la Salve. (The main prayers to the Most Holy Virgin
    are the Hail Mary and the Salve (Hail Holy Queen).)'
- es: ¿Es conveniente también hacer oración a los Ángeles y a los Santos? (Is it also fitting to pray to the Angels and Saints?)
  en: Es conveniente también hacer oración a los Ángeles y a los Santos para que intercedan por nosotros delante de Dios.
    (It is also fitting to pray to the Angels and Saints, so that they may intercede for us before God.)
- es: ¿Qué es sacramento? (What is a sacrament?)
  en: Sacramento es una acción exterior que significa y da la gracia. (A sacrament is an outward action that signifies and
    confers grace.)
- es: ¿Quién instituyó los sacramentos? (Who instituted the sacraments?)
  en: Los sacramentos los instituyó Jesucristo. (Jesus Christ instituted the sacraments.)
