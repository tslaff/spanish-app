id: catecismo_21
name: Catecismo 21
sentences:
- es: ¿Cómo hemos de amarnos a nosotros mismos? (How should we love ourselves?)
  en: Hemos de amarnos a nosotros mismos procurando los verdaderos bienes de alma y cuerpo en orden a la vida eterna. (We
    should love ourselves by seeking the true goods of soul and body, in view of eternal life.)
- es: ¿Quién es nuestro prójimo? (Who is our neighbor?)
  en: Nuestro prójimo son todos los hombres, aun nuestros enemigos. (Our neighbor is all mankind, even our enemies.)
- es: ¿Por qué debemos amar al prójimo? (Why must we love our neighbor?)
  en: Debemos amar al prójimo porque todos los hombres somos hermanos, hijos del mismo Padre celestial, redimidos con la sangre
    de Jesucristo y destinados al mismo cielo. (We must love our neighbor because all of us are brothers, children of the
    same heavenly Father, redeemed by the blood of Jesus Christ, and destined for the same heaven.)
- es: ¿Por qué debemos amar también a nuestros enemigos? (Why must we also love our enemies?)
  en: Debemos amar también a nuestros enemigos porque son hermanos nuestros y porque Jesucristo así nos lo mandó y nos lo
    enseñó con su ejemplo. (We must also love our enemies because they are our brothers, and because Jesus Christ commanded
    it and taught it to us by His example.)
- es: ¿Cómo se ejercita la caridad con el prójimo? (How is charity toward one's neighbor practiced?)
  en: La caridad con el prójimo se ejercita respetando sus derechos de justicia y practicando las obras de misericordia. (It
    is practiced by respecting his rights in justice and by practicing the works of mercy.)
- es: ¿Cuántas son las virtudes cardinales? (How many cardinal virtues are there?)
  en: 'Las virtudes cardinales son cuatro: prudencia, justicia, fortaleza y templanza. (There are four cardinal virtues: prudence,
    justice, fortitude, and temperance.)'
- es: ¿Por qué se llaman cardinales? (Why are they called cardinal?)
  en: Se llaman cardinales porque todas las demás virtudes se fundan y se integran en ellas. (They are called cardinal because
    all the other virtues are grounded in and built upon them.)
- es: ¿Qué es la virtud de la religión? (What is the virtue of religion?)
  en: La virtud de la religión es la que nos mueve a dar el culto debido a Dios por ser nuestro Creador y Señor. (The virtue
    of religion is that which moves us to give God the worship due to Him as our Creator and Lord.)
- es: ¿Cuáles son los principales actos del culto debido a Dios? (What are the principal acts of the worship due to God?)
  en: 'Los principales actos del culto debido a Dios son: la adoración, la oración y el sacrificio, practicados privada y
    públicamente. (The principal acts of the worship due to God are: adoration, prayer, and sacrifice, practiced both privately
    and publicly.)'
- es: ¿Cuáles son los principales pecados contra la religión? (What are the main sins against religion?)
  en: 'Los principales pecados contra la religión son: la idolatría, el sacrilegio y la superstición. (The main sins against
    religion are: idolatry, sacrilege, and superstition.)'
