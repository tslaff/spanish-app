id: catecismo_28
name: Catecismo 28
sentences:
- es: ¿Qué es la Eucaristía? (What is the Eucharist?)
  en: La Eucaristía es el sacramento del Cuerpo y Sangre de Jesucristo bajo las especies de pan y de vino. (The Eucharist
    is the sacrament of the Body and Blood of Jesus Christ under the appearances of bread and wine.)
- es: ¿Cuántas cosas hay que considerar en la Eucaristía? (How many things must be considered in the Eucharist?)
  en: 'En la Eucaristía hay que considerar tres cosas: que en la Eucaristía está real y verdaderamente Jesucristo; que en
    la Eucaristía se ofrece por nosotros Jesucristo en la santa Misa; y que en la Eucaristía recibimos a Jesucristo en la
    sagrada Comunión. (Three things: that Jesus Christ is really and truly present in the Eucharist; that in the Eucharist
    Jesus Christ is offered for us in the holy Mass; and that in the Eucharist we receive Jesus Christ in holy Communion.)'
- es: ¿Cuándo instituyó Jesucristo la Eucaristía? (When did Jesus Christ institute the Eucharist?)
  en: Jesucristo instituyó la Eucaristía el día de Jueves Santo, en la última Cena. (Jesus Christ instituted the Eucharist
    on Holy Thursday, at the Last Supper.)
- es: ¿Cuándo empieza Jesucristo a estar en la Eucaristía? (When does Jesus Christ begin to be present in the Eucharist?)
  en: Jesucristo empieza a estar en la Eucaristía en el momento de la consagración de la Misa. (At the moment of the consecration
    during Mass.)
- es: ¿Qué es la Hostia antes de la consagración? (What is the Host before the consecration?)
  en: La Hostia antes de la consagración es pan de trigo. (Before the consecration, the Host is wheat bread.)
- es: ¿Qué es la Hostia después de la consagración? (What is the Host after the consecration?)
  en: La Hostia después de la consagración es el Cuerpo de Jesucristo. (After the consecration, the Host is the Body of Jesus
    Christ.)
- es: ¿Qué hay en el cáliz antes de la consagración? (What is in the chalice before the consecration?)
  en: En el cáliz antes de la consagración hay vino con unas gotas de agua. (Before the consecration, the chalice contains
    wine with a few drops of water.)
- es: ¿Qué hay en el cáliz después de la consagración? (What is in the chalice after the consecration?)
  en: En el cáliz después de la consagración está la Sangre de Jesucristo. (After the consecration, the chalice contains the
    Blood of Jesus Christ.)
- es: ¿Cómo está Jesucristo en la Eucaristía? (How is Jesus Christ present in the Eucharist?)
  en: Jesucristo está todo entero en todas y cada una de las partes de la Eucaristía. (Jesus Christ is present, whole and
    entire, in each and every part of the Eucharist.)
- es: ¿Qué es la santa Misa? (What is the holy Mass?)
  en: La santa Misa es el sacrificio del Cuerpo y Sangre de Jesucristo, que se ofrece a Dios por ministerio del sacerdote
    en memoria y renovación del sacrificio de la Cruz. (The holy Mass is the sacrifice of the Body and Blood of Jesus Christ,
    offered to God through the ministry of the priest, in memory and renewal of the sacrifice of the Cross.)
