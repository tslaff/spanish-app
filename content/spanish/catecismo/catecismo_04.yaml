id: catecismo_04
name: Catecismo 04
sentences:
- es: ¿Las tres Personas de la Santísima Trinidad son tres dioses? (Are the three Persons of the Most Holy Trinity three gods?)
  en: Las tres Personas de la Santísima Trinidad no son tres dioses, sino un solo Dios, porque tienen una sola naturaleza
    divina. (The three Persons of the Most Holy Trinity are not three gods, but one true God, because they share a single
    divine nature.)
- es: ¿Por qué decimos que la Santísima Trinidad es un misterio? (Why do we say the Most Holy Trinity is a mystery?)
  en: Decimos que la Santísima Trinidad es un misterio, porque ninguna inteligencia creada puede entenderlo en este mundo.
    (We say the Most Holy Trinity is a mystery, because no created mind can fully understand it in this world.)
- es: ¿Entenderemos en el cielo el misterio de la Santísima Trinidad? (Will we understand the mystery of the Most Holy Trinity
    in heaven?)
  en: En el cielo entenderemos el misterio de la Santísima Trinidad, como ya lo entienden los Ángeles y los Santos. (In heaven
    we will understand the mystery of the Most Holy Trinity, as the Angels and Saints already do.)
- es: ¿Por qué decimos que Dios es todopoderoso? (Why do we say God is almighty?)
  en: Decimos que Dios es todopoderoso, porque con su poder hace todo cuanto quiere. (We say God is almighty, because with
    His power He does everything He wills.)
- es: ¿Por qué decimos que Dios es creador? (Why do we say God is the Creator?)
  en: Decimos que Dios es creador, porque todas las cosas las hizo de la nada. (We say God is the Creator, because He made
    all things out of nothing.)
- es: ¿Por qué decimos que Dios es Señor de todas las cosas? (Why do we say God is Lord of all things?)
  en: Decimos que Dios es Señor de todas las cosas, porque todas le pertenecen y las gobierna y cuida de ellas con sabiduría
    y bondad. (We say God is Lord of all things, because they all belong to Him and He governs and cares for them with wisdom
    and goodness.)
- es: ¿Qué es la Providencia de Dios? (What is the Providence of God?)
  en: La Providencia de Dios es el cuidado amoroso con que Dios conserva y gobierna las cosas y especialmente a los hombres.
    (The Providence of God is the loving care with which God preserves and governs all things, and especially mankind.)
- es: ¿Cuáles son los seres más perfectos de la creación? (Which are the most perfect beings of creation?)
  en: Los seres más perfectos de la creación son los Ángeles y los hombres. (The most perfect beings of creation are the Angels
    and men.)
- es: ¿Qué son los Ángeles? (What are the Angels?)
  en: Los Ángeles son espíritus puros, esto es, sin cuerpo, que tienen entendimiento y voluntad. (The Angels are pure spirits,
    that is, without bodies, possessing intellect and will.)
- es: ¿Para qué ha creado Dios a los Ángeles? (Why did God create the Angels?)
  en: Dios ha creado a los Ángeles para que le alaben, obedezcan y sean felices en el cielo. (God created the Angels so that
    they might praise and obey Him and be happy in heaven.)
