id: catecismo_01
name: Catecismo 01
sentences:
- es: ¿Eres cristiano? (Are you a Christian?)
  en: Soy cristiano por la gracia de Dios. (I am a Christian by the grace of God.)
- es: ¿Qué es ser cristiano? (What does it mean to be a Christian?)
  en: Ser cristiano es ser discípulo de Cristo. (To be a Christian is to be a disciple of Christ.)
- es: ¿Cómo nos hacernos cristianos? (How do we become Christians?)
  en: Nos hacemos cristianos por el santo Bautismo. (We become Christians through holy Baptism.)
- es: ¿Quién es buen cristiano? (Who is a good Christian?)
  en: Buen cristiano es el discípulo de Cristo, que cree su doctrina y la practica. (A good Christian is a disciple of Christ
    who believes his doctrine and practices it.)
- es: ¿Por qué nos llamamos también católicos? (Why are we also called Catholics?)
  en: Nos llamamos también católicos porque somos hijos de la Iglesia Católica. (We are also called Catholics because we are
    children of the Catholic Church.)
- es: ¿Cuál es la señal del cristiano? (What is the sign of the Christian?)
  en: La señal del cristiano es la santa Cruz. (The sign of the Christian is the holy Cross.)
- es: ¿Por qué la señal del cristiano es la santa Cruz? (Why is the sign of the Christian the holy Cross?)
  en: La señal del cristiano es la santa Cruz porque en ella murió Jesucristo Nuestro Señor para redimir a todos los hombres.
    (The sign of the Christian is the holy Cross because on it Jesus Christ our Lord died to redeem all men.)
- es: ¿Para qué hacemos la señal de la Cruz? (Why do we make the Sign of the Cross?)
  en: Hacemos la señal de la Cruz para manifestar que somos cristianos, y para pedir a Jesucristo que nos ayude a ser buenos
    y nos libre de peligros. (We make the Sign of the Cross to show that we are Christians, and to ask Jesus Christ to help
    us be good and free us from dangers.)
- es: ¿De cuántas maneras usa el cristiano la señal de la Cruz? (In how many ways does the Christian use the Sign of the Cross?)
  en: 'El cristiano usa la señal de la Cruz de dos maneras, que son: signarse y santiguarse. (The Christian uses the Sign
    of the Cross in two ways: signing oneself and blessing oneself.)'
- es: ¿Qué es signarse? (What is signing oneself?)
  en: 'Signarse es hacer tres cruces con el dedo pulgar de la mano derecha: la primera en la frente, diciendo: Por la señal
    de la santa Cruz; la segunda en la boca, diciendo: de nuestros enemigos; y la tercera en el pecho, diciendo: líbranos,
    Señor, Dios nuestro. (Signing oneself is making three small crosses with the thumb of the right hand: the first on the
    forehead, saying: By the sign of the holy Cross; the second on the mouth, saying: from our enemies; and the third on the
    chest, saying: deliver us, Lord, our God.)'
- es: ¿Qué es santiguarse? (What is blessing oneself?)
  en: 'Santiguarse es hacer una cruz con la mano derecha desde la frente al pecho, y desde el hombro izquierdo al derecho,
    diciendo: En el nombre del Padre, y del Hijo, y del Espíritu Santo. Amén. (Blessing oneself is making a cross with the
    right hand from the forehead to the chest, and from the left shoulder to the right, saying: In the name of the Father,
    and of the Son, and of the Holy Spirit. Amen.)'
