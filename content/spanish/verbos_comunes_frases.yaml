  en: When we lived together, she used to bring food on Fridays.
- es: Creo que esta noche hará frío, así que llevaré una chaqueta.
  en: I think it will be cold tonight, so I will take a jacket.
- es: No he hecho la compra todavía; la haré después de trabajar.
  en: I haven’t done the shopping yet; I will do it after work.
- es: Tenía mucha hambre porque no había comido desde el desayuno.
  en: I was very hungry because I had not eaten since breakfast.
