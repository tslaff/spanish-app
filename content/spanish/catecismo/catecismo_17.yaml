id: catecismo_17
name: Catecismo 17
sentences:
- es: ¿Cuándo son pecado los pensamientos y deseos impuros? (When are impure thoughts and desires sinful?)
  en: Los pensamientos y deseos impuros son pecado cuando la voluntad se complace en ellos; pero no son pecado si la voluntad
    no los consiente y procura rechazarlos. (They are sinful when the will takes pleasure in them; but they are not sinful
    if the will does not consent to them and tries to reject them.)
- es: ¿Cuál es el décimo mandamiento de la Ley de Dios? (What is the tenth commandment of the Law of God?)
  en: 'El décimo mandamiento de la Ley de Dios es: no codiciarás los bienes ajenos. (The tenth commandment of the Law of God
    is: you shall not covet your neighbor''s goods.)'
- es: ¿Qué nos manda el décimo mandamiento? (What does the tenth commandment command us?)
  en: El décimo mandamiento nos manda conformarnos con los bienes que Dios nos ha dado y con los que honradamente podamos
    adquirir. (The tenth commandment commands us to be content with the goods God has given us and with those we can honestly
    acquire.)
- es: ¿Qué prohíbe el décimo mandamiento? (What does the tenth commandment forbid?)
  en: El décimo mandamiento prohíbe el deseo desordenado de riquezas y la envidia de los bienes ajenos. (The tenth commandment
    forbids the disordered desire for wealth and envy of another's goods.)
- es: ¿Es lícito aspirar dentro de la justicia a una mejor distribución de bienes? (Is it lawful to strive, within justice,
    for a better distribution of goods?)
  en: Es lícito aspirar dentro de la justicia a una mejor distribución de bienes, en conformidad con el destino que Dios les
    ha dado y con las exigencias del bien común. (It is lawful to strive, within justice, for a better distribution of goods,
    in accordance with the purpose God has given them and the demands of the common good.)
- es: ¿Qué poder dio Jesucristo a su Iglesia? (What power did Jesus Christ give His Church?)
  en: Jesucristo dio a su Iglesia el poder de enseñar, de santificar y de gobernar a los fieles en orden a la vida eterna.
    (Jesus Christ gave His Church the power to teach, to sanctify, and to govern the faithful for the sake of eternal life.)
- es: ¿Estamos obligados los cristianos a cumplir los mandamientos de la Iglesia? (Are Christians obliged to keep the commandments
    of the Church?)
  en: Los cristianos estamos obligados a cumplir los mandamientos de la Iglesia, porque la Iglesia manda con autoridad recibida
    de Jesucristo. (We Christians are obliged to keep the commandments of the Church, because the Church commands with authority
    received from Jesus Christ.)
- es: ¿Cuál es el primer mandamiento de la santa Madre Iglesia? (What is the first commandment of holy Mother Church?)
  en: 'El primer mandamiento de la santa Madre Iglesia es: oír Misa entera todos los domingos y fiestas de guardar. (The first
    commandment of holy Mother Church is: to hear Mass in its entirety every Sunday and holy day of obligation.)'
- es: ¿Quién oye Misa entera? (Who hears Mass in its entirety?)
  en: Oye Misa entera quien asiste a toda ella con la debida atención. (He who attends the whole of it with due attention
    hears Mass in its entirety.)
- es: ¿Quiénes están obligados a oír Misa los domingos y fiestas de guardar? (Who is obliged to hear Mass on Sundays and holy
    days of obligation?)
  en: Están obligados a oír Misa los domingos y fiestas de guardar todos los cristianos que han cumplido siete años y tienen
    uso de razón. (All Christians who have completed seven years of age and have the use of reason are obliged to hear Mass
    on Sundays and holy days of obligation.)
