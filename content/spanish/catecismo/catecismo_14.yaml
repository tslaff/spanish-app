id: catecismo_14
name: Catecismo 14
sentences:
- es: ¿A quiénes más debemos honrar? (Whom else must we honor?)
  en: Debemos también honrar a los mayores en edad, dignidad y gobierno. (We must also honor those greater in age, dignity,
    and authority.)
- es: ¿Cuáles son los deberes de los padres? (What are the duties of parents?)
  en: 'Los deberes de los padres son: amar, sustentar y educar cristianamente a sus hijos. (The duties of parents are: to
    love, support, and educate their children in a Christian manner.)'
- es: ¿Cuáles son los deberes de los esposos entre sí? (What are the mutual duties of spouses?)
  en: 'Los deberes de los esposos entre sí son: amarse, ayudarse y guardarse fidelidad. (The mutual duties of spouses are:
    to love one another, help one another, and keep faith with one another.)'
- es: ¿Cuáles son nuestros deberes para con la Patria? (What are our duties toward our homeland?)
  en: 'Nuestros deberes para con la Patria son: amarla, defenderla, cumplir sus leyes y contribuir al bien común. (Our duties
    toward our homeland are: to love it, defend it, obey its laws, and contribute to the common good.)'
- es: ¿Cuál es el quinto mandamiento de la Ley de Dios? (What is the fifth commandment of the Law of God?)
  en: 'El quinto mandamiento de la Ley de Dios es: no matarás. (The fifth commandment of the Law of God is: you shall not
    kill.)'
- es: ¿Qué nos manda el quinto mandamiento de la Ley de Dios? (What does the fifth commandment command us?)
  en: El quinto mandamiento de la Ley de Dios nos manda querer bien a todos y perdonar a nuestros enemigos. (The fifth commandment
    commands us to wish everyone well and to forgive our enemies.)
- es: ¿Qué prohíbe el quinto mandamiento de la Ley de Dios? (What does the fifth commandment forbid?)
  en: El quinto mandamiento de la Ley de Dios prohíbe hacer daño a la propia vida o a la de otros con palabras, obras o deseos.
    (The fifth commandment forbids doing harm to one's own life or to that of others, in word, deed, or desire.)
- es: ¿Quién peca contra sí mismo en el quinto mandamiento de la Ley de Dios? (Who sins against himself in the fifth commandment?)
  en: Peca contra sí mismo en el quinto mandamiento de la Ley de Dios el que se quita la vida, o se mutila, la pone en peligro
    sin necesidad, se embriaga, y por desesperación se desea la muerte. (He who takes his own life, or mutilates himself,
    or needlessly puts himself in danger, or gets drunk, or out of despair wishes for death, sins against himself.)
- es: ¿Quién peca contra el prójimo en el quinto mandamiento de la Ley de Dios? (Who sins against his neighbor in the fifth
    commandment?)
  en: Peca contra el prójimo en el quinto mandamiento de la Ley de Dios el que le da la muerte o le hiere, el que le odia
    o está enemistado con él, el que le desea mal o le insulta, y el que le escandaliza. (He who kills or wounds his neighbor,
    who hates him or is at enmity with him, who wishes him harm or insults him, and who scandalizes him, sins against his
    neighbor.)
- es: ¿Qué es escándalo? (What is scandal?)
  en: Escándalo es toda palabra, obra u omisión que incita a otros a caer en pecado. (Scandal is any word, deed, or omission
    that leads others to fall into sin.)
