id: catecismo_26
name: Catecismo 26
sentences:
- es: ¿Qué es la Confirmación? (What is Confirmation?)
  en: La Confirmación es el sacramento que nos aumenta la gracia del Espíritu Santo, para fortalecernos en la fe y hacernos
    soldados y apóstoles de Cristo. (Confirmation is the sacrament that increases in us the grace of the Holy Spirit, to strengthen
    us in the faith and make us soldiers and apostles of Christ.)
- es: ¿Cómo se debe recibir la Confirmación? (How should Confirmation be received?)
  en: La Confirmación se debe recibir en estado de gracia, y conociendo las principales verdades cristianas. (Confirmation
    should be received in a state of grace, and while knowing the main Christian truths.)
- es: ¿Quién es el ministro de la Confirmación? (Who is the minister of Confirmation?)
  en: El ministro ordinario de la Confirmación es el Obispo, pero en caso de peligro de muerte, en ausencia del Obispo, puede
    confirmar el párroco. (The ordinary minister of Confirmation is the Bishop, but in danger of death, in the Bishop's absence,
    the parish priest may confirm.)
- es: ¿Qué es la Penitencia? (What is Penance?)
  en: La Penitencia es el sacramento que perdona los pecados cometidos después del Bautismo. (Penance is the sacrament that
    forgives sins committed after Baptism.)
- es: ¿Cuándo recibimos el sacramento de la Penitencia? (When do we receive the sacrament of Penance?)
  en: Recibimos el sacramento de la Penitencia cuando nos confesamos bien y recibimos la absolución. (We receive it when we
    make a good confession and receive absolution.)
- es: ¿Cuántas cosas son necesarias para confesarnos bien? (How many things are necessary to make a good confession?)
  en: 'Para confesarnos bien son necesarias cinco cosas: examen de conciencia, dolor de los pecados, propósito de la enmienda,
    decir los pecados al confesor y cumplir la penitencia. (Five things are necessary: examination of conscience, sorrow for
    one''s sins, purpose of amendment, telling one''s sins to the confessor, and fulfilling the penance.)'
- es: ¿Qué es examen de conciencia? (What is examination of conscience?)
  en: Examen de conciencia es recordar todos los pecados cometidos desde la última confesión bien hecha. (Examination of conscience
    is recalling all the sins committed since one's last good confession.)
- es: ¿Qué es dolor de los pecados? (What is sorrow for sin?)
  en: Dolor de los pecados es un sentimiento o pena de haber ofendido a Dios por ser infinitamente bueno, o porque nos puede
    castigar, o por la fealdad del pecado. (Sorrow for sin is a feeling of grief for having offended God, whether because
    He is infinitely good, or because He can punish us, or because of the ugliness of sin.)
- es: ¿De cuántas maneras es el dolor de los pecados? (In how many ways can sorrow for sin be?)
  en: 'El dolor de los pecados es de dos maneras: dolor de contrición y dolor de atrición. (Sorrow for sin can be of two kinds:
    sorrow of contrition and sorrow of attrition.)'
- es: ¿Qué es dolor de contrición? (What is sorrow of contrition?)
  en: Dolor de contrición es un sentimiento o pena de haber ofendido a Dios por ser Él quien es, Bondad infinita, digno de
    ser amado sobre todas las cosas. (Sorrow of contrition is a feeling of grief for having offended God because of who He
    is, infinite Goodness, worthy of being loved above all things.)
