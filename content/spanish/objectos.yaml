id: pronombres_objeto
name: "Pronombres de objeto directo e indirecto (A2/B1)"

cards:
  # Objeto directo: ¿qué? / ¿a quién? (recibe directamente la acción)
  - front: "Direct object: him / it (masculine singular)"
    back: "lo"
  - front: "Direct object: her / it (feminine singular)"
    back: "la"
  - front: "Direct object: them (masculine or mixed plural)"
    back: "los"
  - front: "Direct object: them (feminine plural)"
    back: "las"
  - front: "Direct object: me"
    back: "me"
  - front: "Direct object: you (informal singular)"
    back: "te"
  - front: "Direct object: us"
    back: "nos"
  - front: "Direct object: you all (vosotros)"
    back: "os"
  - front: "I see it (the book)."
    back: "Lo veo."
  - front: "I bought them (the tickets)."
    back: "Las compré."
  - front: "I know her."
    back: "La conozco."
  - front: "I saw you yesterday. (tú)"
    back: "Te vi ayer."

  # Objeto indirecto: ¿a quién? / ¿para quién?
  - front: "Indirect object: to me"
    back: "me"
  - front: "Indirect object: to you (tú)"
    back: "te"
  - front: "Indirect object: to him / to her"
    back: "le"
  - front: "Indirect object: to us"
    back: "nos"
  - front: "Indirect object: to you all (vosotros)"
    back: "os"
  - front: "Indirect object: to them"
    back: "les"
  - front: "I told her the truth."
    back: "Le dije la verdad."
  - front: "He sent me a message."
    back: "Me mandó un mensaje."
  - front: "We gave them a present."
    back: "Les dimos un regalo."
  - front: "I'll call you later. (tú)"
    back: "Te llamaré luego."

  # Mezcla: indirecto + directo
  - front: "Order when using two object pronouns"
    back: "Indirect + direct: me lo, te la, se los..."
  - front: "What happens to le/les before lo/la/los/las?"
    back: "le/les → se (e.g., se lo)"
  - front: "I gave it to her. (el libro)"
    back: "Se lo di."
  - front: "He told me about it. (la noticia)"
    back: "Me la contó."
  - front: "We sent them to him. (los documentos)"
    back: "Se los mandamos."
  - front: "I'll bring it to you. (el café, tú)"
    back: "Te lo traeré."
  - front: "I haven't shown them to her. (las fotos)"
    back: "No se las he enseñado."
  - front: "I want to give it to you. (el regalo, tú)"
    back: "Te lo quiero dar. / Quiero dártelo."

sentences:
  # Directos
  - es: "Lo vi ayer en el supermercado."
    en: "I saw him yesterday at the supermarket."
  - es: "La compré esta mañana."
    en: "I bought it (the jacket) this morning."
  - es: "¿Has visto mis llaves? No las encuentro."
    en: "Have you seen my keys? I can't find them."
  - es: "Los conocimos durante el viaje."
    en: "We met them during the trip."
  - es: "¿Me escuchas bien?"
    en: "Can you hear me well?"
  - es: "Te llamaré mañana."
    en: "I'll call you tomorrow."
  - es: "Nos invitaron a cenar."
    en: "They invited us to dinner."
  - es: "Os vimos en el parque."
    en: "We saw you all in the park."

  # Indirectos
  - es: "Le dije la verdad a mi hermana."
    en: "I told my sister the truth."
  - es: "Mi amigo me trajo un café."
    en: "My friend brought me a coffee."
  - es: "Les escribimos un correo a los clientes."
    en: "We wrote the clients an email."
  - es: "¿Te puedo hacer una pregunta?"
    en: "Can I ask you a question?"
  - es: "Nos dieron buenas noticias."
    en: "They gave us good news."
  - es: "Os mandaré los detalles mañana."
    en: "I'll send you all the details tomorrow."
  - es: "Le compré un regalo a mi novia."
    en: "I bought my fiancée a present."
  - es: "Les conté lo que pasó."
    en: "I told them what happened."

  # Mixtos: ambos pronombres juntos
  - es: "Se lo dije ayer."
    en: "I told him/her/them about it (masculine) yesterday."
  - es: "Te la traeré mañana."
    en: "I'll bring it (feminine) to you tomorrow."
  - es: "Me los enviaron por correo."
    en: "They sent them (masculine) to me by mail."
  - es: "Se las hemos enseñado."
    en: "We've shown them (feminine) to him/her/them."
  - es: "No se lo quiero decir."
    en: "I don't want to tell him/her/them."
  - es: "¿Puedes pasármelo, por favor?"
    en: "Can you pass it (masculine) to me, please?"
  - es: "Se lo voy a explicar después de la reunión."
    en: "I'm going to explain it to him/her/them after the meeting."
  - es: "Mi madre me la compró cuando era pequeño."
    en: "My mother bought it (feminine) for me when I was little."
