id: catecismo_12
name: Catecismo 12
sentences:
- es: ¿Quién es nuestro modelo en el cumplimiento de la Ley de Dios? (Who is our model in fulfilling the Law of God?)
  en: Nuestro modelo en el cumplimiento de la Ley de Dios es Jesucristo, que vino al mundo para hacer siempre la voluntad
    del Padre celestial. (Our model in fulfilling the Law of God is Jesus Christ, who came into the world to always do the
    will of the heavenly Father.)
- es: ¿Cuál es el primer mandamiento de la Ley de Dios? (What is the first commandment of the Law of God?)
  en: 'El primer mandamiento de la Ley de Dios es: amarás a Dios sobre todas las cosas. (The first commandment of the Law
    of God is: you shall love God above all things.)'
- es: ¿Qué deberes comprende el primer mandamiento de la Ley de Dios? (What duties does the first commandment include?)
  en: El primer mandamiento de la Ley de Dios comprende los deberes de creer en Dios, esperar en Él, amarle sobre todas las
    cosas, y tributarle el honor debido. (The first commandment includes the duties of believing in God, hoping in Him, loving
    Him above all things, and giving Him the honor due to Him.)
- es: ¿Quién ama a Dios sobre todas las cosas? (Who loves God above all things?)
  en: Ama a Dios sobre todas las cosas el que cumple todos sus mandamientos. (He who keeps all His commandments loves God
    above all things.)
- es: ¿Quién tributa a Dios el honor debido? (Who gives God the honor due to Him?)
  en: Tributa a Dios el honor debido el que le reconoce como único y verdadero Dios, y le adora con suma reverencia de alma
    y cuerpo. (He who acknowledges God as the one true God, and adores Him with the utmost reverence of soul and body, gives
    Him the honor due to Him.)
- es: ¿Qué honor debemos tributar a Jesucristo? (What honor must we give to Jesus Christ?)
  en: A Jesucristo debemos tributar honor y culto de adoración, por ser el Hijo de Dios hecho hombre. (We must give Jesus
    Christ honor and worship of adoration, since He is the Son of God made man.)
- es: ¿Qué honor debemos tributar a la Virgen María? (What honor must we give to the Virgin Mary?)
  en: A la Virgen María debemos tributar honor y culto de veneración especialísima, por ser la Madre de Dios. (We must give
    the Virgin Mary honor and worship of especially high veneration, since she is the Mother of God.)
- es: ¿A quiénes más debemos tributar culto? (Whom else must we venerate?)
  en: Debemos también tributar culto de veneración a los Ángeles y a los Santos, porque ya viven con Dios eternamente felices
    en el cielo. (We must also give worship of veneration to the Angels and the Saints, because they already live eternally
    happy with God in heaven.)
- es: ¿Cuál es el segundo mandamiento de la Ley de Dios? (What is the second commandment of the Law of God?)
  en: 'El segundo mandamiento de la Ley de Dios es: no tomarás el nombre de Dios en vano. (The second commandment of the Law
    of God is: you shall not take the name of God in vain.)'
- es: ¿Quién toma el nombre de Dios en vano? (Who takes the name of God in vain?)
  en: Toma el nombre de Dios en vano quien blasfema o lo usa sin el debido respeto. (He who blasphemes or uses it without
    due respect takes the name of God in vain.)
