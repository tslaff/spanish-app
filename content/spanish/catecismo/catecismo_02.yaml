id: catecismo_02
name: Catecismo 02
sentences:
- es: ¿Cuándo conviene hacer la señal de la Cruz? (When is it fitting to make the Sign of the Cross?)
  en: Conviene hacer la señal de la Cruz principalmente al levantarnos, al salir de casa, al entrar en la Iglesia, al empezar
    el trabajo, antes de comer, al acostarnos y, sobre todo, al vernos en alguna necesidad, tentación o peligro. (It is fitting
    to make the Sign of the Cross especially on waking, on leaving the house, on entering the Church, on beginning work, before
    eating, on going to bed, and above all when facing any need, temptation, or danger.)
- es: ¿Qué debe saber el cristiano? (What must a Christian know?)
  en: El cristiano debe saber la doctrina cristiana. (A Christian must know Christian doctrine.)
- es: ¿Qué es la doctrina cristiana? (What is Christian doctrine?)
  en: La doctrina cristiana es la que predicó Nuestro Señor Jesucristo para enseñarnos el camino del cielo. (Christian doctrine
    is what our Lord Jesus Christ preached to teach us the way to heaven.)
- es: ¿Cuáles son las partes principales de la doctrina cristiana? (What are the main parts of Christian doctrine?)
  en: 'Las partes principales de la doctrina cristiana son tres: las verdades, que debemos creer; los mandamientos, que debemos
    cumplir; y los medios que debemos emplear para santificarnos, que son la oración y los sacramentos. (The main parts of
    Christian doctrine are three: the truths we must believe; the commandments we must fulfill; and the means we must use
    to sanctify ourselves, which are prayer and the sacraments.)'
- es: ¿Qué es el Catecismo? (What is the Catechism?)
  en: El Catecismo es el resumen de la doctrina enseñada por Jesucristo, que todo cristiano debe saber y practicar. (The Catechism
    is the summary of the doctrine taught by Jesus Christ, which every Christian must know and practice.)
- es: ¿Qué verdades debemos creer? (What truths must we believe?)
  en: Debemos creer las verdades que Dios ha revelado y la Iglesia nos enseña. (We must believe the truths that God has revealed
    and that the Church teaches us.)
- es: ¿Dónde se contienen las principales verdades que debemos creer? (Where are the main truths we must believe contained?)
  en: Las principales verdades que debemos creer se contienen en el Credo. (The main truths we must believe are contained
    in the Creed.)
- es: ¿Qué quiere decir la palabra «Creo»? (What does the word "I believe" mean?)
  en: 'La palabra «Creo» quiere decir: acepto firmemente las verdades reveladas por Dios, que no puede ni engañarse ni engañarnos.
    (The word "I believe" means: I firmly accept the truths revealed by God, who can neither deceive nor be deceived.)'
- es: ¿Quién es Dios? (Who is God?)
  en: Dios es nuestro Padre, que está en los cielos; Creador y Señor de todas las cosas, que premia a los buenos y castiga
    a los malos. (God is our Father, who is in heaven; Creator and Lord of all things, who rewards the good and punishes the
    wicked.)
- es: ¿Cómo es Dios? (What is God like?)
  en: Dios es espíritu purísimo, infinitamente perfecto, bueno, sabio, poderoso y eterno, principio y fin de todas las cosas.
    (God is a most pure spirit, infinitely perfect, good, wise, powerful, and eternal, the beginning and end of all things.)
