id: catecismo_19
name: Catecismo 19
sentences:
- es: ¿A quiénes obliga la ley del ayuno y de la abstinencia? (Whom does the law of fasting and abstinence bind?)
  en: La ley del ayuno obliga a los que han cumplido veintiún años y no han llegado a los sesenta; la ley de la abstinencia
    obliga a los que han cumplido siete años. (The law of fasting binds those who have completed twenty-one years of age and
    have not yet reached sixty; the law of abstinence binds those who have completed seven years of age.)
- es: ¿Qué es la Bula de la santa Cruzada? (What is the Bull of the Holy Crusade?)
  en: La Bula de la santa Cruzada es un privilegio pontificio, que concede a los españoles gracias especiales, y les dispensa
    del ayuno y de la abstinencia en ciertos días. (The Bull of the Holy Crusade is a pontifical privilege that grants Spaniards
    special favors and dispenses them from fasting and abstinence on certain days.)
- es: ¿Cuál es el quinto mandamiento de la santa Madre Iglesia? (What is the fifth commandment of holy Mother Church?)
  en: 'El quinto mandamiento de la santa Madre Iglesia es: ayudar a la Iglesia en sus necesidades. (The fifth commandment
    of holy Mother Church is: to help support the Church in her needs.)'
- es: ¿Cuáles son las principales necesidades de la Iglesia? (What are the main needs of the Church?)
  en: 'Las principales necesidades de la Iglesia son: el sostenimiento del culto y sus ministros, el Seminario, las Misiones
    y las obras católicas. (The main needs of the Church are: the support of worship and its ministers, the Seminary, the
    Missions, and Catholic works.)'
- es: ¿Qué es virtud? (What is virtue?)
  en: Virtud es una disposición permanente del alma para obrar el bien. (Virtue is a lasting disposition of the soul to do
    good.)
- es: ¿Cuántas clases hay de virtudes? (How many kinds of virtues are there?)
  en: 'Hay dos clases de virtudes: teologales y cardinales. (There are two kinds of virtues: theological and cardinal.)'
- es: ¿Cuántas son las virtudes teologales? (How many theological virtues are there?)
  en: 'Las virtudes teologales son tres: fe, esperanza y caridad. (There are three theological virtues: faith, hope, and charity.)'
- es: ¿Por qué se llaman teologales? (Why are they called theological?)
  en: Se llaman teologales porque tienen a Dios por objeto inmediato, y Él nos las da con su gracia para ganar el cielo. (They
    are called theological because they have God as their immediate object, and He gives them to us with His grace so that
    we may gain heaven.)
- es: ¿Qué es fe? (What is faith?)
  en: Fe es una virtud sobrenatural por la que creemos firmemente lo que Dios ha revelado y la Iglesia nos enseña. (Faith
    is a supernatural virtue by which we firmly believe what God has revealed and the Church teaches us.)
- es: ¿Qué verdades de fe es necesario creer para salvarnos? (What truths of faith must we believe in order to be saved?)
  en: Para salvarnos es necesario creer en la existencia de Dios, el misterio de la Santísima Trinidad, la Encarnación del
    Hijo de Dios y la vida eterna. (It is necessary to believe in the existence of God, the mystery of the Most Holy Trinity,
    the Incarnation of the Son of God, and life everlasting.)
