id: catecismo_09
name: Catecismo 09
sentences:
- es: ¿Cuándo envió Jesucristo el Espíritu Santo? (When did Jesus Christ send the Holy Spirit?)
  en: Jesucristo envió el Espíritu Santo a su Iglesia el día de Pentecostés, diez días después de su ascensión a los cielos.
    (Jesus Christ sent the Holy Spirit to His Church on the day of Pentecost, ten days after His ascension into heaven.)
- es: ¿Para qué envió Jesucristo el Espíritu Santo? (Why did Jesus Christ send the Holy Spirit?)
  en: Jesucristo envió el Espíritu Santo para santificar nuestras almas y asistir a su Santa Iglesia. (Jesus Christ sent the
    Holy Spirit to sanctify our souls and to assist His holy Church.)
- es: ¿Cómo nos santifica el Espíritu Santo? (How does the Holy Spirit sanctify us?)
  en: El Espíritu Santo nos santifica por medio de la gracia, de las virtudes y de sus dones. (The Holy Spirit sanctifies
    us through grace, the virtues, and His gifts.)
- es: ¿Qué es la santa Iglesia? (What is the holy Church?)
  en: La santa Iglesia es la congregación de los fieles cristianos, fundada por Jesucristo, y cuya cabeza visible es el Papa.
    (The holy Church is the congregation of the Christian faithful, founded by Jesus Christ, whose visible head is the Pope.)
- es: ¿Cómo asiste el Espíritu Santo a la Iglesia? (How does the Holy Spirit assist the Church?)
  en: El Espíritu Santo asiste a la Iglesia iluminándola para que enseñe la verdad cristiana sin error, dirigiéndola en su
    gobierno y conservándola hasta el fin del mundo. (The Holy Spirit assists the Church by enlightening her to teach Christian
    truth without error, guiding her in her governance, and preserving her until the end of the world.)
- es: ¿Quién es el Papa? (Who is the Pope?)
  en: El Papa o Romano Pontífice es el Vicario de Cristo en la tierra, que hace sus veces en el gobierno de la Iglesia. (The
    Pope, or Roman Pontiff, is the Vicar of Christ on earth, who acts in His place in the governance of the Church.)
- es: ¿Estamos obligados a obedecer al Papa? (Are we obliged to obey the Pope?)
  en: Estamos obligados a obedecer al Papa porque es el Padre y Pastor supremo de toda la Iglesia. (We are obliged to obey
    the Pope because he is the supreme Father and Pastor of the whole Church.)
- es: ¿Puede equivocarse el Papa? (Can the Pope err?)
  en: El Papa no puede equivocarse cuando define doctrinas de fe y de moral como Maestro supremo de toda la Iglesia. (The
    Pope cannot err when he defines doctrines of faith and morals as the supreme Teacher of the whole Church.)
- es: ¿Quiénes son los Obispos? (Who are the Bishops?)
  en: Los Obispos son los sucesores de los Apóstoles, puestos por el Espíritu Santo para regir sus diócesis bajo la autoridad
    del Papa. (The Bishops are the successors of the Apostles, placed by the Holy Spirit to govern their dioceses under the
    authority of the Pope.)
- es: ¿Jesucristo ha fundado más de una Iglesia? (Has Jesus Christ founded more than one Church?)
  en: Jesucristo no ha fundado más que una sola Iglesia. (Jesus Christ has founded only one Church.)
