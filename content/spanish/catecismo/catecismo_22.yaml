id: catecismo_22
name: Catecismo 22
sentences:
- es: ¿Es pecado no tener ninguna religión? (Is it a sin to have no religion at all?)
  en: No tener ninguna religión es pecado gravísimo, porque es despreciar a Dios. (To have no religion at all is a most grave
    sin, because it is to despise God.)
- es: ¿Qué son los dones del Espíritu Santo? (What are the gifts of the Holy Spirit?)
  en: Los dones del Espíritu Santo son perfecciones sobrenaturales, que Dios nos concede para obedecer dócilmente sus inspiraciones,
    y facilitarnos el ejercicio de las virtudes. (The gifts of the Holy Spirit are supernatural perfections that God grants
    us so that we may docilely obey His inspirations, and which make the practice of the virtues easier for us.)
- es: ¿Cuáles son los dones del Espíritu Santo? (What are the gifts of the Holy Spirit?)
  en: 'Los dones del Espíritu Santo son siete: sabiduría, entendimiento, consejo, fortaleza, ciencia, piedad y temor de Dios.
    (The gifts of the Holy Spirit are seven: wisdom, understanding, counsel, fortitude, knowledge, piety, and fear of the
    Lord.)'
- es: ¿A quiénes llama Jesucristo bienaventurados? (Whom does Jesus Christ call blessed?)
  en: Jesucristo llama bienaventurados a los cristianos que le imitan en el desprendimiento de los bienes de este mundo y
    en la estima de los bienes espirituales. (Jesus Christ calls blessed those Christians who imitate Him in detachment from
    the goods of this world and in esteem for spiritual goods.)
- es: ¿Cuántas son las bienaventuranzas? (How many beatitudes are there?)
  en: 'Las bienaventuranzas son ocho: los pobres de espíritu, los mansos, los que lloran, los que tienen hambre y sed de justicia,
    los misericordiosos, los limpios de corazón, los pacíficos, y los que padecen persecución a causa de la justicia. (There
    are eight beatitudes: the poor in spirit, the meek, those who mourn, those who hunger and thirst for justice, the merciful,
    the pure of heart, the peacemakers, and those who suffer persecution for the sake of justice.)'
- es: ¿Qué es pecado? (What is sin?)
  en: Pecado es toda acción u omisión voluntaria contra la Ley de Dios. (Sin is any voluntary act or omission contrary to
    the Law of God.)
- es: ¿De qué maneras se comete el pecado? (In what ways is sin committed?)
  en: El pecado se comete por pensamiento, deseo, palabra, obra y omisión. (Sin is committed by thought, desire, word, deed,
    and omission.)
- es: ¿Cómo puede ser el pecado? (How can sin be?)
  en: El pecado puede ser mortal y venial. (Sin can be mortal or venial.)
- es: ¿Qué es pecado mortal? (What is mortal sin?)
  en: Pecado mortal es una desobediencia voluntaria a la Ley de Dios en materia grave, con plena advertencia y perfecto consentimiento.
    (Mortal sin is a voluntary disobedience to the Law of God in a grave matter, with full knowledge and complete consent.)
- es: ¿Por qué se llama pecado mortal? (Why is it called mortal sin?)
  en: Se llama pecado mortal porque priva al alma de la vida de la gracia y la hace merecedora de las penas del infierno.
    (It is called mortal sin because it deprives the soul of the life of grace and makes it deserving of the punishments of
    hell.)
- es: ¿Qué es pecado venial? (What is venial sin?)
  en: Pecado venial es una desobediencia voluntaria a la Ley de Dios en materia leve, o en materia grave sin plena advertencia
    o sin perfecto consentimiento. (Venial sin is a voluntary disobedience to the Law of God in a slight matter, or in a grave
    matter without full knowledge or without complete consent.)
