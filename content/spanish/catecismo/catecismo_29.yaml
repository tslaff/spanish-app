id: catecismo_29
name: Catecismo 29
sentences:
- es: ¿Por qué decimos que la santa Misa es sacrificio? (Why do we say the holy Mass is a sacrifice?)
  en: Decimos que la santa Misa es sacrificio porque en ella Jesucristo se ofrece como víctima, en reconocimiento de la suprema
    majestad de Dios, y en reparación de nuestros pecados. (Because in it Jesus Christ offers Himself as a victim, in acknowledgment
    of the supreme majesty of God and in reparation for our sins.)
- es: ¿Es la santa Misa el mismo sacrificio de la Cruz? (Is the holy Mass the same sacrifice as that of the Cross?)
  en: La santa Misa es el mismo sacrificio de la Cruz, porque en la Misa el mismo Jesucristo renueva el ofrecimiento de su
    pasión y muerte hecho en el Calvario. (The holy Mass is the very same sacrifice as that of the Cross, because in the Mass
    Jesus Christ Himself renews the offering of His passion and death made on Calvary.)
- es: ¿Cuáles son los fines de la santa Misa? (What are the ends of the holy Mass?)
  en: 'Los fines de la santa Misa son cuatro: adorar a Dios, darle gracias, pedirle beneficios y satisfacer por nuestros pecados.
    (The ends of the holy Mass are four: to adore God, to thank Him, to ask Him for blessings, and to make satisfaction for
    our sins.)'
- es: ¿Cuáles son las partes principales de la santa Misa? (What are the main parts of the holy Mass?)
  en: 'Las partes principales de la santa Misa son: el ofertorio, la consagración y la comunión. (The main parts of the holy
    Mass are: the offertory, the consecration, and the communion.)'
- es: ¿Qué es la sagrada Comunión? (What is holy Communion?)
  en: La sagrada Comunión es recibir al mismo Jesucristo bajo las especies de pan y vino. (Holy Communion is receiving Jesus
    Christ Himself under the appearances of bread and wine.)
- es: ¿Para qué recibimos a Jesucristo en la sagrada Comunión? (Why do we receive Jesus Christ in holy Communion?)
  en: Recibimos a Jesucristo en la sagrada Comunión para que sea alimento de nuestras almas, nos aumente la gracia y nos dé
    la vida eterna. (So that He may be the food of our souls, increase grace in us, and give us eternal life.)
- es: ¿Cuántas cosas son necesarias para recibir bien la sagrada Comunión? (How many things are necessary to receive holy
    Communion well?)
  en: 'Para recibir bien la sagrada Comunión son necesarias tres cosas: estar en gracia de Dios, guardar el ayuno eucarístico
    y saber a quién recibimos. (Three things: to be in the grace of God, to keep the Eucharistic fast, and to know whom we
    are receiving.)'
- es: ¿Qué quiere decir estar en gracia de Dios? (What does it mean to be in the grace of God?)
  en: Estar en gracia de Dios quiere decir estar limpio de pecado mortal. (To be free from mortal sin.)
- es: ¿Qué es guardar el ayuno eucarístico? (What is keeping the Eucharistic fast?)
  en: Guardar el ayuno eucarístico es no haber comido ni tomado bebidas alcohólicas desde tres horas antes, ni bebido otros
    líquidos desde una hora antes de comulgar. El agua no rompe el ayuno. (Not having eaten or drunk alcoholic beverages for
    three hours beforehand, nor drunk other liquids for one hour before receiving Communion. Water does not break the fast.)
- es: ¿Cómo hemos de acercarnos a la sagrada Comunión? (How should we approach holy Communion?)
  en: Hemos de acercarnos a la sagrada Comunión con fe viva, fervor, humildad y modestia. (We should approach holy Communion
    with living faith, fervor, humility, and modesty.)
